<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="aldus-entry-bootstrap-v305" content="20260811-duplicate-entry-bootstrap-v305" />
  <title>Aldus Metas Concurso — Painel de Estudos</title>
  <script>
  (() => {
    "use strict";

    const ENTRY_VERSION = "20260811-duplicate-entry-bootstrap-v305";
    const BATCH_VERSION = "20260811-duplicate-batch-commit-v305";
    const SHELL_URL = `docs/index.html?aldusEntry=${encodeURIComponent(ENTRY_VERSION)}&ts=${Date.now()}`;
    const BATCH_PATTERN = /<script\s+[^>]*src=["'][^"']*duplicate-diagnostics-batch-v(?:302|303|304|305)\.js[^"']*["'][^>]*><\/script>\s*/gi;

    function fail(error) {
      console.error(`[${ENTRY_VERSION}] Falha ao carregar o shell corrigido.`, error);
      const message = "Não foi possível ativar a correção V305 nesta atualização. Recarregue a página com conexão ativa.";
      document.open();
      document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aldus Metas</title></head><body style="font-family:Arial,sans-serif;padding:32px;background:#071a2d;color:#fff"><main style="max-width:760px;margin:auto"><h1>Aldus Metas</h1><p>${message}</p><button type="button" onclick="location.reload()" style="padding:12px 18px;font-weight:700">Recarregar</button></main></body></html>`);
      document.close();
    }

    try {
      const request = new XMLHttpRequest();
      request.open("GET", SHELL_URL, false);
      request.setRequestHeader("Cache-Control", "no-cache, no-store, must-revalidate");
      request.send(null);
      if (request.status < 200 || request.status >= 300 || !request.responseText) {
        throw new Error(`Shell indisponível (HTTP ${request.status || 0}).`);
      }

      let html = request.responseText.replace(BATCH_PATTERN, "");
      if (!html.includes("</body>")) throw new Error("Shell inválido: fechamento do body não encontrado.");

      const v305Tag = `<script id="aldusDuplicateBatchAuthoritativeV305" src="duplicate-diagnostics-batch-v305.js?v=${BATCH_VERSION}&entry=forced1"><\/script>`;
      html = html.replace(
        "</body>",
        `  <!-- aldus-entry-forced-v305 -->\n  ${v305Tag}\n</body>`
      );

      if (!html.includes("duplicate-diagnostics-batch-v305.js") || /src=["'][^"']*duplicate-diagnostics-batch-v304\.js/i.test(html)) {
        throw new Error("A barreira de versão não conseguiu isolar o handler V305.");
      }

      globalThis.__aldusEntryBootstrapV305 = Object.freeze({
        version: ENTRY_VERSION,
        batchVersion: BATCH_VERSION,
        loadedAt: new Date().toISOString()
      });

      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      fail(error);
    }
  })();
  </script>
</head>
<body>
  <noscript>Ative o JavaScript para usar o Aldus Metas Concurso.</noscript>
</body>
</html>
