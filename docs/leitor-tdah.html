<!doctype html>
<html lang="pt-BR" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leitor TDAH</title>
<style>
:root{--bg:#080e1b;--surface:#101b2b;--panel:#142136;--panel2:#17263d;--ink:#eaf1ff;--muted:#acbbd1;--border:#304158;
--green:#49A67B;--blue:#76ACDF;--amber:#E5B65C;--red:#E27A86;--purple:#AF90D8;--orange:#F58220;--orange-text:#FFA34C;
--head-ink:#071b22;--fs:22px;--radius:16px;
--hl-y:#f5d84a66;--hl-g:#5fdc9a55;--hl-p:#ff8fc855}
:root[data-theme="light"]{--bg:#f0f3f9;--surface:#fff;--panel:#f7f9fd;--panel2:#ecf2f9;--ink:#19263b;--muted:#586477;--border:#bdcbdc;
--green:#287D54;--blue:#367DB8;--amber:#B5872F;--red:#B04B59;--purple:#8463AD;--orange-text:#D86100;--head-ink:#fff;
--hl-y:#ffe45c99;--hl-g:#7be3a988;--hl-p:#ffb3d988}
@media (prefers-color-scheme: light){:root[data-theme="auto"]{--bg:#f0f3f9;--surface:#fff;--panel:#f7f9fd;--panel2:#ecf2f9;--ink:#19263b;--muted:#586477;--border:#bdcbdc;
--green:#287D54;--blue:#367DB8;--amber:#B5872F;--red:#B04B59;--purple:#8463AD;--orange-text:#D86100;--head-ink:#fff;--hl-y:#ffe45c99;--hl-g:#7be3a988;--hl-p:#ffb3d988}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:17px}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:.55rem .7rem}
textarea{width:100%;min-height:5.5rem;resize:vertical}
a{color:var(--blue)}
.btn{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:.5rem .85rem;font-size:.86rem;font-weight:650}
.btn:hover{border-color:var(--blue)}
.btn.prim{background:var(--blue);color:#06121f;border-color:var(--blue)}
.btn.ok{border-color:var(--green);color:var(--green)}
.btn.sm{padding:.3rem .6rem;font-size:.78rem}
.muted{color:var(--muted)}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:.7rem 1.2rem}
.top-row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.brand{font-size:.68rem;letter-spacing:.14em;font-weight:800;color:var(--blue)}
.assunto{font-weight:800;font-size:1.05rem;margin-right:auto}
.prog{height:6px;background:var(--panel2);border-radius:9px;margin-top:.55rem;overflow:hidden}
.prog>div{height:100%;background:var(--green);width:0}
main{max-width:1500px;margin:0 auto;padding:1rem 1.2rem 4rem}
.vazio{max-width:760px;margin:3rem auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:2rem}
.vazio h1{margin-top:0}
.vazio ol{line-height:1.7}
.grid{display:grid;grid-template-columns:34% 1fr;gap:1rem;align-items:start}
.grid.semmapa{grid-template-columns:1fr}
.mapa{position:sticky;top:5.2rem;max-height:calc(100vh - 6.5rem);overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:.7rem}
.mapa h3{font-size:.72rem;letter-spacing:.12em;color:var(--muted);margin:.2rem .3rem .6rem}
.bl{margin-bottom:.35rem}
.bl>button{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:.45rem .55rem;font-weight:750;font-size:.84rem;display:flex;gap:.4rem;align-items:center}
.bl>button:hover{border-color:var(--border)}
.bl.atual>button{border-color:var(--blue)}
.bl .st{margin-left:auto;font-size:.72rem;color:var(--muted);font-weight:600}
.trs{display:none;padding:.15rem 0 .35rem .55rem}
.bl.aberto .trs{display:block}
.tr{width:100%;text-align:left;background:var(--panel2);border:2px solid transparent;border-radius:9px;padding:.4rem .55rem;margin:.22rem 0;font-size:.8rem;display:flex;gap:.4rem;align-items:center}
.tr.atual{border-color:var(--green)}
.tr.nel{opacity:.5}
.tr .ic{margin-left:auto;font-size:.75rem;white-space:nowrap}
.dot{width:.6rem;height:.6rem;border-radius:50%;flex:none;background:var(--border)}
.dot.pronto{background:var(--green)}.dot.parcial{background:var(--amber)}
.hier{font-size:.8rem;color:var(--muted);margin:.1rem 0 .3rem}
.art-tit{font-size:1.75rem;font-weight:850;text-transform:uppercase;margin:.1rem 0 .8rem;letter-spacing:.01em}
.lei{border-bottom:2px dotted var(--blue);cursor:help}
#leiPop{position:absolute;z-index:70;display:none;width:min(560px,92vw);max-height:55vh;overflow:auto;background:var(--surface);color:var(--ink);border:2px solid var(--blue);border-radius:12px;padding:.8rem 1rem;box-shadow:0 14px 34px #0007;font-size:.95rem;line-height:1.5}
#leiPop .lei-cab{font-size:.82rem;margin:-.8rem -1rem .5rem;padding:.6rem 1rem .45rem;border-bottom:1px solid var(--border);position:sticky;top:-.8rem;background:var(--surface);z-index:1}
#leiPop .lei-txt{white-space:pre-wrap}
.lei-dest{background:var(--hl-y);font-weight:750}
.subt{font-size:1.15rem;font-weight:850;color:var(--blue);text-transform:uppercase;margin:-.4rem 0 .8rem;border-left:5px solid var(--blue);padding-left:.6rem}
.sub-mm{font-size:.7rem;font-weight:850;letter-spacing:.06em;color:var(--blue);text-transform:uppercase;margin:.7rem .2rem .2rem;border-bottom:1px solid var(--border);padding-bottom:.2rem}
.nav-row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}
.card{border:5px solid var(--cat,var(--green));border-radius:19px;background:var(--panel);overflow:hidden}
.card-head{background:var(--cat,var(--green));color:var(--head-ink);padding:.75rem 1.1rem}
.card-head .k{font-size:.72rem;letter-spacing:.12em;font-weight:800;opacity:.85}
.card-head .r{font-size:1.45rem;font-weight:900;text-transform:uppercase;margin-top:.15rem}
.card-body{padding:1.2rem 1.3rem}
.dest{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.7rem}
.dest .btn{padding:.25rem .55rem;font-size:.75rem}
.sw{display:inline-block;width:.85rem;height:.85rem;border-radius:3px;vertical-align:-2px}
#texto{font-size:var(--fs);line-height:1.55;white-space:pre-wrap}
.m-b{font-weight:850}.m-up{text-transform:uppercase}
.m-y{background:var(--hl-y)}.m-g{background:var(--hl-g)}.m-p{background:var(--hl-p)}
.selo{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.06em;border:1px solid var(--border);border-radius:99px;padding:.12rem .55rem;color:var(--muted);margin-left:.4rem;vertical-align:middle}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem;margin:1rem 0 .6rem}
.tool{background:var(--panel2);border:2px solid var(--border);border-radius:12px;padding:.7rem .4rem;font-weight:800;font-size:.84rem;position:relative}
.tool.ativo{border-color:var(--orange);color:var(--orange-text)}
.tool .tem{position:absolute;top:.25rem;right:.45rem;font-size:.62rem;color:var(--green)}
.mais{width:100%;margin:.2rem 0 .5rem;background:transparent;border:1px dashed var(--border);border-radius:12px;padding:.55rem;font-weight:800;font-size:.8rem;color:var(--muted)}
.painel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.2rem;margin-top:.4rem}
.painel h4{margin:.1rem 0 .7rem;font-size:1.05rem}
.fc{border:2px solid var(--border);border-radius:14px;padding:1.2rem;min-height:8rem;font-size:1.1rem;background:var(--panel2)}
.fc .v{margin-top:.9rem;padding-top:.9rem;border-top:1px dashed var(--border);color:var(--green);font-weight:650}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.7rem}
.item{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:.7rem .85rem;margin:.5rem 0}
.item .o{font-size:.7rem;font-weight:800;letter-spacing:.06em;color:var(--muted)}
dl.campos{display:grid;grid-template-columns:max-content 1fr;gap:.45rem 1rem;margin:0}
dl.campos dt{font-weight:800;color:var(--muted);font-size:.85rem;text-transform:uppercase}
dl.campos dd{margin:0}
.mm{display:flex;flex-direction:column;align-items:center;gap:.9rem}
.mm-c{background:var(--blue);color:#06121f;font-weight:900;border-radius:99px;padding:.7rem 1.3rem;text-align:center;max-width:80%}
.mm-rs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.7rem;width:100%}
.mm-r{border:2px solid var(--border);border-left:6px solid var(--purple);border-radius:12px;padding:.65rem .8rem;background:var(--panel2)}
.mm-r b{display:block;margin-bottom:.3rem;color:var(--c,var(--ink))}
.mm2{position:relative;display:grid;grid-template-columns:1fr minmax(150px,22%) 1fr;gap:2.4rem;align-items:center;padding:.4rem 0}
.mm-svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mm-lado{display:flex;flex-direction:column;gap:.9rem;position:relative;z-index:1}
.mm-meio{position:relative;z-index:1;display:flex;justify-content:center}
.mm2 .mm-c{max-width:100%;font-size:1.05rem;padding:1rem 1.1rem;border-radius:22px}
.mm2 .mm-r{border-left:6px solid var(--c);border-color:var(--c);background:var(--panel2)}
@media(max-width:860px){.mm2{grid-template-columns:1fr;gap:.8rem}.mm-svg{display:none}.mm-meio{order:-1}}
.mm-r ul{margin:.2rem 0 0;padding-left:1.1rem;font-size:.9rem}
.fl{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.fl-n{border:2px solid var(--border);border-radius:12px;padding:.6rem .9rem;background:var(--panel2);max-width:620px;width:100%;text-align:center}
.fl-n.condicao{border-color:var(--amber);border-radius:22px}
.fl-n.excecao{border-color:var(--red)}
.fl-n.consequencia{border-color:var(--green)}
.fl-n.inicio,.fl-n.fim{border-color:var(--blue)}
.fl-n .t{font-size:.66rem;letter-spacing:.1em;font-weight:800;color:var(--muted);text-transform:uppercase}
.fl-a{color:var(--muted);font-size:.85rem}
.fl-e{display:inline-block;margin:.15rem .25rem;font-size:.8rem;border:1px solid var(--border);border-radius:99px;padding:.1rem .55rem}
.fl-col{display:flex;flex-direction:column;align-items:center;gap:.25rem;flex:1;min-width:0;width:100%}
.fl-ramos{display:flex;gap:1rem;width:100%;align-items:flex-start}
.fl-rot{font-weight:900;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;padding:.15rem .7rem;border-radius:99px;border:2px solid var(--border)}
.fl-rot.sim{border-color:var(--green);color:var(--green)}.fl-rot.nao{border-color:var(--red);color:var(--red)}
.fl-ref{font-size:.85rem;color:var(--muted);border:1px dashed var(--border);border-radius:10px;padding:.35rem .6rem}
.fl .fl-n{max-width:none}
.fl-n.consequencia .flt,.fl-n.excecao .flt{font-weight:750}
.fl{gap:0}
.fl-col{gap:0}
.fl-n{margin:0}
.fl-seta{position:relative;width:4px;height:64px;background:var(--muted);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;border-radius:2px}
.fl-seta::after{content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);border-left:9px solid transparent;border-right:9px solid transparent;border-top:13px solid var(--muted)}
.fl-seta.sim{background:var(--green)}.fl-seta.sim::after{border-top-color:var(--green)}
.fl-seta.nao{background:var(--red)}.fl-seta.nao::after{border-top-color:var(--red)}
.fl-seta .fl-rot{position:relative;z-index:1;background:var(--panel);white-space:nowrap}
.fl-tronco{width:4px;height:26px;background:var(--muted);margin:0 auto;border-radius:2px}
.fl-ramos{display:flex;width:100%;gap:0;align-items:flex-start}
.fl-ramo{position:relative;flex:1;min-width:0;padding:0 .55rem;display:flex;flex-direction:column;align-items:center}
.fl-ramo::before{content:'';position:absolute;top:0;left:0;right:0;border-top:4px solid var(--muted)}
.fl-ramo:first-child::before{left:50%}.fl-ramo:last-child::before{right:50%}.fl-ramo:only-child::before{display:none}
.fl-n.grande{font-size:1.3rem;padding:1.4rem 1.2rem;max-width:780px;margin:0 auto;width:100%}
.fl-cam{font-size:.88rem;color:var(--muted);margin:0 auto .8rem;text-align:center;max-width:780px}
.fl-n .t{font-size:.72rem}
.esc-linha{display:grid;grid-template-columns:minmax(0,1fr) 120px minmax(0,1fr);align-items:center;width:100%}
.esc-linha>.fl-n{height:100%;display:flex;flex-direction:column;justify-content:center}
.esc-seta{position:relative;height:4px;background:var(--muted);margin-right:14px;display:flex;align-items:center;justify-content:center}
.esc-seta::after{content:'';position:absolute;right:-14px;top:50%;transform:translateY(-50%);border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:14px solid var(--muted)}
.esc-seta.sim{background:var(--green)}.esc-seta.sim::after{border-left-color:var(--green)}
.esc-seta.nao{background:var(--red)}.esc-seta.nao::after{border-left-color:var(--red)}
.esc-seta .fl-rot{background:var(--panel);position:relative;z-index:1}
.esc-desce{position:relative;width:calc((100% - 120px)/2);height:58px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.esc-desce::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);background:var(--muted)}
.esc-desce::after{content:'';position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);border-left:9px solid transparent;border-right:9px solid transparent;border-top:14px solid var(--muted)}
.esc-desce.sim::before{background:var(--green)}.esc-desce.sim::after{border-top-color:var(--green)}
.esc-desce.nao::before{background:var(--red)}.esc-desce.nao::after{border-top-color:var(--red)}
.esc-desce .fl-rot{position:relative;z-index:1;background:var(--panel)}
.esc-final{width:100%}
.fl-col{align-items:stretch}
.fl-col>.esc-desce{align-self:flex-start}
@media(max-width:860px){.fl-ramos{flex-direction:column}.fl-ramo::before{display:none}.esc-linha{grid-template-columns:1fr}.esc-seta{width:4px;height:40px;margin:0 auto 14px}.esc-seta::after{right:auto;left:50%;top:auto;bottom:-14px;transform:translateX(-50%);border-left:9px solid transparent;border-right:9px solid transparent;border-top:14px solid var(--muted)}.esc-desce{width:100%}}
.toast{position:fixed;left:50%;bottom:1.3rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:12px;font-weight:700;z-index:99;display:none;max-width:90vw}
.modal{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:4vh 1rem;overflow:auto}
.modal.on{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:min(980px,100%);padding:1.2rem 1.3rem}
.modal-box h2{margin:.1rem 0 .8rem}
table.lst{width:100%;border-collapse:collapse;font-size:.88rem}
table.lst td,table.lst th{border-bottom:1px solid var(--border);padding:.5rem .4rem;text-align:left;vertical-align:middle}
.ok-t{color:var(--green);font-weight:800}.pa-t{color:var(--amber);font-weight:800}.pe-t{color:var(--muted)}
.chk{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.3rem .8rem;margin:.5rem 0}
img.ev{max-width:100%;border-radius:12px;border:1px solid var(--border)}
@media(max-width:860px){.grid{grid-template-columns:1fr}.mapa{position:static;max-height:45vh}.tools{grid-template-columns:repeat(2,1fr)}.art-tit{font-size:1.35rem}main{padding:1rem}}
</style>
</head>
<body>
<header class="top" id="topo">
 <div class="top-row">
  <div><div class="brand">LEITOR TDAH</div><div class="assunto" id="assunto">Nenhum resumo aberto</div></div>
  <span style="flex:1"></span>
  <button class="btn prim" id="bAbrir">📂 Abrir resumo</button>
  <button class="btn" id="bArtigos" hidden>🤖 Gerar conteúdo</button>
  <button class="btn" id="bRevisao" hidden>⭐ Revisão</button>
  <button class="btn" id="bSalvar" hidden>💾 Salvar HTML</button>
  <button class="btn" id="bMapa" hidden>◧ Mapa</button>
  <button class="btn" id="bMenos" title="Letra menor">A−</button>
  <button class="btn" id="bMais" title="Letra maior">A+</button>
  <button class="btn" id="bTema">🌓 Tema</button>
 </div>
 <div class="prog" id="prog" hidden><div></div></div>
</header>
<main id="app"></main>
<input type="file" id="fAbrir" accept=".docx,.json" hidden>
<input type="file" id="fPacotes" accept=".json,.txt" multiple hidden>
<input type="file" id="fImagem" accept="image/*" hidden>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script id="dados-embutidos" type="application/json">{}</script>
<script>
'use strict';
/* ============ fonte da página (para Salvar HTML) ============ */
const FONTE_PAGINA='<!doctype html>\n'+document.documentElement.outerHTML;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const negrito=s=>esc(s).replace(/\*\*(.+?)\*\*/gs,'<b>$1</b>');
const limpa=s=>String(s??'').replace(/\*\*/g,'').replace(/\s+/g,' ').trim();
const pad=(n,k=3)=>String(n).padStart(k,'0');
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',ms)}
async function copiar(txt){try{await navigator.clipboard.writeText(txt);return true}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}

/* ============ estado ============ */
let S=null; // {inv, content:{blocos,trechos}, user, salvoEm}
const novoUser=()=>({pos:{b:0,t:0},prov:{},notas:{},marcas:{},cards:{},cardsUser:{},imagens:{},jurUser:{},mnemoUser:{},mapaUser:{},fluxoUser:{},tutorResp:{},duvidas:{},vistos:{},tool:'',mais:false,mapaFechado:false,soErrados:false});
let tema=lsGet('leitor-tdah:tema')||'auto', fs=+(lsGet('leitor-tdah:fs')||22);
function aplicaPrefs(){document.documentElement.dataset.theme=tema;document.documentElement.style.setProperty('--fs',fs+'px')}
aplicaPrefs();
/* ---- parâmetros quando aberto pela Fábrica do site ---- */
const PARAM=new URLSearchParams(location.search);const ITEM=PARAM.get('item')||'',TEMA=PARAM.get('tema')||'',DISC=PARAM.get('disciplina')||'',PASTA=PARAM.get('pasta')||'';
// V670: aberto pela Fábrica (site), QUESTÕES leva ao Treino do site; avulso continua copiando o pedido.
const NO_SITE=!!ITEM&&/^https?:/.test(location.protocol);
/* ---- armazenamento: IndexedDB próprio do leitor (localStorage antigo só é lido) ---- */
const IDB_NOME='aldus-leitor-tdah';
function idb(){return idb.p||(idb.p=new Promise((res,rej)=>{const r=indexedDB.open(IDB_NOME,1);r.onupgradeneeded=()=>{const db=r.result;for(const n of ['estados','itens'])if(!db.objectStoreNames.contains(n))db.createObjectStore(n)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function idbGet(st,k){try{const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction(st).objectStore(st).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return undefined}}
async function idbSet(st,k,v){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction(st,'readwrite');t.objectStore(st).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)});return true}catch(e){return false}}
async function lerEstado(aid){if(!aid)return null;const v=await idbGet('estados',aid);if(v&&v.inv)return v;try{const l=JSON.parse(lsGet('leitor-tdah:'+aid)||'null');if(l&&l.inv)return l}catch(e){}return null}
const canal=('BroadcastChannel' in window)?new BroadcastChannel('aldus-leitor-tdah'):null;const ABA=Math.random().toString(36).slice(2);
let tSalvar=null,pendente=false;
async function gravarAgora(){if(!S)return;clearTimeout(tSalvar);pendente=false;S.salvoEm=new Date().toISOString();const aid=S.inv.assunto_id;const ok=await idbSet('estados',aid,S);lsSet('leitor-tdah:ultimo',aid);if(ITEM)await idbSet('itens',ITEM,aid);if(canal)canal.postMessage({aid,aba:ABA,em:S.salvoEm});if(!ok&&!lsSet('leitor-tdah:'+aid,JSON.stringify(S)))toast('⚠️ Não consegui salvar neste navegador.');salvarNuvem()}
function salvar(){if(!S)return;pendente=true;clearTimeout(tSalvar);tSalvar=setTimeout(gravarAgora,300)}

async function lerZip(buf){
 const dv=new DataView(buf),u8=new Uint8Array(buf);let eocd=-1;
 for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}
 if(eocd<0)throw new Error('Arquivo não parece um Word (.docx).');
 const n=dv.getUint16(eocd+10,true);let p=dv.getUint32(eocd+16,true);const out={};const dec=new TextDecoder();
 for(let k=0;k<n;k++){const met=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
  const nome=dec.decode(u8.subarray(p+46,p+46+nl));out[nome]={met,csz,off};p+=46+nl+xl+cl}
 return async nome=>{const e=out[nome];if(!e)return null;const ln=dv.getUint16(e.off+26,true),lx=dv.getUint16(e.off+28,true);const dado=u8.subarray(e.off+30+ln+lx,e.off+30+ln+lx+e.csz);
  if(e.met===0)return dec.decode(dado);
  const ds=new Blob([dado]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(ds).text()}
}

- RESUMO INTELIGENTE: regra, sujeitos, requisitos, limites, exceções, pena, ponto de prova. Campo que não se aplica fica vazio.
- MNEMÔNICOS: 1 ou 2 criados por você ("origem": "autoral"), com a explicação.
2.2 PARA CADA TRECHO COM "elegivel": true (pule os outros):
- 3 FLASHCARDS, cada um por um ângulo diferente (conceito, requisito, limite, consequência, exceção, distinção, aplicação). O verso não é a regra copiada.
- POR QUÊ?: 2 a 4 frases sobre o fundamento e a lógica do trecho, sem repetir o texto.
- TEXTO FÁCIL: reescrita didática do trecho em 3 a 6 frases curtas, com um exemplo quando ajudar.
- GLOSSÁRIO: só termos difíceis que aparecem pela primeira vez no artigo. Sem termo difícil → lista vazia.
- JURISPRUDÊNCIA: só julgados citados no próprio texto e ligados a este trecho ("origem": "documento"). Sem julgado → lista vazia.

3. REGRAS
1) Copie o texto do trecho exato em "texto_original_conferido".
2) Não invente lei, julgado, número de processo, data, prazo, pena ou exceção.
3) Não pesquise na internet. O que você não tiver certeza vai para "pendencias".
4) Não repita flashcard nem explicação, nem com outras palavras.

function extrairJsons(txt){const out=[];let i=0;const s=String(txt);
 while(i<s.length){const a=s.indexOf('{',i);if(a<0)break;let dep=0,q=false,e=false,fim=-1;
  for(let k=a;k<s.length;k++){const c=s[k];if(q){if(e)e=false;else if(c==='\\')e=true;else if(c==='"')q=false;continue}if(c==='"'){q=true;continue}if(c==='{')dep++;else if(c==='}'){dep--;if(!dep){fim=k;break}}}
  if(fim<0)break;try{out.push(JSON.parse(s.slice(a,fim+1)));i=fim+1}catch(err){i=a+1}}
 return out}

  const lista=Array.isArray(o)?o:(o.pacotes||[o]);
  for(const p of lista){
   if(p.bloco&&p.bloco.id){const b=S.inv.blocos.find(x=>x.id===p.bloco.id);if(!b)rel.rec.push([p.bloco.id,'artigo não existe neste resumo']);else{for(const c of CAMPOS_BLOCO)if(p.bloco[c]!=null){plano.push(['b',b.id,c,p.bloco[c]]);if(S.content.blocos[b.id]&&S.content.blocos[b.id][c]!=null)subst.push(b.id+' · '+c)}rel.blocos.push(b.id)}}
   for(const t of (p.trechos||[])){const r=mt[t.id];
    if(!r){rel.rec.push([t.id,'trecho não existe neste resumo']);continue}
    if(t.texto_original_conferido!=null&&limpa(t.texto_original_conferido).replace(/\s/g,'')!==limpa(r.t.texto).replace(/\s/g,'')){rel.rec.push([t.id,'o texto não bate com o do resumo']);continue}
    let n=0;for(const c of CAMPOS_TRECHO)if(t[c]!=null){let v=t[c];if(c==='por_que'&&typeof v==='object')v=Object.values(v).filter(Boolean).join(' ');plano.push(['t',t.id,c,v]);n++;if(S.content.trechos[t.id]&&S.content.trechos[t.id][c]!=null)subst.push(t.id+' · '+c)}

    if(Array.isArray(t.pendencias)&&t.pendencias.length)plano.push(['t',t.id,'pendencias',t.pendencias]);
    rel.ok.push(t.id);if(t.pendencias&&t.pendencias.length)rel.pend.push([t.id,t.pendencias.join(' ')])}
  }}
 let trocar=true;if(subst.length&&!silencioso)trocar=confirm(subst.length+' ferramenta(s) já têm conteúdo e seriam substituídas.\n\nOK = substituir · Cancelar = manter o que já existe e só acrescentar o que falta');

 salvar();return rel}

 qconc:()=>`${ctxPrompt()}\n\nFaça um quiz rápido de 3 itens (A–D) só com os CONCEITOS jurídicos que aparecem neste trecho. Um item por vez; espere minha resposta e corrija.`,
 qpraz:()=>`${ctxPrompt()}\n\nFaça um quiz rápido de até 3 itens (A–D) só com PRAZOS, penas, marcos temporais e idades deste trecho. Se não houver nenhum, diga só "Este trecho não tem prazos". Um item por vez; espere minha resposta e corrija.`,
 qexc:()=>`${ctxPrompt()}\n\nFaça um quiz rápido de até 3 itens (A–D) só com EXCEÇÕES, ressalvas e vedações reais deste trecho. Não invente exceção; se não houver, diga só "Este trecho não tem exceções". Um item por vez; espere minha resposta e corrija.`};
const REGRA_FLUXO=`ROTEIRO PARA RESOLVER QUESTÃO DE PROVA (4 a 8 nós). Comece por uma PERGUNTA concreta sobre o caso (tipo "condicao"), por exemplo "O titular é absolutamente incapaz?". Cada pergunta tem duas saídas, "sim" e "não". Cada saída termina numa RESPOSTA concreta (tipo "consequencia" ou "excecao") com o artigo, por exemplo "Não corre prescrição — art. 198, I". PROIBIDO nó genérico como "Identificar…", "Examinar…", "Analisar…", "Início" ou "Fim". Se o artigo não tiver decisão real, faça uma sequência de 3 a 5 passos concretos ("tipo": "sequencia"). TEXTO CURTO: no máximo 18 palavras por nó e UMA hipótese por nó; se houver várias hipóteses ou prazos, faça mais perguntas encadeadas em vez de listar tudo numa caixa. Prefira a forma em escada: a saída que resolve vai para uma RESPOSTA, a outra segue para a PERGUNTA seguinte.`;
PROMPTS.juris=()=>`${ctxPrompt()}\n\nPesquise jurisprudência do STF e do STJ sobre ESTE trecho, em fonte oficial (stf.jus.br, stj.jus.br, informativos, súmulas, temas repetitivos e de repercussão geral). Traga até 5 julgados, os mais cobrados em prova. Inclua só o que você encontrou de verdade, com o link; não invente número de processo. Diga se a aplicação ao trecho é "direta" ou "relacionada".\nResponda com UM bloco de código JSON (sem arquivo para download):\n{"jurisprudencia":[{"tribunal":"","orgao":"","processo":"","data":"","tese":"","fundamentos":"","fonte":"link","aplicacao":"direta ou relacionada"}]}\nSe não achar nada confiável, responda {"jurisprudencia":[]} e explique em uma linha.`;
PROMPTS.cards=()=>{const id=T().id;const tem=[...(cT().flashcards||[]),...(S.user.cardsUser[id]||[])].map(c=>'- '+limpa(c.frente));return `${ctxPrompt()}\n\nCrie 5 FLASHCARDS NOVOS sobre este trecho, de nível de prova de Delegado, cada um por um ângulo diferente (conceito, requisito, exceção, distinção com instituto vizinho, aplicação a caso concreto, pegadinha). ${tem.length?'Não repita estes, que eu já tenho:\n'+tem.join('\n')+'\n':''}Verso curto e preciso. Não invente lei nem julgado.\nResponda com UM bloco de código JSON (sem arquivo para download):\n{"flashcards":[{"angulo":"","frente":"","verso":""}]}`};
PROMPTS.fluxo=()=>{const b=B();return `Artigo: ${limpa(b.titulo)}${b.capitulo?' ('+limpa(b.capitulo)+')':''}\nTexto do resumo:\n${b.trechos.filter(t=>t.elegivel).map(t=>'- '+limpa(t.texto)).join('\n')}\n\nFaça um FLUXOGRAMA deste artigo como ${REGRA_FLUXO}\nNão invente lei, prazo nem exceção.\nResponda com UM bloco de código JSON (sem arquivo para download):\n{"fluxograma":{"tipo":"decisao ou sequencia","nos":[{"id":"n1","tipo":"condicao, consequencia ou excecao","texto":""}],"ligacoes":[{"de":"n1","para":"n2","rotulo":"sim ou não"}]}}`};
async function copiarPrompt(k){const ok=await copiar(PROMPTS[k]());toast(ok?'Pedido copiado. Cole numa conversa nova do ChatGPT.':'Não consegui copiar.')}
/* V670: QUESTÕES → Treino do site. A aba do site que abriu o leitor (parâmetro aba) abre o Treino; sem ela, outra aba do site. */
const canalSite=('BroadcastChannel' in window)?new BroadcastChannel('aldus-leitor-tdah-site'):null;
function semSite(){abrirModal(`<h2>📝 Treino de questões</h2><p>Não achei o site Aldus aberto neste navegador.</p><ol><li>Clique em <b>Abrir o site Aldus</b>.</li><li>Espere o site carregar.</li><li>Volte aqui e clique de novo em <b>📝 Abrir o Treino no site</b>.</li></ol><div class="row"><a class="btn prim" href="./" target="_blank" rel="noopener" onclick="fecharModal()">🌐 Abrir o site Aldus</a><button class="btn" onclick="fecharModal()">Fechar</button></div>`)}
function abrirTreino(){const msg=t=>{const p=$('#treinoMsg');if(p)p.innerHTML=t};if(!canalSite){semSite();return}
 const id=Math.random().toString(36).slice(2);let fim=false;msg('⏳ Abrindo o Treino na aba do site…');
 const acabar=()=>{fim=true;canalSite.removeEventListener('message',ouvir);clearTimeout(tm)};
 const ouvir=e=>{const d=e.data||{};if(fim||d.id!==id)return;acabar();
  if(d.tipo==='treino-aberto'){msg('✅ <b>O Treino abriu na aba do site Aldus</b> (a aba com 📝 no nome). Clique nela.');toast('Treino aberto na aba do site.')}
  else msg('⚠️ A aba do site não conseguiu abrir o Treino. Na Fábrica, abra este assunto e clique em <b>Treino de questões</b>.')};
 const tm=setTimeout(()=>{if(fim)return;acabar();msg('');semSite()},4000);
 canalSite.addEventListener('message',ouvir);
 canalSite.postMessage({tipo:'abrir-treino',id,item:ITEM,tema:TEMA,disciplina:DISC,aba:PARAM.get('aba')||''})}
const NOME_COLAR={juris:'julgados',cards:'flashcards',fluxo:'fluxograma'};
function colarFerramenta(k){abrirModal(`<h2>📥 Colar ${NOME_COLAR[k]} do ChatGPT</h2><p class="muted">Copie a resposta da Joana (botão ⧉ do quadro de código), clique na caixa e aperte Ctrl+V.</p><textarea id="taFerr" style="min-height:40vh" placeholder="Cole aqui"></textarea><div class="row"><button class="btn prim" onclick="guardarFerramenta('${k}')">✔ Guardar</button><button class="btn" onclick="fecharModal()">Cancelar</button></div>`);setTimeout(()=>$('#taFerr').focus(),50)}
function guardarFerramenta(k){const objs=extrairJsons($('#taFerr').value);const id=T().id,bid=B().id;let n=0;
 if(k==='cards'){const it=objs.flatMap(o=>Array.isArray(o.flashcards)?o.flashcards:(o.frente&&o.verso?[o]:[])).filter(c=>c&&c.frente&&c.verso);const arr=S.user.cardsUser[id]=S.user.cardsUser[id]||[];for(const c of it){arr.push({frente:c.frente,verso:c.verso,angulo:c.angulo||''});n++}}
 else if(k==='juris'){const it=objs.flatMap(o=>Array.isArray(o.jurisprudencia)?o.jurisprudencia:Array.isArray(o.julgados)?o.julgados:((o.tese||o.processo)?[o]:[])).filter(j=>j&&(j.tese||j.processo));const arr=S.user.jurUser[id]=S.user.jurUser[id]||[];for(const j of it){arr.push({...j,origem:'pesquisa no ChatGPT'});n++}}
 else if(k==='fluxo'){const f=objs.map(o=>o.fluxograma||(Array.isArray(o.nos)?o:null)).find(Boolean);if(f&&(f.nos||[]).length){(S.content.blocos[bid]=S.content.blocos[bid]||{}).fluxograma=f;delete S.user.fluxoUser[bid];n=f.nos.length}}
 if(!n){alert('Não encontrei o conteúdo na resposta colada. Copie o quadro de código inteiro da Joana e tente de novo.');return}
 salvar();fecharModal();render();toast(k==='fluxo'?'Fluxograma novo guardado.':n+' '+NOME_COLAR[k]+' guardado(s) neste trecho.')}
const OPC_DUV=['O significado','Um exemplo prático','Comparação com instituto parecido','O fundamento','Quando incide','As exceções','As consequências','Jurisprudência','Pegadinhas de prova'];
function painel(){const k=S.user.tool;if(!k)return '';const t=T(),b=B(),ct=cT(),cb=cB(),u=S.user;let h='';
 const nome=[...TOOLS8,...TOOLS10].find(x=>x[0]===k);h+=`<h4>${nome[1]} ${nome[2]}${CAMPOS_BLOCO_TOOL.includes(k)?doArtigo:''}</h4>`;
 switch(k){
 case 'quest':if(NO_SITE){h+=`<p>As questões são feitas no <b>Treino de questões do site</b>, com o assunto deste resumo.</p><div class="row"><button class="btn prim" onclick="abrirTreino()">📝 Abrir o Treino no site</button></div><p id="treinoMsg" style="margin-top:.6rem"></p>`;break}
 case 'qconc':case 'qpraz':case 'qexc':
  h+=`<p>Esta ferramenta é feita <b>na hora, no ChatGPT</b>: a Joana pergunta, você responde e ela corrige.</p><div class="row"><button class="btn prim" onclick="copiarPrompt('${k}')">📋 Copiar pedido para o ChatGPT</button></div><details style="margin-top:.8rem"><summary class="muted">Ver o pedido</summary><p style="white-space:pre-wrap">${esc(PROMPTS[k]())}</p></details>`;break;
 case 'porque':h+=ct.por_que?`<p style="font-size:1.08rem;line-height:1.6">${negrito(ct.por_que)}</p>`:(t.elegivel?vazioPacote:'<p class="muted">Trecho sem conteúdo para estudar.</p>');break;
 case 'facil':{if(!ct.texto_facil){h+=t.elegivel?vazioPacote:'<p class="muted">Trecho sem conteúdo para estudar.</p>';break}const of=u.verOriginal;h+=`<div class="row" style="margin-top:0"><button class="btn ${!of?'prim':''}" onclick="S.user.verOriginal=false;render()">✍️ Texto fácil</button><button class="btn ${of?'prim':''}" onclick="S.user.verOriginal=true;render()">📄 Texto original</button></div><p style="font-size:var(--fs);line-height:1.6;white-space:pre-wrap;margin-top:.9rem">${negrito(of?t.texto:ct.texto_facil)}</p>`;break}
 case 'glos':{const g=ct.glossario||[];h+=g.length?g.map(x=>`<div class="item"><b>${esc(x.termo)}</b> — ${negrito(x.significado)}${x.exemplo?`<br><span class="muted">Ex.: ${esc(x.exemplo)}</span>`:''}</div>`).join(''):`<p class="muted">${ct.glossario?'Nenhum termo difícil novo neste trecho.':(t.elegivel?'Ainda sem conteúdo.':'Trecho sem conteúdo para estudar.')}</p>`;
  const todos=b.trechos.flatMap(x=>(S.content.trechos[x.id]||{}).glossario||[]);if(todos.length>g.length)h+=`<details><summary class="muted">Todos os termos do artigo (${todos.length})</summary>${todos.map(x=>`<div class="item"><b>${esc(x.termo)}</b> — ${negrito(x.significado)}</div>`).join('')}</details>`;break}
 case 'cards':h+=painelCards();break;
 case 'juris':h+=painelJuris();break;
 case 'mnemo':h+=painelMnemo();break;
 case 'notas':h+=`<textarea id="taNota" placeholder="Escreva sua anotação deste trecho (salva sozinha)" oninput="S.user.notas[T().id]=this.value;if(!this.value)delete S.user.notas[T().id];salvar()">${esc(u.notas[t.id]||'')}</textarea><p class="muted" style="font-size:.8rem">Salva sozinha enquanto você escreve.</p>`;break;
 case 'perg':h+=`<p class="muted">Marque o que quer saber, escreva a dúvida (opcional) e copie o pedido para o ChatGPT.</p><div class="chk">${OPC_DUV.map((o,i)=>`<label><input type="checkbox" class="cbDuv" value="${esc(o)}" ${i<2?'checked':''}> ${esc(o)}</label>`).join('')}</div><textarea id="taDuv" placeholder="Minha dúvida (opcional)"></textarea><div class="row"><button class="btn prim" onclick="copiarDuvida()">📋 Copiar pedido para o ChatGPT</button></div>
  <h4 style="margin-top:1.2rem">Respostas que eu guardei</h4><textarea id="taDuvResp" placeholder="Cole aqui a resposta da Joana que você quer guardar"></textarea><div class="row"><button class="btn ok" onclick="guardarDuvida()">💾 Guardar resposta</button></div>${(u.duvidas[t.id]||[]).map((d,i)=>`<div class="item"><div class="o">${esc(d.q||'Dúvida')} · ${new Date(d.em).toLocaleDateString('pt-BR')}</div><div style="white-space:pre-wrap">${esc(d.r)}</div><button class="btn sm" onclick="S.user.duvidas[T().id].splice(${i},1);salvar();render()">Excluir</button></div>`).join('')}`;break;
 case 'mapa':h+=painelMapa();break;
 case 'fluxo':h+=painelFluxo();break;
 case 'img':h+=painelImg();break;
 case 'tutor':h+=painelTutor();break;
 case 'resumo':{const r=cb.resumo_inteligente;if(!r){h+=vazioPacote;break}const L={regra:'Regra',sujeitos:'Sujeitos',requisitos:'Requisitos',limites:'Limites',excecoes:'Exceções',pena:'Pena',ponto_de_prova:'Ponto de prova',fundamento:'Fundamento',exemplo:'Exemplo',consequencias:'Consequências'};h+=`<dl class="campos">${Object.entries(r).filter(([,v])=>v).map(([c,v])=>`<dt>${esc(L[c]||c)}</dt><dd>${negrito(v)}</dd>`).join('')}</dl>`;break}
 }
 return `<div class="painel">${h}</div>`}
const CAMPOS_BLOCO_TOOL=['mapa','fluxo','img','tutor','resumo','mnemo'];
async function copiarDuvida(){const ops=[...document.querySelectorAll('.cbDuv:checked')].map(c=>c.value);const q=$('#taDuv').value.trim();
 const p=`${ctxPrompt()}\n\nTenho uma dúvida sobre este trecho${q?': '+q:'.'}\nExplique de forma didática e curta, só sobre este trecho: ${ops.join('; ')||'o significado'}. Não invente lei nem julgado; se não tiver certeza, diga.`;
 S.user.ultimaDuv=q;const ok=await copiar(p);toast(ok?'Pedido copiado. Cole no ChatGPT.':'Não consegui copiar.')}
function guardarDuvida(){const r=$('#taDuvResp').value.trim();if(!r)return;const id=T().id;(S.user.duvidas[id]=S.user.duvidas[id]||[]).unshift({q:S.user.ultimaDuv||'',r,em:Date.now()});salvar();render();toast('Resposta guardada neste trecho.')}

/* flashcards */
let fcI=0,fcVirado=false,fcTrecho='';
function listaCards(){const id=T().id;const base=(cT().flashcards||[]).map((c,i)=>({...c,_k:'p'+i}));const us=(S.user.cardsUser[id]||[]).map((c,i)=>({...c,_k:'u'+i}));let l=[...base,...us];if(S.user.soErrados)l=l.filter(c=>(S.user.cards[id]||{})[c._k]==='err');return l}
function painelCards(){const id=T().id;if(fcTrecho!==id){fcI=0;fcVirado=false;fcTrecho=id}const l=listaCards();const res=S.user.cards[id]||{};const ac=Object.values(res).filter(v=>v==='ok').length,er=Object.values(res).filter(v=>v==='err').length;
 let h=`<div class="row" style="margin-top:0;margin-bottom:.6rem"><button class="btn prim" onclick="copiarPrompt('cards')">🤖 Pedir mais flashcards ao ChatGPT</button><button class="btn ok" onclick="colarFerramenta('cards')">📥 Colar flashcards</button></div><div class="row" style="margin-top:0"><span class="muted">✔ ${ac} · ✖ ${er}</span><label style="margin-left:auto"><input type="checkbox" ${S.user.soErrados?'checked':''} onchange="S.user.soErrados=this.checked;fcI=0;render()"> só os que errei</label></div>`;
 if(!l.length)return h+(S.user.soErrados?'<p class="muted">Nenhum errado aqui. 👏</p>':(T().elegivel?vazioPacote:'<p class="muted">Trecho sem conteúdo para estudar.</p>'))+`<div class="row"><button class="btn" onclick="novoCard()">＋ Criar meu cartão</button></div>`;
 fcI=Math.min(fcI,l.length-1);const c=l[fcI];
 h+=`<div class="fc"><div class="muted" style="font-size:.75rem">CARTÃO ${fcI+1} DE ${l.length}${c.angulo?' · '+esc(c.angulo).toUpperCase():''}${c._k[0]==='u'?' · MEU':''}</div><div style="margin-top:.5rem;font-weight:750">${negrito(c.frente)}</div>${fcVirado?`<div class="v">${negrito(c.verso)}${c.explicacao?`<div class="muted" style="font-weight:400;margin-top:.4rem">${negrito(c.explicacao)}</div>`:''}</div>`:''}</div>
 <div class="row">${fcVirado?`<button class="btn ok" onclick="marcaCard('${c._k}','ok')">✔ Acertei</button><button class="btn" style="border-color:var(--red);color:var(--red)" onclick="marcaCard('${c._k}','err')">✖ Errei</button>`:`<button class="btn prim" onclick="fcVirado=true;render()">🔄 Virar</button>`}
 <button class="btn" onclick="fcI=(fcI-1+${l.length})%${l.length};fcVirado=false;render()">←</button><button class="btn" onclick="fcI=(fcI+1)%${l.length};fcVirado=false;render()">→</button>
 <button class="btn sm" onclick="editarCard('${c._k}')">✎ Editar</button><button class="btn sm" onclick="novoCard()">＋ Meu cartão</button></div>`;return h}
function marcaCard(k,v){const id=T().id;(S.user.cards[id]=S.user.cards[id]||{})[k]=v;salvar();fcVirado=false;const l=listaCards();fcI=l.length?(fcI+1)%l.length:0;render()}
function novoCard(){const f=prompt('Frente do cartão (pergunta):');if(!f)return;const v=prompt('Verso (resposta):');if(v==null)return;const id=T().id;(S.user.cardsUser[id]=S.user.cardsUser[id]||[]).push({frente:f,verso:v});salvar();render()}
function editarCard(k){const id=T().id;const arr=k[0]==='p'?(S.content.trechos[id].flashcards):(S.user.cardsUser[id]);const c=arr[+k.slice(1)];const f=prompt('Frente:',c.frente);if(f==null)return;const v=prompt('Verso:',c.verso);if(v==null)return;c.frente=f;c.verso=v;salvar();render()}

/* jurisprudência */
function painelJuris(){const id=T().id;const p=cT().jurisprudencia||[];const us=S.user.jurUser[id]||[];
 const card=(j,i,meu)=>`<div class="item"><div class="o">${meu?(j.origem==='pesquisa no ChatGPT'?'PESQUISADO NO CHATGPT — CONFIRA O LINK':'CADASTRADO POR MIM'):(j.origem==='documento'?'DO RESUMO':esc((j.origem||'').toUpperCase()))}${j.aplicacao?' · '+esc(j.aplicacao.toUpperCase()):''}</div><b>${esc([j.tribunal,j.orgao,j.processo,j.data].filter(Boolean).join(' · '))}</b><div>${negrito(j.tese||j.resumo||'')}</div>${j.fundamentos?`<div class="muted">${esc(j.fundamentos)}</div>`:''}${j.fonte?`<div class="muted" style="font-size:.8rem">Fonte: ${/^https?:/.test(j.fonte)?`<a href="${esc(j.fonte)}" target="_blank" rel="noopener">${esc(j.fonte)}</a>`:esc(j.fonte)}</div>`:''}${meu?`<button class="btn sm" onclick="S.user.jurUser[T().id].splice(${i},1);salvar();render()">Excluir</button>`:''}</div>`;
 let h=`<div class="row" style="margin-top:0;margin-bottom:.6rem"><button class="btn prim" onclick="copiarPrompt('juris')">🔎 Pesquisar julgados no ChatGPT</button><button class="btn ok" onclick="colarFerramenta('juris')">📥 Colar julgados</button></div>`;
 h+=(p.length||us.length)?p.map((j,i)=>card(j,i,0)).join('')+us.map((j,i)=>card(j,i,1)).join(''):'<p class="muted">Nenhum julgado ligado a este trecho.</p>';
 h+=`<details style="margin-top:.8rem"><summary><b>＋ Cadastrar julgado</b></summary><p class="muted">Cole um texto qualquer sobre o julgado e clique em <b>Distribuir nas caixas</b>, ou preencha à mão.</p><textarea id="jCola" placeholder="Cole aqui o texto do julgado"></textarea><div class="row"><button class="btn" onclick="distribuir()">✨ Distribuir nas caixas</button></div>
 <div class="chk">${['tribunal','orgao','processo','data','fonte'].map(c=>`<input id="j_${c}" placeholder="${{tribunal:'Tribunal',orgao:'Órgão julgador',processo:'Processo',data:'Data',fonte:'Fonte / link'}[c]}">`).join('')}</div><textarea id="j_tese" placeholder="Tese / resumo"></textarea><div class="row"><button class="btn ok" onclick="guardarJuris()">💾 Guardar julgado</button></div></details>`;return h}
function distribuir(){const s=$('#jCola').value;if(!s.trim())return;const pega=re=>{const m=s.match(re);return m?m[1].trim():''};
 $('#j_tribunal').value=pega(/\b(STF|STJ|TJ[A-Z]{2}|TRF\s?\d)\b/)||$('#j_tribunal').value;
 $('#j_processo').value=pega(/((?:AgRg\s+n[oa]s?\s+|EDcl\s+n[oa]s?\s+)?(?:REsp|AREsp|HC|RHC|RE|ARE|ADI|ADPF|MS|Rcl|CC)\s*(?:n[º°.]?\s*)?[\d.\-]+(?:\/[A-Z]{2})?)/i)||$('#j_processo').value;
 $('#j_orgao').value=pega(/(\d+ª\s+Turma|Plenário|Terceira Seção|\d+ª\s+Seção|Corte Especial)/i)||$('#j_orgao').value;
 $('#j_data').value=pega(/(\d{1,2}\/\d{1,2}\/\d{4})/)||pega(/\b(20\d\d|19\d\d)\b/)||$('#j_data').value;
 $('#j_fonte').value=pega(/(https?:\/\/\S+)/)||pega(/(Informativo\s+n?º?\s*\d+)/i)||$('#j_fonte').value;
 $('#j_tese').value=pega(/tese\s*[:\-–]\s*([^\n]+)/i)||s.replace(/https?:\/\/\S+/g,'').trim().slice(0,800);toast('Confira as caixas antes de guardar.')}
function guardarJuris(){const j={};['tribunal','orgao','processo','data','fonte','tese'].forEach(c=>j[c]=$('#j_'+c).value.trim());if(!j.tese&&!j.processo){toast('Preencha ao menos a tese ou o processo.');return}const id=T().id;(S.user.jurUser[id]=S.user.jurUser[id]||[]).push(j);salvar();render();toast('Julgado guardado.')}

/* mnemônicos */

function painelMnemo(){const bid=B().id;const p=cB().mnemonicos||[];const us=S.user.mnemoUser[bid]||[];const todos=[...p.map(m=>({...m})),...us.map((m,i)=>({...m,_u:i}))];

/* mapa mental */
function mapaDados(){const bid=B().id;const u=S.user.mapaUser[bid];if(u&&S.user.verMeuMapa!==false)return {d:outlineParaMapa(u),meu:1};return {d:cB().mapa_mental,meu:0}}
function outlineParaMapa(txt){const ls=txt.split('\n').filter(l=>l.trim());const m={centro:(ls.shift()||'').replace(/^[-•]\s*/,'').trim(),ramos:[]};for(const l of ls){if(/^\s{2,}[-•]?/.test(l)&&m.ramos.length)m.ramos[m.ramos.length-1].subramos.push(l.replace(/^\s*[-•]\s*/,'').trim());else m.ramos.push({rotulo:l.replace(/^\s*[-•]\s*/,'').trim(),subramos:[]})}return m}
function mapaParaOutline(m){return (m.centro||'')+'\n'+(m.ramos||[]).map(r=>'- '+(r.rotulo||'')+(r.subramos||[]).map(s=>'\n    - '+s).join('')).join('\n')}
function painelMapa(){const {d,meu}=mapaDados();if(!d)return vazioPacote;const bid=B().id;
 const CORES=['var(--blue)','var(--green)','var(--amber)','var(--purple)','var(--red)','var(--orange)'];
 const ramo=(r,i)=>`<div class="mm-r" style="--c:${CORES[i%CORES.length]}"><b>${negrito(r.rotulo)}</b>${r.relacao?`<div class="muted" style="font-size:.82rem">${esc(r.relacao)}</div>`:''}${(r.subramos||[]).length?`<ul>${r.subramos.map(s=>`<li>${negrito(s)}</li>`).join('')}</ul>`:''}</div>`;
 const rs=(d.ramos||[]).map((r,i)=>({r,i}));const esq=rs.filter(x=>x.i%2===0),dir=rs.filter(x=>x.i%2===1);
 let h=`<div class="mm2" id="mm2"><svg class="mm-svg" id="mmSvg"></svg><div class="mm-lado e">${esq.map(x=>ramo(x.r,x.i)).join('')}</div><div class="mm-meio"><div class="mm-c" id="mmC">${negrito(d.centro)}</div></div><div class="mm-lado d">${dir.map(x=>ramo(x.r,x.i)).join('')}</div></div>`;
 h+=`<div class="row">${S.user.mapaUser[bid]?`<button class="btn sm" onclick="S.user.verMeuMapa=${meu?'false':'true'};render()">${meu?'Ver o da Joana':'Ver a minha versão'}</button>`:''}<button class="btn sm" onclick="editarMapa()">✎ Editar e salvar minha versão</button><button class="btn sm" onclick="copiar(mapaParaOutline(mapaDados().d)).then(()=>toast('Mapa copiado como texto.'))">⤓ Exportar (copiar texto)</button></div>`;return h}
function linhasMapa(){const box=$('#mm2'),svg=$('#mmSvg'),c=$('#mmC');if(!box||!svg||!c)return;if(getComputedStyle(svg).display==='none')return;
 const B0=box.getBoundingClientRect(),C=c.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${B0.width} ${B0.height}`);let p='';
 box.querySelectorAll('.mm-r').forEach(r=>{const R=r.getBoundingClientRect();const esq=R.right<=C.left+1;const x1=(esq?C.left:C.right)-B0.left,y1=C.top+C.height/2-B0.top,x2=(esq?R.right:R.left)-B0.left,y2=R.top+R.height/2-B0.top,mx=(x1+x2)/2;
  p+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" style="stroke:${r.style.getPropertyValue('--c')}" stroke-width="3" stroke-linecap="round" opacity=".85"/>`});svg.innerHTML=p}
window.addEventListener('resize',()=>requestAnimationFrame(linhasMapa));
function editarMapa(){const {d}=mapaDados();abrirModal(`<h2>Minha versão do mapa mental</h2><p class="muted">1ª linha = centro. Cada "- " = ramo. Linhas recuadas com "    - " = sub-ramos.</p><textarea id="taMapa" style="min-height:45vh">${esc(mapaParaOutline(d||{centro:B().titulo,ramos:[]}))}</textarea><div class="row"><button class="btn prim" onclick="S.user.mapaUser[B().id]=$('#taMapa').value;S.user.verMeuMapa=true;salvar();fecharModal();render()">💾 Salvar</button>${S.user.mapaUser[B().id]?`<button class="btn" onclick="delete S.user.mapaUser[B().id];salvar();fecharModal();render()">Apagar minha versão</button>`:''}<button class="btn" onclick="fecharModal()">Cancelar</button></div>`)}

const NOME_TIPO={inicio:'Ponto de partida',condicao:'Pergunta',consequencia:'Resposta',excecao:'Exceção',fim:'Conclusão'};
function painelFluxo(){const f=cB().fluxograma;const refazer=`<div class="row" style="margin-top:0;margin-bottom:.8rem"><button class="btn prim" onclick="copiarPrompt('fluxo')">🤖 ${f?'Refazer':'Fazer'} fluxograma no ChatGPT</button><button class="btn ok" onclick="colarFerramenta('fluxo')">📥 Colar fluxograma</button></div>`;
 if(!f||!(f.nos||[]).length)return refazer+vazioPacote;const bid=B().id;const meus=S.user.fluxoUser[bid]||{};
 const nos=f.nos,lig=f.ligacoes||[];const porId=Object.fromEntries(nos.map(n=>[n.id,n]));const vis=new Set();const txt=n=>meus[n.id]??n.texto;
 const ini=nos.find(n=>n.tipo==='inicio')||nos.find(n=>!lig.some(l=>l.para===n.id))||nos[0];
 const num={};{let c=0;const v=new Set(),fila=[ini.id];while(fila.length){const id=fila.shift();if(v.has(id))continue;v.add(id);if(porId[id]&&porId[id].tipo==='condicao')num[id]=++c;lig.filter(l=>l.de===id).forEach(l=>fila.push(l.para))}}
 const tipoNome=n=>n.tipo==='condicao'?`❓ PERGUNTA ${num[n.id]||''}`:n.tipo==='consequencia'?'✅ RESPOSTA':n.tipo==='excecao'?'⚠️ EXCEÇÃO':n.tipo==='inicio'?'▶ PONTO DE PARTIDA':'🏁 CONCLUSÃO';
 const cls=r=>/^n[ãa]o/i.test(r||'')?'nao':/^sim/i.test(r||'')?'sim':'';
 const abas=`<div class="row" style="margin-top:0;margin-bottom:1rem"><button class="btn ${S.user.percorrer?'':'prim'}" onclick="S.user.percorrer=false;render()">🌳 Ver o fluxograma inteiro</button><button class="btn ${S.user.percorrer?'prim':''}" onclick="S.user.percorrer=true;flAt=null;render()">🧭 Resolver passo a passo</button></div>`;
 if(S.user.percorrer){if(flBloco!==bid||!flAt||!porId[flAt]){flAt=ini.id;flCam=[];flBloco=bid}const n=porId[flAt];const sai=lig.filter(l=>l.de===flAt);
  let h=refazer+abas+(flCam.length?`<div class="fl-cam">${flCam.map(p=>esc(p)).join('  →  ')}</div>`:'')+`<div class="fl-n ${esc(n.tipo)} grande"><div class="t">${tipoNome(n)}</div><div class="flt">${negrito(txt(n))}</div></div>`;
  flOpcoes=sai.map(l=>({para:l.para,passo:(n.tipo==='condicao'?'P'+(num[n.id]||'')+': ':'')+(l.rotulo||'segue')}));
  h+=sai.length?`<div class="row" style="justify-content:center;margin-top:1rem">${sai.map((l,i)=>{const c=cls(l.rotulo);return `<button class="btn ${c==='sim'?'ok':''}" style="font-size:1.05rem;padding:.7rem 1.6rem;${c==='nao'?'border-color:var(--red);color:var(--red)':''}" onclick="flAndar(${i})">${esc((l.rotulo||'Continuar').toUpperCase())}${l.rotulo?'':' →'}</button>`}).join('')}</div>`
   :`<div class="row" style="justify-content:center;margin-top:1rem"><button class="btn prim" onclick="flAt=null;render()">↻ Recomeçar</button></div>`;
  return h}
 const no=(id,dep)=>{const n=porId[id];if(!n)return '';if(vis.has(id)||dep>14)return `<div class="fl-ref">↪ volta para: ${esc(limpa(txt(n)).slice(0,70))}</div>`;vis.add(id);const sai=lig.filter(l=>l.de===id);
  let h=`<div class="fl-n ${esc(n.tipo)}"><div class="t">${tipoNome(n)}</div><div contenteditable="${S.user.editFluxo?'true':'false'}" data-nid="${esc(id)}" class="flt">${negrito(txt(n))}</div></div>`;
  if(sai.length===1){const l=sai[0],c=cls(l.rotulo);h+=`<div class="fl-seta ${c}">${l.rotulo?`<span class="fl-rot ${c}">${esc(l.rotulo)}</span>`:''}</div>`+no(l.para,dep+1)}
  else if(sai.length>1)h+=`<div class="fl-tronco"></div><div class="fl-ramos">${sai.map(l=>{const c=cls(l.rotulo);return `<div class="fl-ramo"><div class="fl-seta ${c}"><span class="fl-rot ${c}">${esc(l.rotulo||'segue')}</span></div><div class="fl-col">${no(l.para,dep+1)}</div></div>`}).join('')}</div>`;
  return h};
 // Escada: pergunta com uma saída que termina (resposta) e outra que continua vira uma linha inteira.
 const terminal=id=>!lig.some(l=>l.de===id);
 const caixa=(n,extra='')=>`<div class="fl-n ${esc(n.tipo)} ${extra}"><div class="t">${tipoNome(n)}</div><div contenteditable="${S.user.editFluxo?'true':'false'}" data-nid="${esc(n.id)}" class="flt">${negrito(txt(n))}</div></div>`;
 const escada=(inicio)=>{let h='',cur=inicio,primeiro=true;
  while(cur&&porId[cur]&&!vis.has(cur)){const n=porId[cur];const sai=lig.filter(l=>l.de===cur);
   const fim=sai.find(l=>terminal(l.para)&&porId[l.para]),segue=sai.find(l=>l!==fim);
   if(n.tipo==='condicao'&&sai.length===2&&fim&&segue){vis.add(cur);vis.add(fim.para);const cf=cls(fim.rotulo),cs=cls(segue.rotulo);
    h+=`<div class="esc-linha">${caixa(n)}<div class="esc-seta ${cf}"><span class="fl-rot ${cf}">${esc(fim.rotulo||'segue')}</span></div>${caixa(porId[fim.para])}</div>`;
    h+=`<div class="esc-desce ${cs}"><span class="fl-rot ${cs}">${esc(segue.rotulo||'segue')}</span></div>`;cur=segue.para;primeiro=false;continue}
   h+=primeiro?no(cur,0):`<div class="esc-final">${no(cur,0)}</div>`;break}
  return h};
 let h=refazer+abas+`<div class="fl"><div class="fl-col">${escada(ini.id)}</div>${nos.filter(n=>!vis.has(n.id)).map(n=>`<div class="fl-col" style="margin-top:1.2rem">${no(n.id,0)}</div>`).join('')}</div>`;
 h+=`<div class="row">${S.user.editFluxo?`<button class="btn ok" onclick="salvarFluxo()">💾 Salvar minha versão</button>`:`<button class="btn sm" onclick="S.user.editFluxo=true;render()">✎ Editar textos</button>`}${Object.keys(meus).length?`<button class="btn sm" onclick="delete S.user.fluxoUser[B().id];salvar();render()">Voltar ao da Joana</button>`:''}<button class="btn sm" onclick="copiar(ordemFluxoTexto()).then(()=>toast('Fluxograma copiado como texto.'))">⤓ Exportar (copiar texto)</button></div>`;return h}
let flAt=null,flCam=[],flBloco='',flOpcoes=[];
function flAndar(i){const o=flOpcoes[i];if(!o)return;flCam.push(o.passo);flAt=o.para;render()}
function salvarFluxo(){const bid=B().id;const m=S.user.fluxoUser[bid]=S.user.fluxoUser[bid]||{};document.querySelectorAll('.flt').forEach(el=>{m[el.dataset.nid]=el.innerText.trim()});S.user.editFluxo=false;salvar();render();toast('Fluxograma salvo.')}

/* ============ dispositivos citados: texto do Planalto ao passar o mouse ============ */
const PL='https://www.planalto.gov.br/ccivil_03/';
const LEIS={CP:PL+'decreto-lei/del2848compilado.htm',CPP:PL+'decreto-lei/del3689compilado.htm',CC:PL+'leis/2002/l10406compilada.htm',CF:PL+'constituicao/constituicao.htm',CPC:PL+'_ato2015-2018/2015/lei/l13105.htm',CTB:PL+'leis/l9503compilado.htm',ECA:PL+'leis/l8069compilado.htm',LEP:PL+'leis/l7210compilado.htm',CTN:PL+'leis/l5172compilado.htm'};
function urlDaLei(nome){if(!nome)return (S&&S.inv&&S.inv.fonte_oficial)||'';const n=nome.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
 if(LEIS[n])return LEIS[n];if(/CODIGO PENAL/.test(n))return LEIS.CP;if(/PROCESSO PENAL/.test(n))return LEIS.CPP;if(/PROCESSO CIVIL/.test(n))return LEIS.CPC;if(/CODIGO CIVIL/.test(n))return LEIS.CC;if(/CONSTITUICAO/.test(n))return LEIS.CF;
 const m=n.match(/LEI\s+(?:N\S*\s*)?([\d.]+)\s*\/\s*(\d{2,4})/);if(m){const num=m[1].replace(/\./g,''),ano=+m[2]<100?1900+ +m[2]:+m[2];if(ano<2001)return PL+'leis/l'+num+'.htm'}return ''}
const RX_ART=/\b[Aa]rts?\.\s*(\d{1,4}(?:\.\d{3})?(?:\s*-\s*[A-Z]{1,2})?)(?:\s*[ºo°])?((?:\s*,\s*(?:§+\s*\d+\s*[ºo°]?|caput|par[áa]grafo\s+[úu]nico|inc(?:iso)?s?\.?\s*[IVXLC]+|[IVXLC]{1,6}\b|al[íi]nea\s*["“]?[a-z]["”]?))*)(?:\s*,?\s*d[oa]s?\s+(CPP|CPC|CTB|ECA|LEP|CTN|CP|CC|CF|C[óo]digo\s+(?:de\s+Processo\s+)?(?:Penal|Civil)|Constitui[çc][ãa]o(?:\s+Federal)?|Lei\s+(?:n[ºo°.]*\s*)?[\d.]+\s*\/\s*\d{2,4}))?/g;
function marcarLeis(raiz){if(!raiz||!S)return;const nos=[];const w=document.createTreeWalker(raiz,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.lei,button,textarea,a,[contenteditable="true"]')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
 while(w.nextNode())nos.push(w.currentNode);
 for(const no of nos){const t=no.nodeValue;RX_ART.lastIndex=0;let m,ult=0;const frag=document.createDocumentFragment();let achou=false;
  while((m=RX_ART.exec(t))){const url=urlDaLei(m[3]);if(!url)continue;achou=true;if(m.index>ult)frag.appendChild(document.createTextNode(t.slice(ult,m.index)));
   const sp=document.createElement('span');sp.className='lei';sp.dataset.art=m[1].replace(/\s+/g,'').toUpperCase();sp.dataset.url=url;sp.dataset.par=(m[2]||'');sp.textContent=m[0];frag.appendChild(sp);ult=m.index+m[0].length}
  if(achou){if(ult<t.length)frag.appendChild(document.createTextNode(t.slice(ult)));no.parentNode.replaceChild(frag,no)}}
 // "§ 2º" solto dentro de um artigo: é parágrafo do próprio artigo do bloco.
 const art=B()&&B().artigo,urlB=urlDaLei('');if(!art||!urlB)return;const RX_PAR=/§{1,2}\s*(\d+)\s*[ºo°]?/g;const nos2=[];
 const w2=document.createTreeWalker(raiz,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.lei,button,textarea,a,[contenteditable="true"]')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
 while(w2.nextNode())nos2.push(w2.currentNode);
 for(const no of nos2){const t=no.nodeValue;RX_PAR.lastIndex=0;let m,ult=0,achou=false;const frag=document.createDocumentFragment();
  while((m=RX_PAR.exec(t))){achou=true;if(m.index>ult)frag.appendChild(document.createTextNode(t.slice(ult,m.index)));const sp=document.createElement('span');sp.className='lei';sp.dataset.art=art.toUpperCase();sp.dataset.url=urlB;sp.dataset.par='§ '+m[1];sp.textContent=m[0];frag.appendChild(sp);ult=m.index+m[0].length}
  if(achou){if(ult<t.length)frag.appendChild(document.createTextNode(t.slice(ult)));no.parentNode.replaceChild(frag,no)}}}
const cacheLei=new Map();let leiAlvo=null,tLeiAbre=null,tLeiFecha=null,leiFixa=false;
function popLei(){let p=$('#leiPop');if(!p){p=document.createElement('div');p.id='leiPop';document.body.appendChild(p);p.addEventListener('mouseenter',()=>clearTimeout(tLeiFecha));p.addEventListener('mouseleave',()=>{if(!leiFixa)fecharLei()})}return p}

function destacarParagrafo(texto,par){const esc2=esc(texto);const m=String(par||'').match(/§+\s*(\d+)|par[áa]grafo\s+[úu]nico/i);if(!m)return esc2;
 const alvo=m[1]?new RegExp('(^|\\n)(§\\s*'+m[1]+'\\s*[ºo°]?[^\\n]*)'):/(^|\n)(Parágrafo único[^\n]*)/i;return esc2.replace(alvo,'$1<span class="lei-dest">$2</span>')}
async function abrirLei(el){leiAlvo=el;const p=popLei();const art=el.dataset.art,url=el.dataset.url;const link=url+'#art'+art.replace(/[^0-9A-Z]/g,'').toLowerCase();
 const r0=el.getBoundingClientRect();p.style.display='block';p.style.left=Math.max(8,Math.min(window.scrollX+r0.left,window.scrollX+innerWidth-580))+'px';p.style.top=(window.scrollY+r0.bottom+8)+'px';
 const cab=`<div class="lei-cab"><b>Art. ${esc(art)}</b> · texto atual no Planalto <a href="${esc(link)}" target="_blank" rel="noopener">abrir ↗</a></div>`;
 const chave=url+'|'+art;let r=cacheLei.get(chave);if(!r){p.innerHTML=cab+'<p class="muted">⏳ Buscando no Planalto…</p>';r=await ponte('/leitor/lei',{url,artigo:art},45000);if(r&&r.ok)cacheLei.set(chave,r)}
 if(leiAlvo!==el)return;
 if(!r)p.innerHTML=cab+'<p class="muted">O texto aparece aqui quando o leitor é aberto pelo site com o programa da Fábrica ligado. Use o link "abrir ↗".</p>';
 else if(!r.ok||!r.achou)p.innerHTML=cab+`<p class="muted">${esc(r.erro||'Não encontrei este artigo na página do Planalto.')} Use o link "abrir ↗".</p>`;
 else{p.innerHTML=cab+`<div class="lei-txt">${destacarParagrafo(r.texto,el.dataset.par)}</div>`;const d=p.querySelector('.lei-dest');p.scrollTop=d?Math.max(0,d.offsetTop-60):0}}
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('.lei');if(!el)return;clearTimeout(tLeiFecha);if(el===leiAlvo)return;clearTimeout(tLeiAbre);tLeiAbre=setTimeout(()=>{leiFixa=false;abrirLei(el)},250)});
document.addEventListener('mouseout',e=>{const el=e.target.closest&&e.target.closest('.lei');if(!el||leiFixa)return;clearTimeout(tLeiAbre);tLeiFecha=setTimeout(fecharLei,350)});
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('.lei');if(el){leiFixa=true;if(el!==leiAlvo)abrirLei(el);return}if(!e.target.closest('#leiPop'))fecharLei()});

/* ============ quadro final: ligação com o artigo ============ */
function ligacaoQuadro(t){const m=limpa(t.texto).match(/((?:REsp|AREsp|HC|RHC|RE|ARE|ADPF|ADI|Rcl)\s*[\d.]+)/);if(!m)return '';const num=m[1].replace(/\s+/g,' ');
 for(let bi=0;bi<S.inv.blocos.length;bi++){const b=S.inv.blocos[bi];if(ehQuadro(b))continue;const ti=b.trechos.findIndex(x=>limpa(x.texto).includes(num));if(ti>=0)return `<div class="row"><button class="btn sm" onclick="ir(${bi},${ti})">➜ Estudar este julgado no ${esc(b.titulo.split(':')[0])}</button></div>`}return ''}

/* ============ revisão e cobertura ============ */
function abrirRevisao(){const mt=mapaTrechos();const lnk=(id,err)=>{const r=mt[id];return r?`<a href="#" onclick="fecharModal();${err?"S.user.tool='cards';S.user.soErrados=true;fcI=0;":''}ir(${r.bi},${r.ti});return false">${esc(r.b.titulo.split(':')[0])} · ${esc(r.t.rotulo||('trecho '+(r.ti+1)))}</a>`:esc(id)};
 const prov=Object.keys(S.user.prov);const err=Object.entries(S.user.cards).filter(([,v])=>Object.values(v).includes('err')).map(([k])=>k);const notas=Object.keys(S.user.notas);
 const bls=S.inv.blocos,trs=bls.flatMap(b=>b.trechos),el=trs.filter(t=>t.elegivel);const pr=el.filter(t=>situacaoTrecho(t)==='pronto').length,pa=el.filter(t=>situacaoTrecho(t)==='parcial').length;
 const semArt=bls.filter(b=>blocoPedivel(b)&&!S.content.blocos[b.id]);const nfc=el.reduce((a,t)=>a+((S.content.trechos[t.id]||{}).flashcards||[]).length,0);const poucos=el.filter(t=>situacaoTrecho(t)!=='pendente'&&((S.content.trechos[t.id]||{}).flashcards||[]).length<3);
 const pend=el.filter(t=>((S.content.trechos[t.id]||{}).pendencias||[]).length);
 abrirModal(`<h2>⭐ Revisão</h2>
 <h3>☆ Prováveis de prova (${prov.length})</h3>${prov.length?`<ul>${prov.map(i=>`<li>${lnk(i)}</li>`).join('')}</ul>`:'<p class="muted">Nenhum marcado.</p>'}
 <h3>✖ Flashcards que errei (${err.length} trechos)</h3>${err.length?`<ul>${err.map(i=>`<li>${lnk(i,1)}</li>`).join('')}</ul>`:'<p class="muted">Nenhum.</p>'}
 <h3>✏️ Anotações (${notas.length})</h3>${notas.length?`<ul>${notas.map(i=>`<li>${lnk(i)}: <span class="muted">${esc(S.user.notas[i].slice(0,120))}</span></li>`).join('')}</ul>`:'<p class="muted">Nenhuma.</p>'}
 <h3>📊 Cobertura</h3><table class="lst"><tr><td>Artigos</td><td>${bls.length}</td></tr><tr><td>Trechos / para estudar</td><td>${trs.length} / ${el.length}</td></tr><tr><td>Trechos prontos · parciais · sem conteúdo</td><td><span class="ok-t">${pr}</span> · <span class="pa-t">${pa}</span> · ${el.length-pr-pa}</td></tr><tr><td>Flashcards</td><td>${nfc}</td></tr><tr><td>Artigos sem mapa/fluxograma/tutor/resumo</td><td>${semArt.length?semArt.map(b=>esc(b.titulo.split(':')[0])).join(', '):'nenhum'}</td></tr><tr><td>Trechos com menos de 3 flashcards</td><td>${poucos.length}</td></tr></table>
 ${pend.length?`<details><summary>Pendências registradas pela Joana (${pend.length})</summary><ul>${pend.map(t=>`<li>${lnk(t.id)}: ${esc((S.content.trechos[t.id].pendencias||[]).join(' '))}</li>`).join('')}</ul></details>`:''}
 <div class="row"><button class="btn" onclick="baixarBackup()">⤓ Backup (JSON)</button><button class="btn" onclick="$('#fAbrir').click()">⤒ Restaurar backup</button><button class="btn" onclick="fecharModal()">Fechar</button></div>`)}
function baixarBackup(){baixar(new Blob([JSON.stringify(S)],{type:'application/json'}),'Backup_Leitor_TDAH_'+S.inv.assunto_id+'_'+new Date().toISOString().slice(0,10)+'.json')}
function baixar(blob,nome){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

async function salvarHTML(){clearTimeout(tSalvar);const antes=S.user.exportadoEm;S.salvoEm=new Date().toISOString();S.user.exportadoEm=S.salvoEm;await idbSet('estados',S.inv.assunto_id,S);pendente=false;
 const dados=JSON.stringify(S).replace(/</g,'\\u003c');
 const html=FONTE_PAGINA.replace(/(<script id="dados-embutidos" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+dados+b).replace(/<title>[\s\S]*?<\/title>/,'<title>'+esc('Leitor TDAH — '+S.inv.titulo)+'</title>');
 const nome='Leitor_TDAH_'+S.inv.assunto_id+'_'+new Date().toISOString().slice(0,10)+'.html';const blob=new Blob([html],{type:'text/html'});
 if(window.showSaveFilePicker){try{const h=await showSaveFilePicker({suggestedName:nome,types:[{description:'Página HTML',accept:{'text/html':['.html']}}]});const w=await h.createWritable();await w.write(blob);await w.close();render();toast('HTML salvo com tudo dentro.',4000);return}catch(e){if(e.name==='AbortError'){S.user.exportadoEm=antes;return}}}
 baixar(blob,nome);render();toast('HTML salvo na pasta Downloads. Mova para a pasta do resumo no Drive.',4500)}

 const mapa=S.user.mapaFechado?'':`<aside class="mapa"><h3>MAPA DOS TRECHOS</h3>${S.inv.blocos.map((x,bi)=>{const st=situacaoBloco(x);const ab=bi===S.user.pos.b;return `<div class="bl ${ab?'atual aberto':''}" id="bl${bi}"><button onclick="this.parentNode.classList.toggle('aberto')">${bi+1}. ${esc(x.titulo)}<span class="st">${st.k==='nada'?'':st.txt}</span></button><div class="trs">${x.trechos.map((y,ti)=>{if(ehSub(y))return `<div class="sub-mm">${esc(limpa(y.texto).replace(/^[^\p{L}\p{N}§]*/u,''))}</div>`;const s=situacaoTrecho(y);const ic=(S.user.prov[y.id]?'★':'')+(S.user.notas[y.id]?'✎':'')+(((S.content.trechos[y.id]||{}).jurisprudencia||[]).length||(S.user.jurUser[y.id]||[]).length?'⚖':'')+(ti===0&&S.user.imagens[x.id]?'🖼':'');return `<button class="tr ${ab&&ti===S.user.pos.t?'atual':''} ${s==='nel'?'nel':''}" onclick="ir(${bi},${ti})"><span class="dot ${s}"></span>${ti+1}. ${esc((y.rotulo||limpa(y.texto).slice(0,40)).toUpperCase())}<span class="ic">${ic}</span></button>`}).join('')}</div></div>`}).join('')}</aside>`;
 const naoExp=S.user.exportadoEm!==S.salvoEm;
 app.innerHTML=`<div class="grid ${S.user.mapaFechado?'semmapa':''}">${mapa}<section>
 <div class="hier">${esc(b.capitulo||'')}</div><div class="art-tit">${esc(b.titulo)}</div>${subt?`<div class="subt">${esc(limpa(subt.texto).replace(/^[^\p{L}\p{N}§]*/u,''))}</div>`:''}

 <select onchange="ir(+this.value,0)">${S.inv.blocos.map((x,i)=>`<option value="${i}" ${i===S.user.pos.b?'selected':''}>${i+1}. ${esc(x.titulo.slice(0,60))}</option>`).join('')}</select>

 <div class="card" style="--cat:${cor}"><div class="card-head"><div class="k">${nomeCat} · ${b.trechos.filter(x=>!ehSub(x)).indexOf(t)+1} DE ${b.trechos.filter(x=>!ehSub(x)).length}${S.user.prov[t.id]?' · ★ PROVÁVEL':''}</div><div class="r">${esc(t.rotulo||b.titulo)}</div></div>
