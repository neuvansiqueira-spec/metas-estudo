name: Test Duplicate Diagnostics UI V261

on:
  push:
    branches:
      - fix/diagnostico-duplicacoes-ui-v261
    paths:
      - "duplicate-diagnostics-ui-v261.js"
      - "duplicate-diagnostics-ui-v261.css"
      - "duplicate-diagnostics-ui-v261-stability.js"
      - "duplicate-diagnostics-loader-v260.js"
      - ".github/workflows/test-duplicate-diagnostics-ui-v261.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check duplicate-diagnostics-loader-v260.js
          node --check duplicate-diagnostics-ui-v261.js
          node --check duplicate-diagnostics-ui-v261-stability.js
      - name: Validate required UI safeguards
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('duplicate-diagnostics-ui-v261.js', 'utf8');
          const css = fs.readFileSync('duplicate-diagnostics-ui-v261.css', 'utf8');
          const stability = fs.readFileSync('duplicate-diagnostics-ui-v261-stability.js', 'utf8');
          const loader = fs.readFileSync('duplicate-diagnostics-loader-v260.js', 'utf8');
          const checks = [
            [js.includes('DEFAULT_FILTER = "probable"'), 'default probable filter'],
            [js.includes('DEFAULT_PAGE_SIZE = 6'), 'pagination limit'],
            [js.includes('Sobreposições são relações entre temas diferentes'), 'overlap guidance'],
            [js.includes('data-v261-search'), 'search control'],
            [js.includes('data-v261-pager'), 'pager control'],
            [css.includes('.aldus-dup-v261-pager'), 'pager styling'],
            [css.includes('.aldus-dup-v261-card-title'), 'compact card styling'],
            [stability.includes('replaceWith(summary.cloneNode(true))'), 'summary observer stabilization'],
            [stability.includes('replaceWith(status.cloneNode(true))'), 'status observer stabilization'],
            [loader.includes('duplicate-diagnostics-ui-v261.js'), 'enhancer loader'],
            [loader.includes('duplicate-diagnostics-ui-v261.css'), 'enhancer stylesheet'],
            [loader.includes('duplicate-diagnostics-ui-v261-stability.js'), 'stability loader']
          ];
          const failed = checks.filter(([ok]) => !ok).map(([, label]) => label);
          if (failed.length) throw new Error(`Missing checks: ${failed.join(', ')}`);
          console.log(`${checks.length} UI checks passed.`);
          NODE
