name: Aplicar V623.4 PDF compacto

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar patch
        shell: bash
        run: |
          if grep -q '20260915-calendario-exportacoes-v623-4' goal-calendar-export-v623.js; then
            echo 'V623.4 já aplicada.'
          else
            python .github/scripts/v6234_patch.py
          fi
      - name: Validar
        run: |
          node --check goal-calendar-export-v623.js
          node --check docs/goal-calendar-export-v623.js
          node --test tests/v623-calendar-export.test.js
          cmp -s goal-calendar-export-v623.js docs/goal-calendar-export-v623.js
          cmp -s performance-emergency-v350.js docs/performance-emergency-v350.js
          git diff --check
      - name: Publicar
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração pendente.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goal-calendar-export-v623.js docs/goal-calendar-export-v623.js performance-emergency-v350.js docs/performance-emergency-v350.js tests/v623-calendar-export.test.js
          git commit -m 'perf(calendar): compactar Fábrica do PDF em duas colunas [v6234-applied]'
          git push
