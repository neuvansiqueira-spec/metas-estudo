name: Build Training v223

on:
  push:
    branches:
      - codex/treino-em-andamento-v223
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-v223-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: ${{ false }} # V316: fluxo legado desativado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: codex/treino-em-andamento-v223

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Materialize v223 runtime
        run: node tools/materialize-training-v223.mjs

      - name: Prepare v223 sources
        run: node tools/apply-training-v223.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run focused tests
        run: node --test tests/question-bank-training-v223.test.js

      - name: Build bundles
        run: npm run build

      - name: Validate generated release
        run: |
          node --check question-bank-training-v223.js
          node --check app-v223.js
          grep -q '__aldusQuestionBankTrainingV223' app-v223.js
          grep -q '20260803-treino-em-andamento-v223' index.html
          grep -q 'app-v223.js' docs/index.html
          grep -q 'question-bank-training-v223.js' build-bundles.mjs

      - name: Commit generated v223 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração adicional para publicar."
            exit 0
          fi
          git commit -m "build: publish treino em andamento v223"
          git push origin HEAD:codex/treino-em-andamento-v223
