name: Run V183 daily piece build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-v183-daily-piece-build.yml
  pull_request:
    branches:
      - main
    paths:
      - daily-delegate-piece-goal-v183.js
      - tests/v183-daily-delegate-piece.test.js

permissions:
  contents: write

jobs:
  build-branch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated V183 branch
        uses: actions/checkout@v4
        with:
          ref: agent/meta-diaria-peca-delegado-v183
          fetch-depth: 0

      - name: Capture current main failure baseline
        shell: bash
        run: |
          git worktree add --detach /tmp/metas-baseline origin/main
          cd /tmp/metas-baseline
          npm ci
          npm run build
          set +e
          npm test > /tmp/main-v183-test.log 2>&1
          set -e
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          text = Path('/tmp/main-v183-test.log').read_text(encoding='utf-8', errors='replace')
          failures = re.findall(r'^not ok \d+ - (.+)$', text, flags=re.MULTILINE)
          Path('/tmp/main-v183-failures.json').write_text(json.dumps(failures, ensure_ascii=False), encoding='utf-8')
          print(f'Baseline main: {len(failures)} falhas nominais')
          PY

      - name: Configure V183 source and release
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          version = '20260730-meta-diaria-peca-delegado-v169'

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = version
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['version'] = version
          lock.setdefault('packages', {}).setdefault('', {})['version'] = version
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          build_path = Path('build-bundles.mjs')
          build = build_path.read_text(encoding='utf-8')
          source_anchor = '  "completed-goal-guard-v177.js",\n'
          source_line = '  "daily-delegate-piece-goal-v183.js",\n'
          if source_line not in build:
              if source_anchor not in build:
                  raise SystemExit('Âncora do bundle V177 não encontrada.')
              build = build.replace(source_anchor, source_anchor + source_line, 1)

          copy_anchor = '"reinforcement-goal-presentation-v156.js", "completed-goal-guard-v177.js", "contest-countdown-v151.js"'
          copy_replacement = '"reinforcement-goal-presentation-v156.js", "completed-goal-guard-v177.js", "daily-delegate-piece-goal-v183.js", "contest-countdown-v151.js"'
          if '"daily-delegate-piece-goal-v183.js"' not in build[build.find('for (const filename of ['):]:
              if copy_anchor not in build:
                  raise SystemExit('Âncora da cópia pública V177 não encontrada.')
              build = build.replace(copy_anchor, copy_replacement, 1)
          build_path.write_text(build, encoding='utf-8')

          worker_path = Path('service-worker.js')
          worker = worker_path.read_text(encoding='utf-8')
          worker = re.sub(r'const CURRENT_VERSION = "[^"]+";', f'const CURRENT_VERSION = "{version}";', worker, count=1)
          if 'RUNTIME_PATCH_ASSET' in worker or 'appendRuntimePatch' in worker:
              raise SystemExit('O service worker não está limpo; build interrompido.')
          worker_path.write_text(worker, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Focused validation
        run: |
          node --check daily-delegate-piece-goal-v183.js
          node --check script.js
          node --test tests/v177-completed-goal-guard.test.js tests/v183-daily-delegate-piece.test.js

      - name: Build public artifacts
        run: npm run build

      - name: Compare full failure sets after build
        shell: bash
        run: |
          set +e
          npm test > branch-v183-test.log 2>&1
          set -e
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          baseline = json.loads(Path('/tmp/main-v183-failures.json').read_text(encoding='utf-8'))
          text = Path('branch-v183-test.log').read_text(encoding='utf-8', errors='replace')
          branch = re.findall(r'^not ok \d+ - (.+)$', text, flags=re.MULTILINE)
          baseline_set = set(baseline)
          branch_set = set(branch)
          new_failures = sorted(branch_set - baseline_set)
          missing_failures = sorted(baseline_set - branch_set)
          print(f'Baseline main: {len(baseline)} falhas; V183: {len(branch)} falhas')
          for name in new_failures:
              print(f'NEW_FAILURE: {name}')
          for name in missing_failures:
              print(f'MISSING_BASELINE_FAILURE: {name}')
          if new_failures or missing_failures or len(branch) != len(baseline):
              raise SystemExit('A lista de falhas da V183 diverge da baseline atual.')
          print('Baseline nominal preservada: nenhuma falha nova.')
          PY

      - name: Verify generated site
        shell: bash
        run: |
          grep -q '__aldusDailyDelegatePieceGoalV183' app-v169.js
          grep -q '__aldusDailyDelegatePieceGoalV183' docs/app-v169.js
          grep -q '20260730-meta-diaria-peca-delegado-v169' index.html
          grep -q '20260730-meta-diaria-peca-delegado-v169' docs/index.html
          grep -q '20260730-meta-diaria-peca-delegado-v169' service-worker.js
          ! grep -q 'RUNTIME_PATCH_ASSET' service-worker.js
          ! grep -q 'appendRuntimePatch' service-worker.js
          node --check app-v169.js
          node --check docs/app-v169.js
          cmp app-v169.js docs/app-v169.js
          cmp app.bundle.js docs/app.bundle.js
          cmp index.html docs/index.html
          cmp service-worker.js docs/service-worker.js
          cmp service-worker-v169.js docs/service-worker-v169.js
          cmp service-worker-v168.js docs/service-worker-v168.js

      - name: Commit generated branch artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f branch-v183-test.log
          git add -A
          git commit -m 'Gera pacote da meta diária fixa de peça'
          git push origin HEAD:agent/meta-diaria-peca-delegado-v183
