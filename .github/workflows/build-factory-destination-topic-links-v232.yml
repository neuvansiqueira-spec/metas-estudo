name: Build Factory Destination Topic Links v232

on:
  push:
    branches:
      - codex/factory-destination-topic-links-v232
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factory-destination-topic-links-v232-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/factory-destination-topic-links-v232

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare exact topic destinations
        run: node tools/apply-factory-destination-topic-links-v232.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run focused tests
        run: node --test tests/factory-destination-topic-links-v232.test.js tests/factory-destination-recursive-v230.test.js

      - name: Build bundles
        run: npm run build

      - name: Validate generated release
        run: |
          node --check factory-destination-recursive-v232.js
          node --check app-v232.js
          grep -q '__refreshFactoryDestinationFoldersV232' app-v232.js
          grep -q 'options.preserveExisting === true' app-v232.js
          grep -q 'factoryDestinationFolderPreviousUrl' app-v232.js
          grep -q 'factory-destination-recursive-v232.js' build-bundles.mjs
          grep -q '20260803-pastas-destino-temas-exatos-v232' index.html
          grep -q 'app-v232.js' docs/index.html

      - name: Commit generated v232 release
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração adicional para publicar."
            exit 0
          fi
          git commit -m "build: publish exact topic destination links v232"
          git push origin HEAD:codex/factory-destination-topic-links-v232
