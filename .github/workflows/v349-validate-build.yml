name: V349 validar e gerar bundle

on:
  push:
    branches:
      - fix/runtime-stability-v349
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v349-validate-build
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar branch V349
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/runtime-stability-v349
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar fontes V349
        run: |
          node --check sync-integral-deletions.js
          node --check factory-destination-recursive-v232.js
          node --check factory-jurisprudencia-prompt-v332.js
          node --check bootstrap-integrity-loader-v258.js
          node --test tests/v349-runtime-stability.test.js
          node --test tests/sync-save-performance-v348.test.js
          node --test tests/v347-cross-tab-summary-refresh.test.js tests/v347-daily-summary-reflow.test.js

      - name: Gerar versão principal V349
        run: npm run build

      - name: Validar bundle e contrato da versão
        run: |
          node --check app-v349.js
          node --check docs/app-v349.js
          node -e "require('./tests/current-release-contract.js').assertCurrentReleaseContract()"
          grep -q 'app-v349.js?v=20260816-runtime-stability-v349' index.html
          grep -q 'app-v349.js?v=20260816-runtime-stability-v349' docs/index.html
          grep -q 'app-v349.js?v=20260816-runtime-stability-v349' bootstrap-integrity-loader-v258-core.js
          ! grep -q 'sync-save-performance-v348.js' bootstrap-integrity-loader-v258.js
          cmp app-v349.js docs/app-v349.js
          cmp sync-integral-deletions.js docs/sync-integral-deletions.js
          cmp factory-destination-recursive-v232.js docs/factory-destination-recursive-v232.js
          cmp factory-jurisprudencia-prompt-v332.js docs/factory-jurisprudencia-prompt-v332.js
          git diff --check

      - name: Simular estado final sem workflow temporário
        run: rm .github/workflows/v349-validate-build.yml

      - name: Executar regressões de publicação
        run: |
          node --test \
            tests/security-hardening-v296.test.js \
            tests/timer-controls-hardening-v268.test.js \
            tests/legacy-timer-recovery.test.js \
            tests/v315-usage-telemetry.test.js \
            tests/v316-timer-telemetry-security.test.js \
            tests/v318-security-observability.test.js \
            tests/v329-integral-performance.test.js

      - name: Gravar artefatos consolidados na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Build já estava sincronizado."
            exit 0
          fi
          git commit -m "V349: gera artefatos consolidados [skip ci]"
          git push origin HEAD:fix/runtime-stability-v349
