name: Build V168 bundle

on:
  push:
    branches:
      - agent/carregamento-direto-v168

permissions:
  contents: read

jobs:
  build:
    if: ${{ false }} # V316: fluxo legado desativado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build final V168 assets
        run: |
          node prepare-v168.mjs
          node build-bundles.mjs

      - name: Verify V168
        run: |
          node --check app-v168.js
          node --check service-worker-v168.js
          node --test tests/v168-direct-startup.test.js tests/current-release-contract.js

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app-version.js app.bundle.css app.bundle.js app-v168.css app-v168.js \
            index.html script.js service-worker-v167.js service-worker-v168.js \
            docs/app-version.js docs/app.bundle.css docs/app.bundle.js \
            docs/app-v168.css docs/app-v168.js docs/index.html docs/script.js \
            docs/service-worker-v167.js docs/service-worker-v168.js
          if ! git diff --cached --quiet; then
            git commit -m "Gera artefatos finais V168"
            git push
          fi
