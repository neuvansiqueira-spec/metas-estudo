name: Build V221 charts

on:
  push:
    branches:
      - agent/melhora-visual-graficos-historico-v221

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build V221 assets
        run: node build-bundles.mjs

      - name: Verify V221 charts and release
        run: |
          node --check question-history-charts-v215.js
          node --check question-history-pie.js
          node --check question-history-tone-v216.js
          node --check app-v221.js
          node --check service-worker-v221.js
          node --test \
            tests/question-history-charts-v221.test.js \
            tests/question-history-distribution-v220.test.mjs \
            tests/v65-question-history-3d-chart.test.js \
            tests/v219-release-pipeline.test.js

      - name: Commit generated V221 assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app-version.js app.bundle.js app-v221.css app-v221.js index.html \
            question-history-charts-v215.js question-history-pie.js question-history-tone-v216.js \
            service-worker.js service-worker-v168.js service-worker-v169.js service-worker-v221.js \
            docs/app-version.js docs/app.bundle.js docs/app-v221.css docs/app-v221.js docs/index.html \
            docs/question-history-charts-v215.js docs/question-history-pie.js docs/question-history-tone-v216.js \
            docs/service-worker.js docs/service-worker-v168.js docs/service-worker-v169.js docs/service-worker-v221.js
          if ! git diff --cached --quiet; then
            git commit -m "Gera artefatos finais V221"
            git push
          fi
