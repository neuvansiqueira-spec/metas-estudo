name: Publish QC subject filter v285

on:
  push:
    branches:
      - main
    paths:
      - tools/apply-qc-subject-filter-v285.mjs
      - .github/workflows/publish-qc-subject-filter-v285.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-qc-subject-filter-v285
  cancel-in-progress: false

jobs:
  apply-test-publish:
    if: ${{ false }} # V316: fluxo legado desativado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Apply automatic QC subject filter
        run: node tools/apply-qc-subject-filter-v285.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build release
        run: npm run build

      - name: Test automatic QC subject filter
        run: >-
          node --test
          tests/qconcursos-subject-filter-v285.test.js
          tests/question-registration-route.test.js
          tests/question-bank-filters-v225.test.js
          tests/v56-qc-catalog-numbering.test.js
          tests/v57-qc-complete-crosswalk.test.js
          tests/question-bank-performance-v282.test.mjs

      - name: Validate generated release
        run: |
          node --check qconcursos-subject-filter-v285.js
          node --check app-v285.js
          node --check service-worker-v285.js
          grep -q '20260809-qconcursos-assunto-automatico-v285' package.json
          grep -q '20260809-qconcursos-assunto-automatico-v285' docs/index.html
          grep -q 'app-v285.js?v=20260809-qconcursos-assunto-automatico-v285' bootstrap-integrity-loader-v258-core.js
          grep -q 'subject_ids' qconcursos-subject-filter-v285.js
          grep -q '15940' qconcursos-subject-filter-v285.js
          cmp -s app.bundle.js docs/app.bundle.js
          cmp -s bootstrap-integrity-loader-v258-core.js docs/bootstrap-integrity-loader-v258-core.js

      - name: Commit generated release to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração adicional para publicar."
            exit 0
          fi
          git commit -m "fix: aplica assunto QC no link automático v285"
          git push origin HEAD:main
