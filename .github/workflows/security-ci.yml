name: Validar segurança

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-check:
    name: Segurança, release e regressões
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências sem scripts
        run: npm ci --ignore-scripts

      - name: Gerar artefatos públicos com release íntegro
        run: npm run build

      - name: Validar sintaxe dos caminhos ativos
        run: |
          node --check security-hardening-v296.js
          node --check usage-telemetry-v315.js
          node --check security-observability-v318.js
          node --check telemetry-security-dashboard-v319.js
          node --check factory-resumo-aula-visual-v326.js
          node --check factory-resumo-aula-canonical-v327.js
          node --check catastrophic-state-guard-v275.js
          node --check bootstrap-integrity-loader-v258-core.js
          node --check bootstrap-integrity-loader-v345-core.js
          node --check bootstrap-integrity-loader-v258.js
          node --check bootstrap-integrity-loader-v275.js
          node --check storage-concurrency-v345.js
          node --check sync-save-performance-v348.js
          node --check service-worker.js

      - name: Executar suíte completa
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee full-test.log
          status=${PIPESTATUS[0]}
          echo "$status" > full-test.exit
          exit "$status"

      - name: Preservar relatório completo dos testes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-test-log
          path: |
            full-test.log
            full-test.exit
          if-no-files-found: error
          retention-days: 3

      - name: Validar contrato da release gerada
        run: node -e "require('./tests/current-release-contract.js').assertCurrentReleaseContract()"

      - name: Confirmar paridade dos artefatos críticos
        run: |
          cmp security-hardening-v296.js docs/security-hardening-v296.js
          cmp service-worker.js docs/service-worker.js
          cmp usage-telemetry-v315.js docs/usage-telemetry-v315.js
          cmp bootstrap-integrity-loader-v345-core.js docs/bootstrap-integrity-loader-v345-core.js
          cmp bootstrap-integrity-loader-v275.js docs/bootstrap-integrity-loader-v275.js
          cmp catastrophic-state-guard-v275.js docs/catastrophic-state-guard-v275.js
