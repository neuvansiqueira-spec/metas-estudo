name: Validar segurança

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-check:
    name: Segurança e telemetria
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências sem scripts
        run: npm ci --ignore-scripts

      - name: Validar sintaxe
        run: |
          node --check security-hardening-v296.js
          node --check usage-telemetry-v315.js
          node --check security-observability-v318.js
          node --check telemetry-security-dashboard-v319.js
          node --check factory-resumo-aula-visual-v326.js
          node --check factory-resumo-aula-canonical-v327.js
          node --check catastrophic-state-guard-v275.js
          node --check bootstrap-integrity-loader-v258-core.js
          node --check bootstrap-integrity-loader-v258.js
          node --check bootstrap-integrity-loader-v275.js
          node --check service-worker.js
          node --check service-worker-v344.js

      - name: Executar testes de segurança, telemetria e regressão do prompt
        run: |
          node --test \
            tests/security-hardening-v296.test.js \
            tests/v315-usage-telemetry.test.js \
            tests/v317-posthog-telemetry.test.js \
            tests/v316-timer-telemetry-security.test.js \
            tests/v318-security-observability.test.js \
            tests/v319-telemetry-security-dashboard.test.js \
            tests/v329-integral-performance.test.js \
            tests/v326-factory-resumo-aula-visual.test.js \
            tests/v327-factory-resumo-aula-canonical.test.js \
            tests/v342-bootstrap-performance.test.js \
            tests/v351-bootstrap-fast-path.test.js \
            tests/v352-active-service-worker-delivery.test.js \
            tests/v353-navigation-bootstrap-delivery.test.js