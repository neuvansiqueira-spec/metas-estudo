name: Publica integridade estrutural V258

on:
  push:
    branches: [main]
    paths:
      - scripts/publish-bootstrap-integrity-v258.mjs
      - .github/workflows/publish-bootstrap-integrity-v258.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-bootstrap-integrity-v258
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Valida publicador
        run: node --check scripts/publish-bootstrap-integrity-v258.mjs

      - name: Gera, testa e aplica V258
        run: node scripts/publish-bootstrap-integrity-v258.mjs

      - name: Valida arquivos publicados
        run: |
          node --check bootstrap-integrity-loader-v258.js
          node --check docs/bootstrap-integrity-loader-v258.js
          node --check service-worker-v236.js
          node --check docs/service-worker-v236.js
          grep -q 'aldusBootstrapIntegrityLoaderV258' index.html
          grep -q 'aldusBootstrapIntegrityLoaderV258' docs/index.html
          ! grep -q 'id="aldusStorageRecoveryV254"' index.html
          ! grep -q 'id="aldusAppBundleScript"' index.html
          grep -q 'BOOTSTRAP_INTEGRITY_VERSION' service-worker-v236.js
          grep -q 'disabled-by-v258' service-worker-v236.js

      - name: Publica alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap-integrity-loader-v258.js docs/bootstrap-integrity-loader-v258.js index.html docs/index.html service-worker-v236.js docs/service-worker-v236.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
          else
            git commit -m "Publica integridade estrutural V258 [skip ci]"
            git push
          fi
