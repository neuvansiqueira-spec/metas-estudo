name: Build V175 branch artifacts

on:
  push:
    branches:
      - agent/v175-sem-reforco-automatico

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v175-sem-reforco-automatico
          fetch-depth: 0

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate targeted behavior
        run: |
          node --check reinforcement-goal-presentation-v156.js
          node --check script.js
          node --test tests/v175-no-automatic-reinforcement.test.js

      - name: Build public artifacts
        run: npm run build

      - name: Validate generated artifacts
        run: |
          grep -q "__aldusNoAutomaticReinforcementV175" app-v169.js
          grep -q "20260729-sem-reforco-automatico-v169" index.html
          grep -q "20260729-sem-reforco-automatico-v169" service-worker.js
          cmp index.html docs/index.html
          cmp app-v169.js docs/app-v169.js
          cmp app-v169.css docs/app-v169.css

      - name: Commit generated files
        run: |
          rm -f .github/workflows/v175-build-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Gera artefatos da correção sem reforço automático"
          git push origin HEAD:agent/v175-sem-reforco-automatico
