name: Publish Diagnostic Cache Hotfix V262

on:
  push:
    branches:
      - fix/cache-diagnostico-v262
    paths:
      - ".github/workflows/publish-diagnostic-cache-hotfix-v262.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/cache-diagnostico-v262
          fetch-depth: 0

      - name: Mirror assets and patch entrypoints
        run: |
          mkdir -p docs
          cp duplicate-diagnostics-loader-v262.js docs/duplicate-diagnostics-loader-v262.js
          cp duplicate-diagnostics-v260.js docs/duplicate-diagnostics-v260.js
          cp duplicate-diagnostics-v260.css docs/duplicate-diagnostics-v260.css
          cp duplicate-diagnostics-ui-v261.js docs/duplicate-diagnostics-ui-v261.js
          cp duplicate-diagnostics-ui-v261.css docs/duplicate-diagnostics-ui-v261.css
          cp duplicate-diagnostics-ui-v261-stability.js docs/duplicate-diagnostics-ui-v261-stability.js
          cp service-worker-v166.js docs/service-worker-v166.js
          cp service-worker-v262.js docs/service-worker-v262.js
          python - <<'PY'
          from pathlib import Path
          import re

          replacement = (
              '  <!-- aldus-duplicate-diagnostics-v262 -->\n'
              '  <script id="aldusDuplicateDiagnosticsLoaderV262" '
              'src="duplicate-diagnostics-loader-v262.js?v=20260806-duplicate-diagnostics-ui-v262"></script>'
          )

          patterns = [
              re.compile(r'\s*<!-- aldus-duplicate-diagnostics-v260 -->\s*<script id="aldusDuplicateDiagnosticsLoaderV260" src="duplicate-diagnostics-loader-v260\.js\?v=[^"]+"></script>'),
              re.compile(r'\s*<script id="aldusDuplicateDiagnosticsLoaderV(?:260|261|262)" src="duplicate-diagnostics-loader-v(?:260|261|262)\.js\?v=[^"]+"></script>'),
          ]

          for path in (Path('index.html'), Path('docs/index.html')):
              original = path.read_text(encoding='utf-8')
              updated = original
              for pattern in patterns:
                  updated, count = pattern.subn('\n' + replacement, updated, count=1)
                  if count:
                      break
              if updated == original:
                  raise SystemExit(f'Diagnostic loader tag not found in {path}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Validate hotfix
        run: |
          node --check duplicate-diagnostics-loader-v262.js
          node --check duplicate-diagnostics-ui-v261.js
          node --check duplicate-diagnostics-ui-v261-stability.js
          node --check service-worker-v262.js
          grep -q 'duplicate-diagnostics-loader-v262.js?v=20260806-duplicate-diagnostics-ui-v262' index.html
          grep -q 'duplicate-diagnostics-loader-v262.js?v=20260806-duplicate-diagnostics-ui-v262' docs/index.html
          if grep -q 'aldusDuplicateDiagnosticsLoaderV260' index.html; then exit 1; fi
          cmp duplicate-diagnostics-ui-v261.js docs/duplicate-diagnostics-ui-v261.js
          cmp duplicate-diagnostics-ui-v261.css docs/duplicate-diagnostics-ui-v261.css
          cmp service-worker-v262.js docs/service-worker-v262.js

      - name: Commit hotfix
        run: |
          rm .github/workflows/publish-diagnostic-cache-hotfix-v262.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige cache e carregamento do diagnóstico V262"
          git push origin HEAD:fix/cache-diagnostico-v262
