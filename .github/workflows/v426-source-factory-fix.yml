name: V426 source factory fix

on:
  push:
    branches:
      - v426-persistence-source-fix

permissions:
  contents: write

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: v426-persistence-source-fix
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Preservar contratos lexicais da Fábrica
        shell: python
        run: |
          from pathlib import Path
          for name in ('script.js', 'docs/script.js'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              old = '''            const findExisting = (group) => {
              const exact = byKey.get(group.key);
              if (exact) return exact;
'''
              new = '''            const findExisting = (group) => {
              const existing = byKey.get(group.key);
              if (existing) return existing;
'''
              if old not in text:
                  raise SystemExit(f'groupKey block missing: {name}')
              text = text.replace(old, new, 1)
              old = '''              const createdItem = normalizeFactoryItem({
                id: createId(), disciplina: group.discipline, tema: group.subject, prioridade: "Média", status: "Não iniciado",
                observacao: recorte, createdAt: now, updatedAt: now,
                editalLink: { groupKey: group.key, itemIds: group.itemIds, itemKeys: group.itemKeys, discipline: group.discipline, subject: group.subject, references: group.references, topics: group.topics },
                editalSubtemas: group.subtopics, editalActive: true
              });
              agenda.push(createdItem);
              indexItem(createdItem);
'''
              new = '''              agenda.push(normalizeFactoryItem({
                id: createId(), disciplina: group.discipline, tema: group.subject, prioridade: "Média", status: "Não iniciado",
                observacao: recorte, createdAt: now, updatedAt: now,
                editalLink: { groupKey: group.key, itemIds: group.itemIds, itemKeys: group.itemKeys, discipline: group.discipline, subject: group.subject, references: group.references, topics: group.topics },
                editalSubtemas: group.subtopics, editalActive: true
              }));
              const createdItem = agenda[agenda.length - 1];
              indexItem(createdItem);
'''
              if old not in text:
                  raise SystemExit(f'creation block missing: {name}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Regerar bundles e testar
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
          changed_workers="$(git diff --name-only | grep -E '(^|/)service-worker[^/]*\.js$' || true)"
          if [ -n "$changed_workers" ]; then
            echo "$changed_workers" | xargs -r git restore --
          fi
          node --test tests/factory-sync-rename-v426.test.js tests/stability.test.js
          cmp script.js docs/script.js
          cmp app.bundle.js docs/app.bundle.js
          cmp app-v424.js docs/app-v424.js
          test -z "$(git diff --name-only | grep -E '(^|/)service-worker[^/]*\.js$' || true)"
      - name: Enviar código e bundles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js docs/script.js app.bundle.js docs/app.bundle.js app-v424.js docs/app-v424.js
          git commit -m 'fix(v426): preservar contrato da sincronização da Fábrica'
          git push origin HEAD:v426-persistence-source-fix
