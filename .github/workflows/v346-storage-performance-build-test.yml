name: V346 storage performance build and test

on:
  push:
    branches:
      - fix/storage-performance-v346

permissions:
  contents: write

jobs:
  build-test:
    if: ${{ !contains(github.event.head_commit.message, '[skip v346-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/storage-performance-v346
          fetch-depth: 0

      - name: Apply only pending V346 fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const syncPath = 'sync-integral-deletions.js';
          let source = fs.readFileSync(syncPath, 'utf8');
          const oldSignature = `function syncRecordSignature(value) {
            return JSON.stringify(value ?? null, (key, entry) => SYNC_REVISION_FIELDS.has(key) ? undefined : entry);
          }`;
          const stableSignature = `function syncRecordSignature(value) {
            if (value === null || value === undefined) return "null";
            if (Array.isArray(value)) {
              return \`[\${value.map(syncRecordSignature).sort().join(",")}]\`;
            }
            if (typeof value === "object") {
              return \`{\${Object.keys(value)
                .filter((key) => !SYNC_REVISION_FIELDS.has(key))
                .sort()
                .map((key) => \`\${JSON.stringify(key)}:\${syncRecordSignature(value[key])}\`)
                .join(",")}}\`;
            }
            return JSON.stringify(value);
          }`;
          if (source.includes(oldSignature)) source = source.replace(oldSignature, stableSignature);
          else if (!source.includes(stableSignature)) throw new Error('syncRecordSignature atual não corresponde à V346 esperada.');
          fs.writeFileSync(syncPath, source);
          fs.copyFileSync(syncPath, 'docs/sync-integral-deletions.js');

          const testPath = 'tests/sync-device-deletions.test.js';
          let tests = fs.readFileSync(testPath, 'utf8');
          const marker = 'test("arquivos publicados permanecem idênticos e cache usa a versão atual", () => {';
          const semanticTests = `test("assinatura permanece estável com ordem diferente das propriedades", () => {
            const sync = loadSyncEngine();
            const a = { id: "m1", title: "Material", nested: { a: 1, b: 2 } };
            const b = { nested: { b: 2, a: 1 }, title: "Material", id: "m1" };
            assert.equal(sync.syncRecordSignature(a), sync.syncRecordSignature(b));
          });

          test("assinatura preserva semântica estável de arrays da sincronização", () => {
            const sync = loadSyncEngine();
            assert.equal(
              sync.syncRecordSignature({ id: "m1", tags: ["a", "b"] }),
              sync.syncRecordSignature({ tags: ["b", "a"], id: "m1" })
            );
          });

          `;
          if (!tests.includes('assinatura permanece estável com ordem diferente das propriedades')) {
            const position = tests.indexOf(marker);
            if (position < 0) throw new Error('Marcador para inserir testes V346 não encontrado.');
            tests = tests.slice(0, position) + semanticTests + tests.slice(position);
            fs.writeFileSync(testPath, tests);
          }

          const release = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (release !== '20260816-storage-performance-v346') throw new Error(`Versão inesperada em package.json: ${release}`);
          let lock = fs.readFileSync('package-lock.json', 'utf8');
          lock = lock.replaceAll('20260816-storage-consistency-v345', release);
          fs.writeFileSync('package-lock.json', lock);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build V346 bundles
        run: npm run build

      - name: Validate generated JavaScript
        run: |
          test -f app-v346.js
          test -f docs/app-v346.js
          node --check app-v346.js
          node --check docs/app-v346.js
          node --check sync-integral-deletions.js

      - name: Run focused V346 sync tests
        run: |
          node --test \
            --test-name-pattern="exclusão mais recente|edição posterior|edição numérica|lista editável|adições diferentes|rastreador cria|snapshot de exclusões|rastreador atualiza|campos de revisão|assinatura permanece|assinatura preserva" \
            tests/sync-device-deletions.test.js

      - name: Capture V346 full-suite baseline
        run: |
          set +e
          npm test > /tmp/v346-tests.txt 2>&1
          echo "$?" > /tmp/v346-status.txt
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('/tmp/v346-tests.txt', 'utf8');
          const summary = text.match(/# tests \d+[\s\S]*?# duration_ms [^\n]+/g)?.at(-1) || 'Resumo TAP indisponível';
          console.log(summary);
          NODE

      - name: Run V345 main baseline with same suite
        run: |
          git fetch origin main
          rm -rf /tmp/v345-baseline
          git worktree add --detach /tmp/v345-baseline origin/main
          cd /tmp/v345-baseline
          npm ci
          npm run build
          set +e
          npm test > /tmp/v345-tests.txt 2>&1
          echo "$?" > /tmp/v345-status.txt
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('/tmp/v345-tests.txt', 'utf8');
          const summary = text.match(/# tests \d+[\s\S]*?# duration_ms [^\n]+/g)?.at(-1) || 'Resumo TAP indisponível';
          console.log(summary);
          NODE

      - name: Compare V346 regressions against V345
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function failures(path) {
            const text = fs.readFileSync(path, 'utf8');
            return [...text.matchAll(/^not ok \d+ - (.+)$/gm)]
              .map((match) => match[1].replace(/\s+#.*$/, '').trim());
          }
          const baseline = new Set(failures('/tmp/v345-tests.txt'));
          const current = new Set(failures('/tmp/v346-tests.txt'));
          const newFailures = [...current].filter((name) => !baseline.has(name)).sort();
          const resolvedFailures = [...baseline].filter((name) => !current.has(name)).sort();
          const report = {
            baselineFailures: baseline.size,
            currentFailures: current.size,
            newFailures,
            resolvedFailures
          };
          fs.writeFileSync('v346-regression-report.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          if (newFailures.length) process.exit(1);
          NODE

      - name: Verify storage performance invariants
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('sync-integral-deletions.js', 'utf8');
          if (source.includes('map.set(key, { record: syncClone(item), signature: syncRecordSignature(item) })')) throw new Error('Snapshot ainda clona registros inteiros.');
          if (!source.includes('if (!canTrackIncrementally) syncRefreshDeletionSnapshot();')) throw new Error('Refresh integral pós-save não foi removido do caminho incremental.');
          if (source.includes('return syncStableSerialize(syncComparableValue(value));')) throw new Error('Assinatura de registro ainda usa o hotspot antigo.');
          if (source.includes('return JSON.stringify(value ?? null, (key, entry) =>')) throw new Error('Assinatura V346 ainda usa JSON.stringify simples.');
          if (fs.readFileSync('sync-integral-deletions.js', 'utf8') !== fs.readFileSync('docs/sync-integral-deletions.js', 'utf8')) throw new Error('Fonte publicada divergiu da fonte raiz.');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.version !== pkg.version || lock.packages?.['']?.version !== pkg.version) throw new Error('package-lock não acompanha V346.');
          NODE
          git diff --check

      - name: Commit verified V346 generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/v346-storage-performance-build-test.yml v346-test-output.txt v346-test-status.txt
          rm -f v346-regression-report.json
          git add -A
          git commit -m "V346 build verified storage performance artifacts [skip v346-ci]"
          git push origin HEAD:fix/storage-performance-v346
