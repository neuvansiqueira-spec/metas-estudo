name: V346 storage performance build and test

on:
  push:
    branches:
      - fix/storage-performance-v346

permissions:
  contents: write

jobs:
  build-test:
    if: ${{ !contains(github.event.head_commit.message, '[skip v346-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/storage-performance-v346
          fetch-depth: 0

      - name: Remove temporary CI and old diagnostics from final tree
        run: |
          git rm -f .github/workflows/v346-storage-performance-build-test.yml
          git rm -f v346-test-output.txt v346-test-status.txt || true

      - name: Prepare V346 sources
        run: node prepare-v346.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build V346 bundles
        run: npm run build

      - name: Validate generated JavaScript and release chain
        run: |
          test -f app-v346.js
          test -f docs/app-v346.js
          test -f service-worker-v346.js
          node --check app-v346.js
          node --check docs/app-v346.js
          node --check sync-integral-deletions.js
          node --check bootstrap-integrity-loader-v258.js
          node --check bootstrap-integrity-loader-v258-core.js
          node --check bootstrap-integrity-loader-v275.js
          node --check bootstrap-integrity-loader-v345-core.js
          node --check service-worker.js
          node --check prepare-v346.mjs

      - name: Run focused V346 and release-chain tests
        run: |
          node --test \
            --test-name-pattern="exclusão mais recente|edição posterior|edição numérica|lista editável|adições diferentes|rastreador cria|snapshot de exclusões|rastreador atualiza|campos de revisão|assinatura permanece|assinatura preserva|V344 permanece incorporada|proteções V345 permanecem|workflows legados não escrevem" \
            tests/sync-device-deletions.test.js \
            tests/v344-interaction-responsiveness.test.js \
            tests/v345-storage-concurrency.test.js \
            tests/v316-timer-telemetry-security.test.js

      - name: Capture V346 full-suite result
        run: |
          set +e
          npm test > /tmp/v346-tests.txt 2>&1
          echo "$?" > /tmp/v346-status.txt
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('/tmp/v346-tests.txt', 'utf8');
          const summary = text.match(/# tests \d+[\s\S]*?# duration_ms [^\n]+/g)?.at(-1) || 'Resumo TAP indisponível';
          console.log(summary);
          NODE

      - name: Run V345 main baseline with same suite
        run: |
          git fetch origin main
          rm -rf /tmp/v345-baseline
          git worktree add --detach /tmp/v345-baseline origin/main
          cd /tmp/v345-baseline
          npm ci
          npm run build
          set +e
          npm test > /tmp/v345-tests.txt 2>&1
          echo "$?" > /tmp/v345-status.txt
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('/tmp/v345-tests.txt', 'utf8');
          const summary = text.match(/# tests \d+[\s\S]*?# duration_ms [^\n]+/g)?.at(-1) || 'Resumo TAP indisponível';
          console.log(summary);
          NODE

      - name: Reject regressions introduced by V346
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function failures(filename) {
            const text = fs.readFileSync(filename, 'utf8');
            return [...text.matchAll(/^not ok \d+ - (.+)$/gm)]
              .map((match) => match[1].replace(/\s+#.*$/, '').trim());
          }
          const baseline = new Set(failures('/tmp/v345-tests.txt'));
          const current = new Set(failures('/tmp/v346-tests.txt'));
          const newFailures = [...current].filter((name) => !baseline.has(name)).sort();
          const resolvedFailures = [...baseline].filter((name) => !current.has(name)).sort();
          console.log(JSON.stringify({
            baselineFailures: baseline.size,
            currentFailures: current.size,
            newFailures,
            resolvedFailures
          }, null, 2));
          if (newFailures.length) process.exit(1);
          NODE

      - name: Verify V346 performance invariants
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const suffix = pkg.version.match(/v\d+$/)?.[0];
          const sync = fs.readFileSync('sync-integral-deletions.js', 'utf8');
          const index = fs.readFileSync('index.html', 'utf8');
          const core258 = fs.readFileSync('bootstrap-integrity-loader-v258-core.js', 'utf8');
          const core345 = fs.readFileSync('bootstrap-integrity-loader-v345-core.js', 'utf8');
          const loader275 = fs.readFileSync('bootstrap-integrity-loader-v275.js', 'utf8');
          const worker = fs.readFileSync('service-worker.js', 'utf8');

          if (lock.version !== pkg.version || lock.packages?.['']?.version !== pkg.version) throw new Error('package-lock não acompanha V346.');
          if (sync.includes('map.set(key, { record: syncClone(item), signature: syncRecordSignature(item) })')) throw new Error('Snapshot ainda clona registros inteiros.');
          if (!sync.includes('if (!canTrackIncrementally) syncRefreshDeletionSnapshot();')) throw new Error('Refresh integral pós-save voltou ao caminho incremental.');
          if (sync.includes('return syncStableSerialize(syncComparableValue(value));')) throw new Error('Hotspot antigo voltou à assinatura de registros.');
          if (sync.includes('return JSON.stringify(value ?? null, (key, entry) =>')) throw new Error('Assinatura intermediária instável ainda está ativa.');
          if (!sync.includes('value.map(syncRecordSignature).sort()')) throw new Error('Semântica estável de arrays não foi preservada.');
          if (!index.includes(`app-${suffix}.js?v=${pkg.version}`)) throw new Error('Index não aponta para app V346.');
          if (!index.includes(`bootstrap-integrity-loader-v258.js?v=${pkg.version}`)) throw new Error('Index ainda pode reutilizar loader V258 antigo.');
          if (!core258.includes(`app-${suffix}.js?v=${pkg.version}`)) throw new Error('Core V258 não aponta para app V346.');
          if (!core345.includes(`app-${suffix}.js?v=${pkg.version}`)) throw new Error('Core V345 não aponta para app V346.');
          if (!core345.includes(`bootstrap-integrity-loader-v258-core.js?v=${pkg.version}`)) throw new Error('Fallback V258 ainda usa cache antigo.');
          if (!loader275.includes(`const VERSION = "${pkg.version}";`)) throw new Error('Loader V275 ainda usa versão antiga de cache.');
          if (!worker.includes(`const CURRENT_VERSION = "${pkg.version}";`)) throw new Error('Service worker não usa V346.');
          if (!worker.includes(`const BOOTSTRAP_VERSION = "${pkg.version}";`)) throw new Error('Service worker ainda injeta bootstrap antigo.');
          if (fs.readFileSync('sync-integral-deletions.js', 'utf8') !== fs.readFileSync('docs/sync-integral-deletions.js', 'utf8')) throw new Error('sync-integral-deletions divergiu em docs.');
          if (fs.readFileSync('bootstrap-integrity-loader-v345-core.js', 'utf8') !== fs.readFileSync('docs/bootstrap-integrity-loader-v345-core.js', 'utf8')) throw new Error('Core V345 divergiu em docs.');
          NODE
          git diff --check

      - name: Commit verified V346 generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V346 build verified storage performance artifacts [skip v346-ci]"
          git push origin HEAD:fix/storage-performance-v346
