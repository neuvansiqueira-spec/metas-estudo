name: Publicar GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Preparar paleta sofisticada dos cartões
        shell: bash
        run: |
          set -euo pipefail

          cp central-goals-palette-v245.css docs/central-goals-palette-v245.css
          cp central-goals-period-palette-v248.css docs/central-goals-period-palette-v248.css
          cp aldus-card-palette-v294.css docs/aldus-card-palette-v294.css

          python - <<'PY'
          from pathlib import Path

          index = Path("docs/index.html")
          text = index.read_text(encoding="utf-8")
          text = text.replace(
              "central-goals-palette-v245.css?v=20260805-dashboard-central-metas-cores-v246",
              "central-goals-palette-v245.css?v=20260809-paleta-cartoes-global-v294",
          )
          text = text.replace(
              "central-goals-period-palette-v248.css?v=20260805-central-period-cards-v248",
              "central-goals-period-palette-v248.css?v=20260809-paleta-cartoes-global-v294",
          )
          index.write_text(text, encoding="utf-8")

          sw = Path("docs/service-worker.js")
          sw_text = sw.read_text(encoding="utf-8")
          old = "-planning-shift-save-v283`;"
          new = "-planning-shift-save-v283-paleta-cartoes-v294`;"
          if old in sw_text and new not in sw_text:
              sw_text = sw_text.replace(old, new, 1)
          sw.write_text(sw_text, encoding="utf-8")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
