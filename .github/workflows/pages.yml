name: Publicar GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Migrar e publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Alterar fonte do Pages para GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"build_type":"workflow"}'
          for attempt in 1 2 3 4 5 6; do
            status=$(curl --silent --show-error --output /tmp/pages-response.txt --write-out '%{http_code}' \
              --request PUT \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPOSITORY}/pages" \
              --data "${payload}")
            if [ "${status}" = "204" ]; then
              echo 'Fonte alterada para GitHub Actions.'
              exit 0
            fi
            echo "Tentativa ${attempt}: GitHub respondeu HTTP ${status}."
            cat /tmp/pages-response.txt || true
            sleep 10
          done
          echo 'Não foi possível alterar a fonte do GitHub Pages.' >&2
          exit 1

      - name: Preparar versão da Central de Metas
        shell: bash
        run: |
          set -euo pipefail

          cp central-goals-palette-v245.css docs/central-goals-palette-v245.css
          cp central-goals-period-palette-v248.css docs/central-goals-period-palette-v248.css

          python - <<'PY'
          from pathlib import Path

          index = Path("docs/index.html")
          text = index.read_text(encoding="utf-8")
          text = text.replace(
              "central-goals-palette-v245.css?v=20260805-dashboard-central-metas-cores-v246",
              "central-goals-palette-v245.css?v=20260809-central-metas-sofisticada-v293",
          )
          text = text.replace(
              "central-goals-period-palette-v248.css?v=20260805-central-period-cards-v248",
              "central-goals-period-palette-v248.css?v=20260809-central-period-cards-sofisticada-v293",
          )
          index.write_text(text, encoding="utf-8")

          sw = Path("docs/service-worker.js")
          sw_text = sw.read_text(encoding="utf-8")
          old = "-planning-shift-save-v283`;"
          new = "-planning-shift-save-v283-central-metas-v293`;"
          if old in sw_text and new not in sw_text:
              sw_text = sw_text.replace(old, new, 1)
          sw.write_text(sw_text, encoding="utf-8")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
