name: Liberar Publicação GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  release-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar publicação legacy V263
        run: echo "Liberação do bloqueio de publicação da paleta refinada do diagnóstico V263; GitHub Pages continua publicado pela raiz da main."
