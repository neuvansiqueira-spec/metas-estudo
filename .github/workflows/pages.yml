name: Publicar GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Migrar e publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Alterar fonte do Pages para GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"build_type":"workflow"}'
          for attempt in 1 2 3 4 5 6; do
            status=$(curl --silent --show-error --output /tmp/pages-response.txt --write-out '%{http_code}' \
              --request PUT \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPOSITORY}/pages" \
              --data "${payload}")
            if [ "${status}" = "204" ]; then
              echo 'Fonte alterada para GitHub Actions.'
              exit 0
            fi
            echo "Tentativa ${attempt}: GitHub respondeu HTTP ${status}."
            cat /tmp/pages-response.txt || true
            sleep 10
          done
          echo 'Não foi possível alterar a fonte do GitHub Pages.' >&2
          exit 1

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
