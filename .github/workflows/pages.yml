name: Liberar Publicação GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  release-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar publicação legacy
        run: echo "GitHub Pages é publicado diretamente da raiz da main; nenhum deploy paralelo por Actions é necessário."
