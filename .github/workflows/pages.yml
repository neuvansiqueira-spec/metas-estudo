name: Publicar GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Validar segurança e regressões antes da publicação
        run: |
          npm ci --ignore-scripts
          node --check security-hardening-v296.js
          node --check security-observability-v318.js
          node --check service-worker.js
          node --check service-worker-v291.js
          node --check service-worker-v345.js
          node --check usage-telemetry-v315.js
          node --check factory-penalties-v320.js
          node --check factory-resumo-aula-visual-v326.js
          node --check factory-resumo-aula-canonical-v327.js
          node --check planning-variety-v357.js
          node --check planning-piece-rotation-v358.js
          node --check planning-quality-v368.js
          node --test \
            tests/security-hardening-v296.test.js \
            tests/timer-controls-hardening-v268.test.js \
            tests/legacy-timer-recovery.test.js \
            tests/duplicate-diagnostics-v260.test.js \
            tests/duplicate-diagnostics-relations-v266.test.js \
            tests/v302-duplicate-batch-authoritative.test.js \
            tests/v303-duplicate-batch-progress.test.js \
            tests/v303-duplicate-recommendations.test.js \
            tests/v304-duplicate-batch-performance.test.js \
            tests/v305-duplicate-batch-commit.test.js \
            tests/v305-entry-bootstrap.test.js \
            tests/v307-duplicate-recommendation-presentation.test.js \
            tests/v308-duplicate-batch-core-pin.test.js \
            tests/v309-duplicate-flow-owner.test.js \
            tests/v315-usage-telemetry.test.js \
            tests/v317-posthog-telemetry.test.js \
            tests/v315-factory-simulado-visibility.test.js \
            tests/v316-timer-telemetry-security.test.js \
            tests/v318-security-observability.test.js \
            tests/v329-integral-performance.test.js \
            tests/v320-factory-penalties-prompts.test.js \
            tests/v326-factory-resumo-aula-visual.test.js \
            tests/v327-factory-resumo-aula-canonical.test.js \
            tests/service-worker-tombstone-v350.test.js \
            tests/central-time-syllabus-index-v350.test.js \
            tests/daily-summary-time-format-v243.test.js \
            tests/boot-render-coalesce-v350.test.js \
            tests/question-record-index-v351.test.js \
            tests/qb-package-single-pass-v351.test.js \
            tests/v352-active-service-worker-delivery.test.js \
            tests/v357-planning-variety.test.js \
            tests/v358-piece-rotation-repair.test.js \
            tests/v368-planning-quality.test.js
          node -e "require('./tests/current-release-contract.js').assertCurrentReleaseContract()"
          cmp security-hardening-v296.js docs/security-hardening-v296.js
          cmp service-worker.js docs/service-worker.js
          cmp service-worker-v345.js docs/service-worker-v345.js
          cmp usage-telemetry-v315.js docs/usage-telemetry-v315.js

      - name: Preparar paleta sofisticada dos cartões
        shell: bash
        run: |
          set -euo pipefail

          cp central-goals-palette-v245.css docs/central-goals-palette-v245.css
          cp central-goals-period-palette-v248.css docs/central-goals-period-palette-v248.css
          cp aldus-card-palette-v294.css docs/aldus-card-palette-v294.css
          cp security-observability-v318.js docs/security-observability-v318.js
          cp factory-penalties-v320.js docs/factory-penalties-v320.js
          cp factory-resumo-aula-visual-v326.js docs/factory-resumo-aula-visual-v326.js
          cp factory-resumo-aula-canonical-v327.js docs/factory-resumo-aula-canonical-v327.js

          python - <<'PY'
          from pathlib import Path
          import re

          index = Path("docs/index.html")
          text = index.read_text(encoding="utf-8")
          text = text.replace(
              "central-goals-palette-v245.css?v=20260805-dashboard-central-metas-cores-v246",
              "central-goals-palette-v245.css?v=20260809-paleta-cartoes-global-v294",
          )
          text = text.replace(
              "central-goals-period-palette-v248.css?v=20260805-central-period-cards-v248",
              "central-goals-period-palette-v248.css?v=20260809-paleta-cartoes-global-v294",
          )
          # V323: força a URL pública do hub V322 e evita a cópia antiga V298 do cache.
          text = text.replace(
              "questions-hub-v298.css?v=20260810-questoes-integradas-v298",
              "questions-hub-v298.css?v=20260813-simulados-integrados-questoes-v322",
          )
          text = text.replace(
              "questions-hub-v298.js?v=20260810-questoes-integradas-v298",
              "questions-hub-v298.js?v=20260813-simulados-integrados-questoes-v322",
          )
          observability = (
              '  <!-- aldus-security-observability-v318 -->\n'
              '  <script id="aldusSecurityObservabilityV318" '
              'src="security-observability-v318.js?v=20260812-security-observability-v318"></script>\n'
          )
          if "aldusSecurityObservabilityV318" not in text:
              text = text.replace("</body>", observability + "</body>", 1)

          factory_penalties = (
              '  <!-- aldus-factory-penalties-v320 -->\n'
              '  <script id="aldusFactoryPenaltiesV320" '
              'src="factory-penalties-v320.js?v=20260812-factory-penalties-v320"></script>\n'
          )
          if "aldusFactoryPenaltiesV320" not in text:
              text = text.replace("</body>", factory_penalties + "</body>", 1)

          factory_resumo_aula_visual = (
              '  <!-- aldus-factory-resumo-aula-visual-v326 -->\n'
              '  <script id="aldusFactoryResumoAulaVisualV326" '
              'src="factory-resumo-aula-visual-v326.js?v=20260814-factory-resumo-aula-visual-v326"></script>\n'
          )
          if "aldusFactoryResumoAulaVisualV326" not in text:
              text = text.replace("</body>", factory_resumo_aula_visual + "</body>", 1)

          factory_resumo_aula_canonical = (
              '  <!-- aldus-factory-resumo-aula-canonical-v327 -->\n'
              '  <script id="aldusFactoryResumoAulaCanonicalV327" '
              'src="factory-resumo-aula-canonical-v327.js?v=20260814-factory-resumo-aula-canonical-v327"></script>\n'
          )
          if "aldusFactoryResumoAulaCanonicalV327" not in text:
              text = text.replace("</body>", factory_resumo_aula_canonical + "</body>", 1)

          # V368 substitui as entregas inline V357/V360. O runtime cacheável já está nos
          # dois caminhos de bootstrap; remover blocos antigos evita execução duplicada.
          legacy_planning = {
              "aldusPlanningVarietyV357": "planning-variety-v357.js",
              "aldusPieceRotationRepairV358": "planning-piece-rotation-v358.js",
              "aldusPlanningRuntimeV365": "planning-runtime-v365.js",
          }
          for script_id, source_file in legacy_planning.items():
              if not Path(source_file).exists():
                  raise SystemExit(f"V368: fonte legada ausente para auditoria: {source_file}")
              text = re.sub(
                  rf'\s*<!--[^>]*(?:planning|piece)[^>]*-->\s*<script[^>]*id=["\']{script_id}["\'][^>]*>.*?</script>\s*',
                  "\n",
                  text,
                  flags=re.I | re.S,
              )
              text = re.sub(
                  rf'\s*<script[^>]*id=["\']{script_id}["\'][^>]*>.*?</script>\s*',
                  "\n",
                  text,
                  flags=re.I | re.S,
              )

          planning_source = Path("planning-quality-v368.js").read_text(encoding="utf-8")
          planning_match = re.search(r'const VERSION = "([^"]+)";', planning_source)
          if not planning_match:
              raise SystemExit("V368: versão da política de planejamento não encontrada")
          planning_version = planning_match.group(1)
          for bootstrap_file in ("docs/bootstrap-fast-path-v351.js", "docs/bootstrap-integrity-loader-v258-core.js"):
              bootstrap_source = Path(bootstrap_file).read_text(encoding="utf-8")
              if "planning-quality-v368.js" not in bootstrap_source or planning_version not in bootstrap_source:
                  raise SystemExit(f"V368: runtime não ligado ao bootstrap em {bootstrap_file}")
          index.write_text(text, encoding="utf-8")

          # V363: o worker efetivamente registrado é service-worker-v344.js.
          # Ambos os workers públicos recebem um CACHE_NAME derivado da versão do planejamento.
          # Isso força instalação/ativação de worker novo e elimina o HTML antigo sem renomear app-v344.
          for worker_name in ("service-worker.js", "service-worker-v344.js"):
              sw = Path("docs") / worker_name
              sw_text = sw.read_text(encoding="utf-8")
              sw_text = sw_text.replace(
                  'const QUESTIONS_HUB_VERSION = "20260810-questoes-integradas-v298";',
                  'const QUESTIONS_HUB_VERSION = "20260813-simulados-integrados-questoes-v322";',
              )
              sw_text = sw_text.replace(
                  "-questions-hub-v298-question-json-details-v299",
                  "-questions-hub-v322-question-json-details-v299",
              )
              cache_pattern = re.compile(r'(const CACHE_NAME = `[^`\n]+)(`;)')
              delivery_suffix = f"-planning-delivery-{planning_version}"
              if delivery_suffix not in sw_text:
                  sw_text, cache_replaced = cache_pattern.subn(
                      lambda match: match.group(1) + delivery_suffix + match.group(2),
                      sw_text,
                      count=1,
                  )
                  if cache_replaced != 1:
                      raise SystemExit(f"V363: CACHE_NAME não encontrado em {worker_name}")
              if delivery_suffix not in sw_text:
                  raise SystemExit(f"V363: cache de planejamento não aplicado em {worker_name}")
              sw.write_text(sw_text, encoding="utf-8")

          public_worker = Path("docs/service-worker-v344.js").read_text(encoding="utf-8")
          if f"planning-delivery-{planning_version}" not in public_worker:
              raise SystemExit("V363: worker registrado não recebeu a renovação do cache")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

# V363: entrega da política de planejamento vinculada ao cache público.
