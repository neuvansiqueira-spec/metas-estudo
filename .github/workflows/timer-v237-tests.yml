name: Timer v237 tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check timer module syntax
        run: |
          node --check timer-timeline-recovery-v237.js
          node --check docs/timer-timeline-recovery-v237.js
          node --check service-worker.js
          node --check docs/service-worker.js

      - name: Run timer regression tests
        run: >-
          node --test
          tests/timer-modern-flow.test.js
          tests/integral-timer-sync.test.js
          tests/legacy-timer-recovery.test.js
          tests/motivational-sound.test.js
          tests/v87-motivational-toast-single-runtime.test.js
          tests/v96-timer-control-beep-layout.test.js
          tests/timer-safety-v132.test.js
          tests/timer-timeline-recovery-v237.test.js
          tests/timer-timeline-publication-v237.test.js

      - name: Run full test suite
        run: npm test
