name: Testar e publicar cores da Central de Metas V246

on:
  push:
    branches:
      - main
    paths:
      - central-goals-palette-v245.css
      - docs/central-goals-palette-v245.css
      - daily-summary-time-format-v243.js
      - docs/daily-summary-time-format-v243.js
      - service-worker-v236.js
      - docs/service-worker-v236.js
      - index.html
      - docs/index.html
      - scripts/apply-central-goals-palette-v245.mjs
      - tests/central-goals-palette-v245.test.mjs
      - .github/workflows/test-central-goals-palette-v245.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-publish:
    if: ${{ false }} # V316: fluxo legado desativado
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Aplicar V246 no painel realmente exibido
        run: node scripts/apply-central-goals-palette-v245.mjs

      - name: Validar sintaxe
        run: |
          node --check scripts/apply-central-goals-palette-v245.mjs
          node --check daily-summary-time-format-v243.js
          node --check docs/daily-summary-time-format-v243.js
          node --check service-worker-v236.js
          node --check docs/service-worker-v236.js

      - name: Executar testes de regressão
        run: node --test tests/central-goals-palette-v245.test.mjs

      - name: Validar arquivos publicados
        run: |
          git diff --check
          cmp index.html docs/index.html
          cmp central-goals-palette-v245.css docs/central-goals-palette-v245.css
          cmp daily-summary-time-format-v243.js docs/daily-summary-time-format-v243.js
          cmp service-worker-v236.js docs/service-worker-v236.js

      - name: Publicar correção V246
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            index.html docs/index.html \
            daily-summary-time-format-v243.js docs/daily-summary-time-format-v243.js \
            service-worker-v236.js docs/service-worker-v236.js
          if ! git diff --cached --quiet; then
            git commit -m "Publica cores V246 no painel real da Central de Metas"
            git push origin HEAD:main
          fi
