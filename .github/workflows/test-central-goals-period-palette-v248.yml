name: Testar e publicar períodos da Central de Metas V248

on:
  push:
    branches: [main]
    paths:
      - central-goals-period-palette-v248.css
      - docs/central-goals-period-palette-v248.css
      - central-goals-period-palette-v248.js
      - docs/central-goals-period-palette-v248.js
      - scripts/apply-central-goals-period-palette-v248.mjs
      - tests/central-goals-period-palette-v248.test.mjs
      - .github/workflows/test-central-goals-period-palette-v248.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-publish:
    if: ${{ false }} # V316: fluxo legado desativado
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configurar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Aplicar V248 ao componente real
        run: node scripts/apply-central-goals-period-palette-v248.mjs

      - name: Validar sintaxe
        run: |
          node --check scripts/apply-central-goals-period-palette-v248.mjs
          node --check central-goals-period-palette-v248.js
          node --check docs/central-goals-period-palette-v248.js
          node --check service-worker-v236.js
          node --check docs/service-worker-v236.js

      - name: Executar testes de regressão
        run: node --test tests/central-goals-period-palette-v248.test.mjs

      - name: Validar arquivos publicados
        run: |
          git diff --check
          cmp index.html docs/index.html
          cmp central-goals-period-palette-v248.css docs/central-goals-period-palette-v248.css
          cmp central-goals-period-palette-v248.js docs/central-goals-period-palette-v248.js
          cmp service-worker-v236.js docs/service-worker-v236.js

      - name: Publicar V248
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/index.html service-worker-v236.js docs/service-worker-v236.js
          if ! git diff --cached --quiet; then
            git commit -m "Publica paleta V248 em Hoje semana e mês"
            git push origin HEAD:main
          fi
