name: Aplicar integração Simulados

on:
  push:
    branches:
      - agent/adicionar-disciplina-simulados

permissions:
  contents: write

jobs:
  patch-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: agent/adicionar-disciplina-simulados

      - name: Integrar categoria operacional Simulados
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tag_name = 'simulados-edital-integration.js'
          tag = '  <script src="simulados-edital-integration.js?v=20260804-disciplina-simulados-v1"></script>\n'
          marker = '  <script id="aldusAppBundleScript"'

          root_script = Path(tag_name)
          if not root_script.exists():
              raise SystemExit(f'Arquivo ausente: {root_script}')

          targets = [Path('index.html')]
          docs_index = Path('docs/index.html')
          if docs_index.exists():
              docs_script = Path('docs') / tag_name
              docs_script.write_text(root_script.read_text(encoding='utf-8'), encoding='utf-8')
              targets.append(docs_index)

          for path in targets:
              text = path.read_text(encoding='utf-8')
              if tag_name not in text:
                  if marker not in text:
                      raise SystemExit(f'Marcador do bundle não encontrado em {path}')
                  text = text.replace(marker, tag + marker, 1)
              text = text.replace(
                  'Versão: 20260803-pastas-destino-temas-exatos-v232',
                  'Versão: 20260804-disciplina-operacional-simulados-v233'
              )
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validar JavaScript e integração
        shell: bash
        run: |
          node --check simulados-edital-integration.js
          test "$(grep -c 'simulados-edital-integration.js' index.html)" -eq 1
          if [ -f docs/index.html ]; then
            node --check docs/simulados-edital-integration.js
            test "$(grep -c 'simulados-edital-integration.js' docs/index.html)" -eq 1
          fi

      - name: Gravar alteração na branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html simulados-edital-integration.js
          if [ -f docs/index.html ]; then git add docs/index.html docs/simulados-edital-integration.js; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrar disciplina operacional Simulados ao edital"
          git push origin HEAD:agent/adicionar-disciplina-simulados
