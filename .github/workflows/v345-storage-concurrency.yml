name: V345 final validation

on:
  push:
    branches:
      - fix/storage-concurrency-v345

permissions:
  contents: write

jobs:
  final-validate-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Remove temporary V345 build files
        run: |
          rm -f .github/workflows/v345-storage-concurrency.yml
          rm -f tools/apply-v345-storage-concurrency.mjs
          test ! -e .github/workflows/v345-storage-concurrency.yml
          test ! -e tools/apply-v345-storage-concurrency.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Syntax and focused validation
        run: |
          node --check storage-concurrency-v345.js
          node --check bootstrap-integrity-loader-v345-core.js
          node --check catastrophic-state-guard-v275.js
          node --check script.js
          node --check service-worker.js
          node --test tests/v345-storage-concurrency.test.js
          node --test tests/timer-modern-flow.test.js
          node --test tests/legacy-timer-recovery.test.js
          node --test tests/v169-bootstrap-interactive-release.test.js
          node --test tests/v174-daily-plan-open-alignment.test.js
          node --test tests/v341-startup-interaction-recovery.test.js
          node --test tests/v344-interaction-responsiveness.test.js
          node --test tests/v316-timer-telemetry-security.test.js
      - name: Compare complete suite with V344 main
        run: |
          set +e
          npm test > /tmp/v345-full.log 2>&1
          branch_status=$?
          set -e
          git worktree add --detach /tmp/main-baseline origin/main
          cd /tmp/main-baseline
          npm ci --ignore-scripts >/tmp/main-install.log 2>&1
          set +e
          npm test > /tmp/main-full.log 2>&1
          main_status=$?
          set -e
          cd "$GITHUB_WORKSPACE"
          BRANCH_STATUS="$branch_status" MAIN_STATUS="$main_status" node <<'NODE'
          const fs = require('node:fs');
          const failures = (file) => {
            const names = new Set();
            for (const line of fs.readFileSync(file, 'utf8').split(/\r?\n/)) {
              const match = line.match(/^\s*not ok \d+ - (.+)$/);
              if (match) names.add(match[1].trim());
            }
            return names;
          };
          const branch = failures('/tmp/v345-full.log');
          const main = failures('/tmp/main-full.log');
          const added = [...branch].filter((name) => !main.has(name));
          console.log(`V344 main: ${main.size} falhas nomeadas; V345: ${branch.size}; novas: ${added.length}`);
          if (added.length) {
            console.error('Falhas novas na V345:');
            added.forEach((name) => console.error(`- ${name}`));
            process.exit(1);
          }
          NODE
      - name: Final diff check
        run: |
          git diff --check
          git status --short
      - name: Commit clean V345 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "V345: finaliza árvore validada sem auxiliares"
          git push
