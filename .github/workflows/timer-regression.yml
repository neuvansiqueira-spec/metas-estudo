name: Timer regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'script.js'
      - 'app-v*.js'
      - 'timer-*.js'
      - 'factory-*.js'
      - 'daily-summary-*.js'
      - 'planning-integrity-loader-*.js'
      - 'service-worker.js'
      - 'docs/script.js'
      - 'docs/app-v*.js'
      - 'docs/timer-*.js'
      - 'docs/factory-*.js'
      - 'docs/daily-summary-*.js'
      - 'docs/planning-integrity-loader-*.js'
      - 'docs/service-worker.js'
      - 'tests/*timer*'
      - 'tests/*motivational*'
      - 'tests/*factory*'
      - 'tests/*daily-summary*'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check changed runtime syntax
        run: |
          for file in timer-*.js factory-*.js daily-summary-*.js planning-integrity-loader-*.js service-worker.js docs/timer-*.js docs/factory-*.js docs/daily-summary-*.js docs/planning-integrity-loader-*.js docs/service-worker.js; do
            [ -f "$file" ] && node --check "$file"
          done

      - name: Run available focused regressions
        shell: bash
        run: |
          candidates=(
            tests/integral-timer-sync.test.js
            tests/legacy-timer-recovery.test.js
            tests/motivational-sound.test.js
            tests/v87-motivational-toast-single-runtime.test.js
            tests/v96-timer-control-beep-layout.test.js
            tests/timer-safety-v132.test.js
            tests/timer-alarm-audio-extended-v240.test.js
            tests/timer-audio-unifier-v241.test.js
            tests/timer-controls-hardening-v268.test.js
            tests/v315-usage-telemetry.test.js
            tests/v315-factory-simulado-visibility.test.js
            tests/v316-timer-telemetry-security.test.js
            tests/v396-timer-audio-stability.test.js
          )
          existing=()
          for file in "${candidates[@]}"; do
            [ -f "$file" ] && existing+=("$file")
          done
          if [ "${#existing[@]}" -eq 0 ]; then
            echo "Nenhum teste focado disponível."
            exit 1
          fi
          node --test "${existing[@]}"

      - name: Report historical full-suite baseline
        shell: bash
        run: |
          status=0
          npm test > full-test.log 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "A suíte histórica contém contratos anteriores ao bootstrap V309. O conjunto focado acima permanece bloqueante."
            grep -E '# tests |# pass |# fail ' full-test.log | tail -n 10 || true
            exit 0
          fi
          grep -E '# tests |# pass |# fail ' full-test.log | tail -n 10 || true
