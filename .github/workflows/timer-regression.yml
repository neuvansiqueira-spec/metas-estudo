name: Timer regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'script.js'
      - 'app-v*.js'
      - 'timer-*.js'
      - 'factory-*.js'
      - 'planning-integrity-loader-*.js'
      - 'service-worker.js'
      - 'docs/script.js'
      - 'docs/app-v*.js'
      - 'docs/timer-*.js'
      - 'docs/factory-*.js'
      - 'docs/planning-integrity-loader-*.js'
      - 'docs/service-worker.js'
      - 'tests/*timer*'
      - 'tests/*motivational*'
      - 'tests/*factory*'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check changed runtime syntax
        run: |
          for file in timer-*.js factory-*.js planning-integrity-loader-*.js service-worker.js docs/timer-*.js docs/factory-*.js docs/planning-integrity-loader-*.js docs/service-worker.js; do
            [ -f "$file" ] && node --check "$file"
          done

      - name: Run available focused regressions
        shell: bash
        run: |
          candidates=(
            tests/timer-modern-flow.test.js
            tests/integral-timer-sync.test.js
            tests/legacy-timer-recovery.test.js
            tests/motivational-sound.test.js
            tests/v87-motivational-toast-single-runtime.test.js
            tests/v96-timer-control-beep-layout.test.js
            tests/timer-safety-v132.test.js
            tests/timer-timeline-recovery-v237.test.js
            tests/timer-timeline-publication-v237.test.js
            tests/timer-audio-overlap-v238.test.js
            tests/v102-factory-daily-weekly.test.js
            tests/factory-weekly-subject-dedupe-v237.test.js
            tests/factory-weekly-subject-dedupe-extended-v237.test.js
          )
          existing=()
          for file in "${candidates[@]}"; do
            [ -f "$file" ] && existing+=("$file")
          done
          if [ "${#existing[@]}" -eq 0 ]; then
            echo "Nenhum teste focado disponível."
            exit 1
          fi
          node --test "${existing[@]}"

      - name: Run full test suite
        shell: bash
        run: |
          status=0
          npm test > full-test.log 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "A suíte completa falhou. Exibindo somente os blocos relevantes:"
            grep -n -E 'not ok |failureType:|location:|error:|code:|expected:|actual:|operator:|# tests |# pass |# fail ' full-test.log | tail -n 300 || true
            exit "$status"
          fi
          grep -E '# tests |# pass |# fail ' full-test.log | tail -n 10 || true
