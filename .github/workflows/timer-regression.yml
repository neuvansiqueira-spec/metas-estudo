name: Timer regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'script.js'
      - 'app-v*.js'
      - 'timer-*.js'
      - 'service-worker.js'
      - 'docs/script.js'
      - 'docs/app-v*.js'
      - 'docs/timer-*.js'
      - 'docs/service-worker.js'
      - 'tests/*timer*'
      - 'tests/*motivational*'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check timer syntax
        run: |
          for file in timer-*.js docs/timer-*.js service-worker.js docs/service-worker.js; do
            [ -f "$file" ] && node --check "$file"
          done

      - name: Run timer regression tests
        run: >-
          node --test
          tests/timer-modern-flow.test.js
          tests/integral-timer-sync.test.js
          tests/legacy-timer-recovery.test.js
          tests/motivational-sound.test.js
          tests/v87-motivational-toast-single-runtime.test.js
          tests/v96-timer-control-beep-layout.test.js
          tests/timer-safety-v132.test.js
          tests/timer-timeline-recovery-v237.test.js
          tests/timer-timeline-publication-v237.test.js

      - name: Run full test suite
        run: npm test
