name: V353 consolidar no PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'v353-self-apply-pr-final'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar branch completa
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v353-self-apply-pr-final
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Aplicar V353 final
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-v353-navigation-bootstrap.mjs')
          s = p.read_text(encoding='utf-8')
          old = "'-qconcursos-filter-v337-bootstrap-fast-path-v351-navigation-bootstrap-v353`;'"
          new = "'-qconcursos-filter-v337-navigation-bootstrap-v353-bootstrap-fast-path-v351`;'"
          if old not in s:
              raise SystemExit('V353: marcador do cache temporário não encontrado')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node --check tools/apply-v353-navigation-bootstrap.mjs
          node tools/apply-v353-navigation-bootstrap.mjs

      - name: Validar V351 V352 V353
        run: |
          node --check service-worker.js
          node --check service-worker-v344.js
          node --test \
            tests/v351-bootstrap-fast-path.test.js \
            tests/v352-active-service-worker-delivery.test.js \
            tests/v353-navigation-bootstrap-delivery.test.js
          cmp service-worker.js service-worker-v344.js
          cmp service-worker.js docs/service-worker.js
          cmp service-worker.js docs/service-worker-v344.js

      - name: Preparar apenas arquivos não-workflow para o commit do bot
        run: |
          git checkout origin/main -- .github/workflows/security-ci.yml
          git checkout origin/main -- .github/workflows/pages.yml
          rm -f tools/apply-v353-navigation-bootstrap.mjs
          rm -f .github/V353_FINAL_TRIGGER.md

      - name: Consolidar V353 na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-worker.js service-worker-v344.js docs/service-worker.js docs/service-worker-v344.js tests/v353-navigation-bootstrap-delivery.test.js tools/apply-v353-navigation-bootstrap.mjs .github/V353_FINAL_TRIGGER.md
          git commit -m "V353: entrega bootstrap protegido na primeira navegação"
          git push origin HEAD:v353-self-apply-pr-final
