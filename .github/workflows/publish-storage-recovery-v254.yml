name: Publicar recuperação emergencial V254

on:
  push:
    branches: [main]
    paths:
      - storage-recovery-v254.js
      - scripts/apply-storage-recovery-v254.mjs
      - .github/workflows/publish-storage-recovery-v254.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-storage-recovery-v254
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar JavaScript de recuperação
        run: node --check storage-recovery-v254.js

      - name: Aplicar recuperação antes do bootstrap
        run: node scripts/apply-storage-recovery-v254.mjs

      - name: Validar publicação
        shell: bash
        run: |
          node --check docs/storage-recovery-v254.js
          grep -q 'id="aldusStorageRecoveryV254"' index.html
          grep -q 'id="aldusStorageRecoveryV254"' docs/index.html
          grep -q 'STORAGE_RECOVERY_SCRIPT,' service-worker-v236.js
          grep -q 'STORAGE_RECOVERY_SCRIPT,' docs/service-worker-v236.js
          grep -q 'x-aldus-storage-recovery' service-worker-v236.js
          grep -q 'storage-recovery-v254' service-worker-v236.js

      - name: Publicar arquivos corrigidos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/index.html service-worker-v236.js docs/service-worker-v236.js docs/storage-recovery-v254.js
          if git diff --cached --quiet; then
            echo "A recuperação V254 já estava aplicada."
            exit 0
          fi
          git commit -m "Publica recuperação emergencial V254 [skip ci]"
          git push origin HEAD:main
