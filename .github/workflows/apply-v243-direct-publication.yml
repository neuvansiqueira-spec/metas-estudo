name: Apply V243 direct publication

on:
  push:
    branches:
      - fix/force-v243-publication-v244

permissions:
  contents: write

jobs:
  patch-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/force-v243-publication-v244
          fetch-depth: 0

      - name: Patch direct publication
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          DIRECT = '  <script id="aldusDailySummaryTimeFormatV243Direct" src="daily-summary-time-format-v243.js?v=20260805-daily-summary-hours-minutes-v243&hotfix=daily-summary-time-format-hotfix2"></script>'
          LOADER_OLD = '  <script id="aldusPlanningIntegrityLoaderV235" src="planning-integrity-loader-v235.js?v=20260804-simulados-sem-fabrica-cache-unico-v236"></script>'
          LOADER_NEW = '  <script id="aldusPlanningIntegrityLoaderV235" src="planning-integrity-loader-v235.js?v=20260804-simulados-sem-fabrica-cache-unico-v236&publication=v244"></script>'

          for name in ('index.html', 'docs/index.html'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace(LOADER_OLD, LOADER_NEW)
              if 'aldusDailySummaryTimeFormatV243Direct' not in text:
                  if LOADER_NEW not in text:
                      raise SystemExit(f'Loader esperado não encontrado em {name}')
                  text = text.replace(LOADER_NEW, DIRECT + '\n' + LOADER_NEW)
              path.write_text(text, encoding='utf-8')

          for name in ('planning-integrity-loader-v235.js', 'docs/planning-integrity-loader-v235.js'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('const DAILY_SUMMARY_TIME_HOTFIX = "daily-summary-time-format-hotfix1";',
                                  'const DAILY_SUMMARY_TIME_HOTFIX = "daily-summary-time-format-hotfix2";')
              path.write_text(text, encoding='utf-8')

          for name in ('service-worker.js', 'docs/service-worker.js'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('daily-summary-time-v243-hotfix1', 'daily-summary-direct-v244-hotfix2')
              text = text.replace('hotfix=daily-summary-time-format-hotfix1', 'hotfix=daily-summary-time-format-hotfix2')
              text = text.replace('"daily-summary-time-format-hotfix1"', '"daily-summary-time-format-hotfix2"')
              path.write_text(text, encoding='utf-8')

          test_path = Path('tests/daily-summary-direct-publication-v244.test.js')
          test_path.write_text(r'''const test = require("node:test");
          const assert = require("node:assert/strict");
          const fs = require("node:fs");

          const read = (path) => fs.readFileSync(path, "utf8");

          test("index publicado carrega a V243 diretamente com URL inédita", () => {
            const html = read("index.html");
            assert.match(html, /id="aldusDailySummaryTimeFormatV243Direct"/);
            assert.match(html, /daily-summary-time-format-v243\.js\?v=20260805-daily-summary-hours-minutes-v243&hotfix=daily-summary-time-format-hotfix2/);
            assert.match(html, /planning-integrity-loader-v235\.js\?v=20260804-simulados-sem-fabrica-cache-unico-v236&publication=v244/);
          });

          test("raiz e docs publicam o mesmo HTML de inicialização", () => {
            const root = read("index.html");
            const docs = read("docs/index.html");
            const marker = "aldusDailySummaryTimeFormatV243Direct";
            assert.equal(root.includes(marker), true);
            assert.equal(docs.includes(marker), true);
            assert.equal(root.slice(root.indexOf(marker) - 80, root.indexOf(marker) + 300), docs.slice(docs.indexOf(marker) - 80, docs.indexOf(marker) + 300));
          });

          test("loader e service worker usam o hotfix2", () => {
            for (const path of ["planning-integrity-loader-v235.js", "docs/planning-integrity-loader-v235.js"]) {
              assert.match(read(path), /DAILY_SUMMARY_TIME_HOTFIX = "daily-summary-time-format-hotfix2"/);
            }
            for (const path of ["service-worker.js", "docs/service-worker.js"]) {
              const source = read(path);
              assert.match(source, /daily-summary-direct-v244-hotfix2/);
              assert.match(source, /hotfix=daily-summary-time-format-hotfix2/);
              assert.match(source, /x-aldus-daily-summary-time", "daily-summary-time-format-hotfix2"/);
            }
          });

          test("módulo continua formatando horas e minutos", () => {
            const source = read("daily-summary-time-format-v243.js");
            assert.match(source, /return rest \? `\$\{hours\}h \$\{rest\}min` : `\$\{hours\}h`/);
            assert.match(source, /return `\$\{total\}min`/);
          });
          ''', encoding='utf-8')

          workflow = Path('.github/workflows/timer-regression.yml')
          text = workflow.read_text(encoding='utf-8')
          candidate = '          tests/daily-summary-direct-publication-v244.test.js\n'
          anchor = '          tests/daily-summary-time-format-v243.test.js\n'
          if candidate not in text:
              if anchor not in text:
                  raise SystemExit('Âncora de testes V243 não encontrada')
              text = text.replace(anchor, anchor + candidate)
          workflow.write_text(text, encoding='utf-8')

          Path('.github/workflows/apply-v243-direct-publication.yml').unlink()
          PY

      - name: Commit generated patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/index.html planning-integrity-loader-v235.js docs/planning-integrity-loader-v235.js service-worker.js docs/service-worker.js tests/daily-summary-direct-publication-v244.test.js .github/workflows/timer-regression.yml .github/workflows/apply-v243-direct-publication.yml
          git commit -m "fix: força carregamento direto da V243"
          git push origin HEAD:fix/force-v243-publication-v244
