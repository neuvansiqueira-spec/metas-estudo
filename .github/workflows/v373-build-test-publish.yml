name: V373 Build Test Publish

on:
  push:
    branches:
      - agent/v373-fix-jurisprudencia-v332-bootstrap
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v373-jurisprudencia-bootstrap-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    if: ${{ github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/v373-fix-jurisprudencia-v332-bootstrap') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build cache-busted release
        run: npm run build

      - name: Keep standalone V332 synchronized
        run: cp factory-jurisprudencia-prompt-v332.js docs/factory-jurisprudencia-prompt-v332.js

      - name: Validate syntax and targeted regressions
        run: |
          node --check factory-jurisprudencia-prompt-v332.js
          node --check app-v373.js
          node --test \
            tests/factory-jurisprudencia-prompt-v332.test.js \
            tests/v373-jurisprudencia-bootstrap.test.js \
            tests/v372-factory-completion-stability.test.js \
            tests/v344-interaction-responsiveness.test.js \
            tests/emergency-performance-v350.test.js \
            tests/v355-dom-style-hot-path.test.js

      - name: Validate publication consistency
        run: |
          grep -q 'app-v373.js?v=20260822-jurisprudencia-bootstrap-v373' docs/index.html
          grep -q 'app-v373.js?v=20260822-jurisprudencia-bootstrap-v373' bootstrap-integrity-loader-v258-core.js
          grep -q 'factory-jurisprudencia-prompt-v332.js' app-v373.js
          cmp -s app-v373.js docs/app-v373.js
          cmp -s app-v373.css docs/app-v373.css
          cmp -s factory-jurisprudencia-prompt-v332.js docs/factory-jurisprudencia-prompt-v332.js

      - name: Commit generated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração gerada para publicar."
            exit 0
          fi
          git commit -m "V373: gera bundle e invalida cache da correção jurisprudencial"
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
