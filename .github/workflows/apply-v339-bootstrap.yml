name: Aplica V339 bootstrap fast path na branch

on:
  push:
    branches: [codex/v339-bootstrap-fast-path]
    paths:
      - .github/workflows/apply-v339-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: apply-v339-bootstrap-fast-path
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: codex/v339-bootstrap-fast-path
          fetch-depth: 0

      - name: Configura Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Aplica cache-busting e service worker da V339
        run: node tools/apply-v339-bootstrap.mjs

      - name: Valida sintaxe e testes específicos
        run: |
          node --check bootstrap-integrity-loader-v258.js
          node --check bootstrap-app-chain-v339.js
          node --check service-worker-v236.js
          node --check docs/bootstrap-integrity-loader-v258.js
          node --check docs/bootstrap-app-chain-v339.js
          node --check docs/service-worker-v236.js
          node --test tests/v339-bootstrap-fast-path.test.js

      - name: Registra alterações na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/index.html service-worker-v236.js docs/service-worker-v236.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
          else
            git commit -m "V339: atualiza entrada e cache do bootstrap [v339-patched]"
            git push origin HEAD:codex/v339-bootstrap-fast-path
          fi
