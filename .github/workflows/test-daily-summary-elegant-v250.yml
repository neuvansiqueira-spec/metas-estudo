name: Testar e publicar Resumo do Dia elegante V250

on:
  push:
    branches: [main]
    paths:
      - daily-summary-elegant-v250.css
      - docs/daily-summary-elegant-v250.css
      - daily-summary-elegant-v250.js
      - docs/daily-summary-elegant-v250.js
      - scripts/apply-daily-summary-elegant-v250.mjs
      - tests/daily-summary-elegant-v250.test.mjs
      - .github/workflows/test-daily-summary-elegant-v250.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-publish:
    if: ${{ false }} # V316: fluxo legado desativado
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configurar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Aplicar V250 ao Resumo do Dia real
        run: node scripts/apply-daily-summary-elegant-v250.mjs

      - name: Validar sintaxe
        run: |
          node --check scripts/apply-daily-summary-elegant-v250.mjs
          node --check daily-summary-elegant-v250.js
          node --check docs/daily-summary-elegant-v250.js
          node --check service-worker-v236.js
          node --check docs/service-worker-v236.js

      - name: Executar testes
        run: node --test tests/daily-summary-elegant-v250.test.mjs

      - name: Validar arquivos publicados
        run: |
          git diff --check
          cmp index.html docs/index.html
          cmp daily-summary-elegant-v250.css docs/daily-summary-elegant-v250.css
          cmp daily-summary-elegant-v250.js docs/daily-summary-elegant-v250.js
          cmp service-worker-v236.js docs/service-worker-v236.js

      - name: Publicar V250
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/index.html service-worker-v236.js docs/service-worker-v236.js
          if ! git diff --cached --quiet; then
            git commit -m "Publica estilo elegante V250 no Resumo do Dia"
            git push origin HEAD:main
          fi
