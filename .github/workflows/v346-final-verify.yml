name: V346 final verification

on:
  push:
    branches:
      - fix/storage-performance-v346

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip v346-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/storage-performance-v346
          fetch-depth: 0

      - name: Remove temporary verifier from final tree
        run: git rm -f .github/workflows/v346-final-verify.yml

      - name: Install dependencies
        run: npm ci

      - name: Build V346 with generic release preparation
        run: npm run build

      - name: Validate syntax and release chain
        run: |
          test -f app-v346.js
          test -f docs/app-v346.js
          test -f service-worker-v346.js
          node --check app-v346.js
          node --check docs/app-v346.js
          node --check sync-integral-deletions.js
          node --check prepare-release.mjs
          node --check bootstrap-integrity-loader-v258.js
          node --check bootstrap-integrity-loader-v258-core.js
          node --check bootstrap-integrity-loader-v275.js
          node --check bootstrap-integrity-loader-v345-core.js
          node --check service-worker.js

      - name: Run focused V346 and release tests
        run: |
          node --test \
            --test-name-pattern="exclusão mais recente|edição posterior|edição numérica|lista editável|adições diferentes|rastreador cria|snapshot de exclusões|rastreador atualiza|campos de revisão|assinatura permanece|assinatura preserva|V344 permanece incorporada|proteções V345 permanecem|workflows legados não escrevem" \
            tests/sync-device-deletions.test.js \
            tests/v344-interaction-responsiveness.test.js \
            tests/v345-storage-concurrency.test.js \
            tests/v316-timer-telemetry-security.test.js

      - name: Run V346 full suite
        run: |
          set +e
          npm test > /tmp/v346-tests.txt 2>&1
          echo "$?" > /tmp/v346-status.txt
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('/tmp/v346-tests.txt', 'utf8');
          console.log(text.match(/# tests \d+[\s\S]*?# duration_ms [^\n]+/g)?.at(-1) || 'Resumo TAP indisponível');
          NODE

      - name: Run main baseline
        run: |
          git fetch origin main
          rm -rf /tmp/v345-baseline
          git worktree add --detach /tmp/v345-baseline origin/main
          cd /tmp/v345-baseline
          npm ci
          npm run build
          set +e
          npm test > /tmp/v345-tests.txt 2>&1
          echo "$?" > /tmp/v345-status.txt
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('/tmp/v345-tests.txt', 'utf8');
          console.log(text.match(/# tests \d+[\s\S]*?# duration_ms [^\n]+/g)?.at(-1) || 'Resumo TAP indisponível');
          NODE

      - name: Reject new regressions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function failures(filename) {
            const text = fs.readFileSync(filename, 'utf8');
            return [...text.matchAll(/^not ok \d+ - (.+)$/gm)].map((m) => m[1].replace(/\s+#.*$/, '').trim());
          }
          const baseline = new Set(failures('/tmp/v345-tests.txt'));
          const current = new Set(failures('/tmp/v346-tests.txt'));
          const newFailures = [...current].filter((name) => !baseline.has(name)).sort();
          console.log(JSON.stringify({ baselineFailures: baseline.size, currentFailures: current.size, newFailures }, null, 2));
          if (newFailures.length) process.exit(1);
          NODE

      - name: Verify final invariants
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const suffix = pkg.version.match(/v\d+$/)?.[0];
          const sync = fs.readFileSync('sync-integral-deletions.js', 'utf8');
          const index = fs.readFileSync('index.html', 'utf8');
          const core258 = fs.readFileSync('bootstrap-integrity-loader-v258-core.js', 'utf8');
          const core345 = fs.readFileSync('bootstrap-integrity-loader-v345-core.js', 'utf8');
          const loader275 = fs.readFileSync('bootstrap-integrity-loader-v275.js', 'utf8');
          const worker = fs.readFileSync('service-worker.js', 'utf8');
          if (pkg.version !== '20260816-storage-performance-v346') throw new Error('Versão V346 inesperada.');
          if (lock.version !== pkg.version || lock.packages?.['']?.version !== pkg.version) throw new Error('package-lock fora da V346.');
          if (!fs.readFileSync('package.json', 'utf8').includes('node prepare-release.mjs && node build-bundles.mjs')) throw new Error('Build não usa preparação genérica de release.');
          if (sync.includes('return syncStableSerialize(syncComparableValue(value));')) throw new Error('Hotspot antigo voltou.');
          if (sync.includes('map.set(key, { record: syncClone(item), signature: syncRecordSignature(item) })')) throw new Error('Snapshot voltou a clonar registros.');
          if (!sync.includes('if (!canTrackIncrementally) syncRefreshDeletionSnapshot();')) throw new Error('Refresh integral voltou ao caminho incremental.');
          if (!index.includes(`app-${suffix}.js?v=${pkg.version}`)) throw new Error('Index não aponta para V346.');
          if (!index.includes(`bootstrap-integrity-loader-v258.js?v=${pkg.version}`)) throw new Error('Cache do loader V258 não foi renovado.');
          if (!core258.includes(`app-${suffix}.js?v=${pkg.version}`)) throw new Error('Core V258 não aponta para V346.');
          if (!core345.includes(`app-${suffix}.js?v=${pkg.version}`)) throw new Error('Core protegido não aponta para V346.');
          if (!core345.includes(`bootstrap-integrity-loader-v258-core.js?v=${pkg.version}`)) throw new Error('Fallback protegido usa cache antigo.');
          if (!loader275.includes(`const VERSION = "${pkg.version}";`)) throw new Error('Loader V275 usa cache antigo.');
          if (!worker.includes(`const CURRENT_VERSION = "${pkg.version}";`) || !worker.includes(`const BOOTSTRAP_VERSION = "${pkg.version}";`)) throw new Error('Service worker não está integralmente na V346.');
          NODE
          git diff --check

      - name: Commit final verified branch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V346 final verified storage performance build [skip v346-ci]"
          git push origin HEAD:fix/storage-performance-v346
