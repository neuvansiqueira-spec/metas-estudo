name: V376 Performance Executor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: v376-performance-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  build-v376:
    if: ${{ github.event.pull_request.head.ref == 'v376-sync-startup-performance' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V376 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: v376-sync-startup-performance
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Prepare release bridges
        shell: bash
        run: |
          set -euo pipefail
          VERSION='20260823-sync-startup-performance-v376'
          for file in bootstrap-fast-path-v351.js docs/bootstrap-fast-path-v351.js; do
            perl -0pi -e 's/const VERSION = "20260823-bootstrap-current-runtime-v375";/const VERSION = "20260823-sync-startup-performance-v376";/' "$file"
            perl -0pi -e 's/app-v375\.js\?v=20260823-bootstrap-current-runtime-v375/app-v376.js?v=20260823-sync-startup-performance-v376/g' "$file"
          done
          for file in bootstrap-integrity-loader-v275.js docs/bootstrap-integrity-loader-v275.js; do
            perl -0pi -e 's/const VERSION = "20260823-bootstrap-current-runtime-v375";/const VERSION = "20260823-sync-startup-performance-v376";/' "$file"
          done
          for file in service-worker.js docs/service-worker.js; do
            perl -0pi -e 's/const FAST_BOOTSTRAP_VERSION = "20260823-bootstrap-current-runtime-v375";/const FAST_BOOTSTRAP_VERSION = "20260823-sync-startup-performance-v376";/' "$file"
          done
          npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate optimized source
        run: |
          node --check sync-integral-deletions.js
          node --test tests/v376-sync-startup-performance.test.js

      - name: Build V376
        run: npm run build

      - name: Publish versioned worker
        shell: bash
        run: |
          set -euo pipefail
          cp service-worker.js service-worker-v376.js
          cp service-worker.js docs/service-worker.js
          cp service-worker.js docs/service-worker-v376.js
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'published-service-workers.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const versions = Array.isArray(data.versoes) ? data.versoes : [];
          if (!versions.includes('v376')) versions.push('v376');
          data.versoes = versions;
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          NODE

      - name: Validate generated V376
        shell: bash
        run: |
          set -euo pipefail
          node --check app-v376.js
          node --check service-worker.js
          node --check bootstrap-fast-path-v351.js
          node --check bootstrap-integrity-loader-v275.js
          node --test tests/sync-device-deletions.test.js tests/v376-sync-startup-performance.test.js
          grep -q 'app-v376.js?v=20260823-sync-startup-performance-v376' bootstrap-fast-path-v351.js
          grep -q 'const FAST_BOOTSTRAP_VERSION = "20260823-sync-startup-performance-v376"' service-worker.js
          grep -q 'const VERSION = "20260823-sync-startup-performance-v376"' bootstrap-integrity-loader-v275.js
          cmp -s sync-integral-deletions.js docs/sync-integral-deletions.js
          cmp -s service-worker.js docs/service-worker.js

      - name: Commit generated release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'V376: gera release de desempenho do bootstrap'
          git push origin HEAD:v376-sync-startup-performance
