name: V398 Cache Delivery

on:
  push:
    branches:
      - fix/lc259-plan-factory-v398

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/lc259-plan-factory-v398
      - name: Aplicar cache-bust V398
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          old_startup = 'startup-planning-stability-v387.js?v=20260824-startup-planning-stability-v387'
          new_startup = 'startup-planning-stability-v387.js?v=20260826-planning-consent-guard-v398'
          for name in ['security-observability-v318.js', 'docs/security-observability-v318.js']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if old_startup not in text:
                  raise SystemExit(f'loader antigo não encontrado: {name}')
              p.write_text(text.replace(old_startup, new_startup), encoding='utf-8')

          new_obs = 'security-observability-v318.js?v=20260826-planning-consent-guard-v398'
          obs_pattern = re.compile(r'security-observability-v318\.js\?v=[A-Za-z0-9._-]+')
          for name in ['index.html', 'docs/index.html', '.github/workflows/pages.yml']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              updated, count = obs_pattern.subn(new_obs, text)
              if count == 0:
                  raise SystemExit(f'referência de observabilidade não encontrada: {name}')
              p.write_text(updated, encoding='utf-8')

          test = Path('tests/v387-startup-planning-stability.test.js')
          text = test.read_text(encoding='utf-8')
          old_test = r'startup-planning-stability-v387\.js\?v=20260824-startup-planning-stability-v387'
          new_test = r'startup-planning-stability-v387\.js\?v=20260826-planning-consent-guard-v398'
          if old_test not in text:
              raise SystemExit('expectativa antiga do teste V387 não encontrada')
          test.write_text(text.replace(old_test, new_test), encoding='utf-8')

          old_cache = '-planning-stability-v397-no-auto-reload-v395'
          new_cache = '-planning-stability-v397-planning-consent-v398-no-auto-reload-v395'
          for name in ['service-worker.js', 'service-worker-v378.js', 'docs/service-worker.js', 'docs/service-worker-v378.js']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if old_cache not in text:
                  raise SystemExit(f'sufixo de cache antigo não encontrado: {name}')
              p.write_text(text.replace(old_cache, new_cache), encoding='utf-8')
          PY
          node --check security-observability-v318.js
          node --check startup-planning-stability-v387.js
          node --check factory-lc259-link-v398.js
          node --check service-worker.js
          node --test tests/v387-startup-planning-stability.test.js tests/v398-lc259-plan-factory.test.js tests/v352-active-service-worker-delivery.test.js
          cmp security-observability-v318.js docs/security-observability-v318.js
          cmp startup-planning-stability-v387.js docs/startup-planning-stability-v387.js
          cmp factory-lc259-link-v398.js docs/factory-lc259-link-v398.js
          cmp service-worker.js service-worker-v378.js
          cmp service-worker.js docs/service-worker.js
          cmp service-worker.js docs/service-worker-v378.js
          git diff --check
      - name: Commitar entrega V398
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add security-observability-v318.js docs/security-observability-v318.js index.html docs/index.html .github/workflows/pages.yml tests/v387-startup-planning-stability.test.js service-worker.js service-worker-v378.js docs/service-worker.js docs/service-worker-v378.js
          git commit -m 'fix: renovar entrega e cache da V398'
          git push origin HEAD:fix/lc259-plan-factory-v398
