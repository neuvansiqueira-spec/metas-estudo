name: Testar e publicar estilo elegante V249

on:
  push:
    branches: [main]
    paths:
      - elegant-card-style-v249.css
      - docs/elegant-card-style-v249.css
      - scripts/apply-elegant-card-style-v249.mjs
      - tests/elegant-card-style-v249.test.mjs
      - .github/workflows/test-elegant-card-style-v249.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-publish:
    if: ${{ false }} # V316: fluxo legado desativado
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configurar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Aplicar V249
        run: node scripts/apply-elegant-card-style-v249.mjs

      - name: Validar sintaxe
        run: |
          node --check scripts/apply-elegant-card-style-v249.mjs
          node --check service-worker-v236.js
          node --check docs/service-worker-v236.js

      - name: Executar testes de regressão
        run: node --test tests/elegant-card-style-v249.test.mjs

      - name: Validar arquivos publicados
        run: |
          git diff --check
          cmp index.html docs/index.html
          cmp elegant-card-style-v249.css docs/elegant-card-style-v249.css
          cmp service-worker-v236.js docs/service-worker-v236.js

      - name: Publicar V249
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/index.html service-worker-v236.js docs/service-worker-v236.js
          if ! git diff --cached --quiet; then
            git commit -m "Publica estilo elegante V249 nos cartões coloridos"
            git push origin HEAD:main
          fi
