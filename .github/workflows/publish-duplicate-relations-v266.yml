name: Publicar relações e busca global V266

on:
  push:
    branches:
      - fix/duplicate-relations-global-search-v266
    paths:
      - .github/workflows/publish-duplicate-relations-v266.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/duplicate-relations-global-search-v266
          fetch-depth: 0

      - name: Espelhar arquivos em docs
        run: |
          cp duplicate-diagnostics-relations-v266.js docs/duplicate-diagnostics-relations-v266.js
          cp duplicate-diagnostics-relations-v266.css docs/duplicate-diagnostics-relations-v266.css
          cp duplicate-diagnostics-loader-v266.js docs/duplicate-diagnostics-loader-v266.js
          cp service-worker-v266.js docs/service-worker-v266.js

      - name: Atualizar pontos de entrada e cache
        shell: python
        run: |
          from pathlib import Path
          import re

          loader = '<script id="aldusDuplicateDiagnosticsLoaderV266" src="duplicate-diagnostics-loader-v266.js?v=20260806-duplicate-relations-global-search-v266"></script>'
          pattern = re.compile(r'<script\s+id="aldusDuplicateDiagnosticsLoaderV26[34]"[^>]*></script>', re.I)
          for name in ('index.html', 'docs/index.html'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if pattern.search(text):
                  text = pattern.sub(loader, text, count=1)
              elif 'duplicate-diagnostics-loader-v266.js' not in text:
                  text = text.replace('</body>', f'  {loader}\n</body>')
              path.write_text(text, encoding='utf-8')

          wrapper = 'importScripts("./service-worker-v266.js?v=20260806-duplicate-relations-global-search-v266");\n'
          for name in ('service-worker-v166.js', 'docs/service-worker-v166.js'):
              Path(name).write_text(wrapper, encoding='utf-8')

      - name: Testar V266
        run: |
          node --check duplicate-diagnostics-relations-v266.js
          node --check duplicate-diagnostics-loader-v266.js
          node --check service-worker-v266.js
          node --test tests/duplicate-diagnostics-relations-v266.test.js
          cmp duplicate-diagnostics-relations-v266.js docs/duplicate-diagnostics-relations-v266.js
          cmp duplicate-diagnostics-relations-v266.css docs/duplicate-diagnostics-relations-v266.css
          cmp duplicate-diagnostics-loader-v266.js docs/duplicate-diagnostics-loader-v266.js
          cmp service-worker-v266.js docs/service-worker-v266.js
          grep -q 'aldusDuplicateDiagnosticsLoaderV266' index.html
          grep -q 'aldusDuplicateDiagnosticsLoaderV266' docs/index.html
          grep -q 'service-worker-v266.js' service-worker-v166.js
          grep -q 'service-worker-v266.js' docs/service-worker-v166.js

      - name: Publicar na branch
        run: |
          rm -f .github/workflows/publish-duplicate-relations-v266.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/index.html service-worker-v166.js docs/service-worker-v166.js \
            duplicate-diagnostics-relations-v266.js docs/duplicate-diagnostics-relations-v266.js \
            duplicate-diagnostics-relations-v266.css docs/duplicate-diagnostics-relations-v266.css \
            duplicate-diagnostics-loader-v266.js docs/duplicate-diagnostics-loader-v266.js \
            service-worker-v266.js docs/service-worker-v266.js \
            tests/duplicate-diagnostics-relations-v266.test.js \
            .github/workflows/publish-duplicate-relations-v266.yml
          git commit -m "Adiciona relações e busca global ao diagnóstico V266"
          git push origin HEAD:fix/duplicate-relations-global-search-v266
