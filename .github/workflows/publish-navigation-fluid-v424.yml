name: Publish navigation fluid v424

on:
  push:
    branches:
      - codex/navigation-fluid-v424
    paths:
      - side-nav-hover-collapse-v207.js
      - docs/side-nav-hover-collapse-v207.js
      - aldus-responsive-v52.css
      - docs/aldus-responsive-v52.css
      - tests/navigation-fluid.test.js
      - tests/side-nav-hover-collapse-v207.test.mjs
      - .github/workflows/publish-navigation-fluid-v424.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-navigation-fluid-v424
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: codex/navigation-fluid-v424

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build current bundles
        run: npm run build

      - name: Synchronize active V424 assets
        run: |
          cp app.bundle.js app-v424.js
          cp app.bundle.css app-v424.css
          cp app.bundle.js docs/app-v424.js
          cp app.bundle.css docs/app-v424.css

      - name: Validate navigation and release
        run: >-
          node --test
          tests/navigation-fluid.test.js
          tests/side-nav-hover-collapse-v207.test.mjs
          tests/v73-navigation-scroll.test.js
          tests/v91-collapsible-side-navigation.test.js
          tests/v94-logo-home-links.test.js
          tests/v219-release-pipeline.test.js

      - name: Validate mirrored public files
        run: |
          cmp -s side-nav-hover-collapse-v207.js docs/side-nav-hover-collapse-v207.js
          cmp -s aldus-responsive-v52.css docs/aldus-responsive-v52.css
          cmp -s app.bundle.js docs/app.bundle.js
          cmp -s app.bundle.css docs/app.bundle.css
          cmp -s app-v424.js docs/app-v424.js
          cmp -s app-v424.css docs/app-v424.css
          git diff --check

      - name: Commit generated V424 assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.bundle.js app.bundle.css docs/app.bundle.js docs/app.bundle.css app-v424.js app-v424.css docs/app-v424.js docs/app-v424.css
          if git diff --cached --quiet; then
            echo "Bundles V424 já estavam atualizados."
            exit 0
          fi
          git commit -m "build: publica navegação fluida no bundle V424"
          git push origin HEAD:codex/navigation-fluid-v424
