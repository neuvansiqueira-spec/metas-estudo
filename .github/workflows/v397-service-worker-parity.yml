name: V397 Service Worker Parity

on:
  push:
    branches:
      - "fix/planning-stability-v397"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Synchronize active service worker copies
        run: |
          cp service-worker.js service-worker-v378.js
          cp service-worker.js docs/service-worker-v378.js

      - name: Run affected regression tests
        run: |
          node --test \
            tests/v352-active-service-worker-delivery.test.js \
            tests/v368-planning-quality.test.js \
            tests/v397-planning-stability.test.js

      - name: Validate diff
        run: git diff --check

      - name: Commit parity fix
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Service worker copies already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-worker-v378.js docs/service-worker-v378.js
          git commit -m "fix: sincronizar service worker ativo com v397"
          git push origin HEAD:fix/planning-stability-v397
