name: Validar metas de reforço v156

on:
  push:
    branches:
      - fix/exibir-metas-reforco-v156
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Conferir sintaxe dos arquivos alterados
        run: |
          node --check reinforcement-goal-presentation-v156.js
          node --check daily-study-collapsible-v137.js
          node --check tests/reinforcement-goal-presentation-v156.test.js

      - name: Executar testes específicos da correção
        run: node --test tests/reinforcement-goal-presentation-v156.test.js

      - name: Comparar suíte completa da branch com a v155
        shell: bash
        run: |
          set +e
          npm test > /tmp/branch-test.log 2>&1
          branch_status=$?

          git fetch origin main --depth=1
          git worktree add --detach /tmp/main-v155 origin/main
          (
            cd /tmp/main-v155
            npm test > /tmp/main-test.log 2>&1
          )
          main_status=$?

          echo "=== RESULTADO DA BRANCH ==="
          echo "status=${branch_status}"
          grep -E "^(not ok|# Subtest:|# tests |# pass |# fail |# cancelled |# skipped |# todo |# duration_ms|  error:|  code:|  stack:)" /tmp/branch-test.log | tail -n 180 || true

          echo "=== RESULTADO DA V155/MAIN ==="
          echo "status=${main_status}"
          grep -E "^(not ok|# Subtest:|# tests |# pass |# fail |# cancelled |# skipped |# todo |# duration_ms|  error:|  code:|  stack:)" /tmp/main-test.log | tail -n 180 || true

          if [ "$branch_status" -ne 0 ]; then
            echo "A publicação permanece bloqueada porque a branch não passou em toda a suíte."
            exit "$branch_status"
          fi

      - name: Validar paridade entre raiz e docs
        run: |
          cmp reinforcement-goal-presentation-v156.js docs/reinforcement-goal-presentation-v156.js
          cmp daily-study-collapsible-v137.js docs/daily-study-collapsible-v137.js

      - name: Validar geração dos bundles sem diferenças inesperadas
        run: |
          npm run build
          git diff --exit-code -- \
            app.bundle.css app.bundle.js app-v155.css app-v155.js \
            docs/app.bundle.css docs/app.bundle.js docs/app-v155.css docs/app-v155.js \
            index.html docs/index.html app-version.js docs/app-version.js
