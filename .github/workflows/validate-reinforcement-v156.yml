name: Validar metas de reforço v156

on:
  push:
    branches:
      - fix/exibir-metas-reforco-v156
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Conferir sintaxe dos arquivos alterados
        run: |
          node --check reinforcement-goal-presentation-v156.js
          node --check daily-study-collapsible-v137.js
          node --check tests/reinforcement-goal-presentation-v156.test.js

      - name: Executar testes específicos da correção
        run: node --test tests/reinforcement-goal-presentation-v156.test.js

      - name: Executar suíte completa da branch
        id: branch_tests
        continue-on-error: true
        run: npm test > branch-test.log 2>&1

      - name: Executar suíte completa da v155
        id: main_tests
        continue-on-error: true
        shell: bash
        run: |
          git fetch origin main --depth=1
          git worktree add --detach /tmp/main-v155 origin/main
          cd /tmp/main-v155
          npm test > "$GITHUB_WORKSPACE/main-test.log" 2>&1

      - name: Comparar regressões da branch com a v155
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r"^not ok\s+\d+\s+-\s+(.+)$", re.MULTILINE)
          branch = set(pattern.findall(Path("branch-test.log").read_text(encoding="utf-8", errors="replace")))
          main = set(pattern.findall(Path("main-test.log").read_text(encoding="utf-8", errors="replace")))
          introduced = sorted(branch - main)
          resolved = sorted(main - branch)

          print(f"Falhas já existentes na v155: {len(main)}")
          print(f"Falhas observadas na branch: {len(branch)}")
          print(f"Falhas novas introduzidas: {len(introduced)}")
          print(f"Falhas antigas que deixaram de ocorrer: {len(resolved)}")

          if introduced:
              print("Falhas novas:")
              for item in introduced:
                  print(f"- {item}")
              raise SystemExit(1)

          print("Zero regressão nova em relação à v155.")
          PY

      - name: Salvar relatórios integrais dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reinforcement-v156-test-reports
          path: |
            branch-test.log
            main-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Validar paridade entre raiz e docs
        run: |
          cmp reinforcement-goal-presentation-v156.js docs/reinforcement-goal-presentation-v156.js
          cmp daily-study-collapsible-v137.js docs/daily-study-collapsible-v137.js

      - name: Validar geração dos bundles sem diferenças inesperadas
        run: |
          npm run build
          git diff --exit-code -- \
            app.bundle.css app.bundle.js app-v155.css app-v155.js \
            docs/app.bundle.css docs/app.bundle.js docs/app-v155.css docs/app-v155.js \
            index.html docs/index.html app-version.js docs/app-version.js
