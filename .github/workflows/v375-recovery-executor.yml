name: V375 Recovery Executor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-v375:
    if: github.head_ref == 'v375-bootstrap-current-runtime'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout V375 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: v375-bootstrap-current-runtime
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Apply recovery patches
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const release = '20260823-bootstrap-current-runtime-v375';
          function replace(file, regex, value) {
            const source = fs.readFileSync(file, 'utf8');
            const next = source.replace(regex, value);
            if (next === source && !source.includes(value)) throw new Error(`Patch não aplicado em ${file}`);
            fs.writeFileSync(file, next);
          }
          replace('bootstrap-fast-path-v351.js', /const VERSION = "[^"]+";/, `const VERSION = "${release}";`);
          replace('bootstrap-fast-path-v351.js', /\["aldusAppBundleScript", "app-v\d+\.js\?v=[^"]+"\]/, `["aldusAppBundleScript", "app-v375.js?v=${release}"]`);
          replace('bootstrap-integrity-loader-v275.js', /const VERSION = "[^"]+";/, `const VERSION = "${release}";`);
          replace('service-worker.js', /const FAST_BOOTSTRAP_VERSION = "[^"]+";/, `const FAST_BOOTSTRAP_VERSION = "${release}";`);

          const tombstone = `"use strict";\n\n// service-worker-v344.js — lápide de recuperação. NÃO APAGAR esta URL.\nconst CACHE_PREFIX = "metas-estudo-";\nself.addEventListener("install", () => self.skipWaiting());\nself.addEventListener("message", (event) => { if (event.data?.type === "SKIP_WAITING") self.skipWaiting(); });\nself.addEventListener("activate", (event) => { event.waitUntil(desativarRegistro()); });\nasync function desativarRegistro() {\n  const names = await caches.keys();\n  await Promise.all(names.filter((name) => name.startsWith(CACHE_PREFIX)).map((name) => caches.delete(name).catch(() => false)));\n  await self.clients.claim();\n  await self.registration.unregister();\n  const abas = await self.clients.matchAll({ type: "window", includeUncontrolled: true });\n  await Promise.all(abas.map((aba) => typeof aba.navigate === "function" ? aba.navigate(aba.url).catch(() => null) : null));\n}\n`;
          fs.writeFileSync('service-worker-v344.js', tombstone);
          fs.writeFileSync('docs/service-worker-v344.js', tombstone);

          const manifest = JSON.parse(fs.readFileSync('published-service-workers.json', 'utf8'));
          for (const suffix of ['v374', 'v375']) if (!manifest.versoes.includes(suffix)) manifest.versoes.push(suffix);
          fs.writeFileSync('published-service-workers.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Build V375
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run build
          cp bootstrap-fast-path-v351.js docs/bootstrap-fast-path-v351.js
          cp bootstrap-integrity-loader-v275.js docs/bootstrap-integrity-loader-v275.js
          cp service-worker-v344.js docs/service-worker-v344.js

      - name: Create V375 regression
        shell: bash
        run: |
          cat > tests/v375-bootstrap-current-runtime.test.js <<'EOF'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const read = (file) => fs.readFileSync(file, 'utf8');
          const release = '20260823-bootstrap-current-runtime-v375';
          test('fast path usa V375 e elimina app-v344', () => {
            const fast = read('bootstrap-fast-path-v351.js');
            assert.match(fast, new RegExp(`app-v375\\.js\\?v=${release}`));
            assert.doesNotMatch(fast, /app-v344\.js/);
            assert.equal(fast, read('docs/bootstrap-fast-path-v351.js'));
          });
          test('worker V375 renova URL de bootstrap e artefatos', () => {
            const worker = read('service-worker.js');
            assert.match(worker, new RegExp(`const CURRENT_VERSION = "${release}";`));
            assert.match(worker, new RegExp(`const FAST_BOOTSTRAP_VERSION = "${release}";`));
            assert.ok(fs.existsSync('app-v375.js'));
            assert.ok(fs.existsSync('app-v375.css'));
            assert.ok(fs.existsSync('service-worker-v375.js'));
            assert.equal(read('service-worker-v375.js'), worker);
            assert.equal(read('docs/service-worker-v375.js'), worker);
          });
          test('V344 é lápide sem fetch nem IndexedDB', () => {
            const old = read('service-worker-v344.js');
            assert.doesNotMatch(old, /addEventListener\(\s*["']fetch["']/);
            assert.doesNotMatch(old, /indexedDB/i);
            assert.match(old, /self\.registration\.unregister\(\)/);
            assert.match(old, /\.navigate\(/);
            assert.equal(old, read('docs/service-worker-v344.js'));
          });
          test('manifesto inclui V374 e V375', () => {
            const versions = JSON.parse(read('published-service-workers.json')).versoes;
            assert.ok(versions.includes('v374'));
            assert.ok(versions.includes('v375'));
          });
          EOF

      - name: Focused validation
        run: |
          node --check bootstrap-fast-path-v351.js
          node --check bootstrap-integrity-loader-v275.js
          node --check service-worker-v344.js
          node --check service-worker.js
          node --test tests/v375-bootstrap-current-runtime.test.js tests/v352-active-service-worker-delivery.test.js tests/v353-navigation-bootstrap-delivery.test.js tests/v354-factory-destination-runtime.test.js tests/v355-dom-style-hot-path.test.js tests/v374-piece-destination.test.js tests/service-worker-tombstone-v350.test.js

      - name: Commit V375 generated release
        shell: bash
        run: |
          rm -f .github/workflows/v375-build.yml .github/workflows/v375-pr-build.yml .v375-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V375: rompe ciclo V344 e carrega runtime atual"
          git push origin HEAD:v375-bootstrap-current-runtime
