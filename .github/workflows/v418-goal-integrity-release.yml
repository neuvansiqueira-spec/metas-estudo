name: V418 goal integrity release

on:
  push:
    branches:
      - agent/metas-integridade-v418

permissions:
  contents: write

jobs:
  build-test-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Set V418 release version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = '20260831-metas-integridade-sem-auditoria-v418';
          for (const file of ['package.json', 'package-lock.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.version = version;
            if (data.packages?.['']) data.packages[''].version = version;
            fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`);
          }
          NODE

      - name: Build V418 assets
        run: |
          node build-bundles.mjs
          node --check app-v418.js
          node --check service-worker-v418.js
          node --check daily-piece-audit-performance-v186.js

      - name: Verify no automatic goal mutation scheduler
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('daily-piece-audit-performance-v186.js', 'utf8');
          const forbidden = [
            /setTimeout\s*\(/,
            /setInterval\s*\(/,
            /requestIdleCallback\s*\(/,
            /requestAnimationFrame\s*\(/,
            /MutationObserver/,
            /addEventListener\s*\(/
          ];
          const found = forbidden.filter((pattern) => pattern.test(source));
          if (found.length) {
            console.error('V418 reintroduziu trabalho automático no caminho de abertura:', found.map(String));
            process.exit(1);
          }
          if (!source.includes('explicit-authorization-required') || !source.includes('automaticMutationDisabled: true')) {
            console.error('V418 perdeu a trava explícita da auditoria de metas.');
            process.exit(1);
          }
          console.log('OK: auditoria automática removida do carregamento normal.');
          NODE

      - name: Run goal-integrity regression tests
        run: |
          node --test \
            tests/v186-piece-audit-performance.test.js \
            tests/v404-bootstrap-runtime-unification.test.js \
            tests/v413-core-daily-plan-consistency.test.js \
            tests/v415-security-observer-performance.test.js \
            tests/v416-weekly-status-stability.test.js \
            tests/v417-daily-plan-deterministic-integrity.test.js

      - name: Compare full suite with main baseline
        run: |
          git fetch origin main
          BASE="$(git merge-base HEAD origin/main)"
          git worktree add /tmp/v418-baseline "$BASE"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/v418-baseline/node_modules
          (cd /tmp/v418-baseline && node --test tests/*.test.js > /tmp/v418-base.tap 2>&1) || true
          node --test tests/*.test.js > /tmp/v418-candidate.tap 2>&1 || true
          node <<'NODE'
          const fs = require('node:fs');
          function failures(file) {
            const text = fs.readFileSync(file, 'utf8');
            return new Set([...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map((match) => match[1].trim()));
          }
          const baseline = failures('/tmp/v418-base.tap');
          const candidate = failures('/tmp/v418-candidate.tap');
          const added = [...candidate].filter((name) => !baseline.has(name));
          const removed = [...baseline].filter((name) => !candidate.has(name));
          console.log(`Baseline failures: ${baseline.size}`);
          console.log(`Candidate failures: ${candidate.size}`);
          console.log(`Historical failures removed: ${removed.length}`);
          if (added.length) {
            console.error(`NEW FAILURES (${added.length}):\n${added.join('\n')}`);
            process.exit(1);
          }
          console.log('OK: zero new full-suite failures versus main baseline.');
          NODE

      - name: Verify generated publication contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = '20260831-metas-integridade-sem-auditoria-v418';
          const required = [
            'app-v418.js', 'app-v418.css', 'service-worker-v418.js',
            'docs/app-v418.js', 'docs/app-v418.css', 'docs/service-worker-v418.js'
          ];
          for (const file of required) {
            if (!fs.existsSync(file)) throw new Error(`Artefato ausente: ${file}`);
          }
          const index = fs.readFileSync('index.html', 'utf8');
          const docsIndex = fs.readFileSync('docs/index.html', 'utf8');
          if (index !== docsIndex) throw new Error('index raiz e docs divergiram');
          if (!index.includes(`app-v418.js?v=${version}`)) throw new Error('HTML não aponta para app-v418');
          const worker = fs.readFileSync('service-worker.js', 'utf8');
          if (!worker.includes(`const CURRENT_VERSION = "${version}";`)) throw new Error('service worker não está na V418');
          if (worker !== fs.readFileSync('docs/service-worker.js', 'utf8')) throw new Error('service worker raiz/docs divergiram');
          console.log('OK: contrato de publicação V418 íntegro.');
          NODE

      - name: Commit generated V418 assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "V418: gerar artefatos validados de integridade das metas"
            git push origin HEAD:agent/metas-integridade-v418
          fi
