name: Publicar V421 e remover workflow temporario

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v421-temporary.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v421-temporary
  cancel-in-progress: false

jobs:
  build-test-publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar main preparatoria
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Capturar falhas nominais da V420
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/v420 ffa48a257bc4ad92164c64e62a901447edf0b791
          (
            cd /tmp/v420
            npm ci --ignore-scripts
            set +e
            npm test > /tmp/v420-suite.log 2>&1
            baseline_status=$?
            set -e
            printf '%s\n' "$baseline_status" > /tmp/v420-suite.status
          )
          git worktree remove --force /tmp/v420

          node - <<'NODE'
          const fs = require('fs');
          const log = fs.readFileSync('/tmp/v420-suite.log', 'utf8');
          const status = Number(fs.readFileSync('/tmp/v420-suite.status', 'utf8').trim());
          const failures = [...log.matchAll(/^\s*not ok \d+ - (.+)$/gm)]
            .map((match) => match[1].trim())
            .filter(Boolean)
            .filter((name, index, all) => all.indexOf(name) === index)
            .sort();
          fs.writeFileSync('/tmp/v420-failures.txt', `${failures.join('\n')}${failures.length ? '\n' : ''}`);
          console.log(`V420: status=${status}; falhas nominais=${failures.length}`);
          if (status !== 0 && failures.length === 0) {
            console.error('A suite V420 falhou, mas nenhuma falha nominal TAP pôde ser extraída.');
            process.exit(1);
          }
          NODE

      - name: Aplicar fontes V421 inertes
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            target=${source#.github/v421-payload/root/}
            mkdir -p "$(dirname "$target")"
            cp "$source" "$target"
          done < <(find .github/v421-payload/root -type f -print0)

      - name: Gerar a arvore V421
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Validar contratos direcionados
        run: |
          node --test --test-name-pattern='V221 publica|V421 bump' tests/v219-release-pipeline.test.js
          node --test tests/v404-bootstrap-runtime-unification.test.js
          node --test tests/v413-core-daily-plan-consistency.test.js
          node --test tests/service-worker-tombstone-v350.test.js
          node --test tests/v329-integral-performance.test.js

      - name: Preparar exatamente a arvore final
        shell: bash
        run: |
          set -euo pipefail
          git rm -r -- .github/v421-payload .github/workflows/publish-v421-temporary.yml
          git add -A

      - name: Validar baseline integral por nomes na arvore final
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm test > /tmp/v421-suite.log 2>&1
          candidate_status=$?
          set -e
          printf '%s\n' "$candidate_status" > /tmp/v421-suite.status

          node - <<'NODE'
          const fs = require('fs');

          function extractFailures(path) {
            const log = fs.readFileSync(path, 'utf8');
            return [...log.matchAll(/^\s*not ok \d+ - (.+)$/gm)]
              .map((match) => match[1].trim())
              .filter(Boolean)
              .filter((name, index, all) => all.indexOf(name) === index)
              .sort();
          }

          const baseline = extractFailures('/tmp/v420-suite.log');
          const candidate = extractFailures('/tmp/v421-suite.log');
          const candidateStatus = Number(fs.readFileSync('/tmp/v421-suite.status', 'utf8').trim());
          const baselineSet = new Set(baseline);
          const candidateSet = new Set(candidate);
          const newFailures = candidate.filter((name) => !baselineSet.has(name));
          const resolvedFailures = baseline.filter((name) => !candidateSet.has(name));

          console.log(`V420: falhas nominais=${baseline.length}`);
          console.log(`V421: status=${candidateStatus}; falhas nominais=${candidate.length}`);
          for (const name of resolvedFailures) console.log(`RESOLVIDA: ${name}`);
          for (const name of newFailures) console.error(`NOVA FALHA: ${name}`);

          if (candidateStatus !== 0 && candidate.length === 0) {
            console.error('A suite V421 falhou, mas nenhuma falha nominal TAP pôde ser extraída.');
            process.exit(1);
          }
          if (newFailures.length > 0) {
            console.error(`V421 introduziu ${newFailures.length} falha(s) nominal(is) nova(s).`);
            process.exit(1);
          }
          console.log('Gate nominal aprovado: nenhuma falha nova em relação à V420.');
          NODE

      - name: Validar contratos finais e registrar arvore testada
        shell: bash
        run: |
          set -euo pipefail
          version='20260901-bootstrap-current-bundle-v421'

          cmp -s index.html docs/index.html || { echo 'DIVERGENTE: index.html != docs/index.html'; exit 1; }
          cmp -s bootstrap-fast-path-v351.js docs/bootstrap-fast-path-v351.js || { echo 'DIVERGENTE: bootstrap-fast-path-v351.js != docs/bootstrap-fast-path-v351.js'; exit 1; }
          cmp -s service-worker.js docs/service-worker.js || { echo 'DIVERGENTE: service-worker.js != docs/service-worker.js'; exit 1; }

          grep -Fq "app-v421.js?v=$version" index.html
          grep -Fq "app-v421.css?v=$version" index.html
          grep -Fq "Versão: $version" index.html

          if grep -Fq 'app-v402' bootstrap-fast-path-v351.js; then
            echo 'DIVERGENTE: bootstrap-fast-path-v351.js ainda contém literal app-v402'
            exit 1
          fi

          for worker in service-worker.js docs/service-worker.js service-worker-v421.js docs/service-worker-v421.js; do
            grep -Fq "const CURRENT_VERSION = \"$version\";" "$worker" || {
              echo "DIVERGENTE: $worker não contém CURRENT_VERSION=$version"
              exit 1
            }
          done

          test ! -e .github/v421-payload
          test ! -e .github/workflows/publish-v421-temporary.yml

          git add -A
          tested_tree=$(git write-tree)
          echo "TESTED_TREE=$tested_tree" >> "$GITHUB_ENV"
          echo "ARVORE TESTADA: $tested_tree"

      - name: Publicar exatamente a arvore testada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "V421: derivar bundle atual e renovar cache"

          commit_tree=$(git rev-parse 'HEAD^{tree}')
          if [ "$commit_tree" != "$TESTED_TREE" ]; then
            echo "ARVORE DIVERGENTE ANTES DO PUSH: testada=$TESTED_TREE commit=$commit_tree"
            git diff --name-status "$TESTED_TREE" "$commit_tree" | sed 's/^/DIVERGENTE: /'
            exit 1
          fi

          git push origin HEAD:main

      - name: Conferir arvore publicada contra a testada
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          remote_tree=$(git rev-parse 'origin/main^{tree}')
          echo "ARVORE TESTADA:   $TESTED_TREE"
          echo "ARVORE PUBLICADA: $remote_tree"
          if [ "$remote_tree" != "$TESTED_TREE" ]; then
            echo 'A arvore publicada diverge da arvore testada:'
            git diff --name-status "$TESTED_TREE" "$remote_tree" | sed 's/^/DIVERGENTE: /'
            exit 1
          fi
          echo 'ARVORE PUBLICADA IDÊNTICA À ARVORE TESTADA: nenhuma divergência.'
