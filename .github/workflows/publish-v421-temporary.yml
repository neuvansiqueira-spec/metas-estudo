name: Publicar V421 e remover workflow temporario

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v421-temporary
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar main preparatoria
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main

      - name: Aplicar fontes V421 inertes
        shell: bash
        run: |
          while IFS= read -r -d '' source; do
            target=${source#.github/v421-payload/root/}
            mkdir -p "$(dirname "$target")"
            cp "$source" "$target"
          done < <(find .github/v421-payload/root -type f -print0)

      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca4fa41551a30e30af803 # v4
        with:
          node-version: 22
          cache: npm

      - name: Gerar a arvore V421
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Validar contratos direcionados
        run: |
          node --test --test-name-pattern='V221 publica|V421 bump' tests/v219-release-pipeline.test.js
          node --test tests/v404-bootstrap-runtime-unification.test.js
          node --test tests/v413-core-daily-plan-consistency.test.js
          node --test tests/service-worker-tombstone-v350.test.js
          node --test tests/v329-integral-performance.test.js

      - name: Validar baseline integral
        shell: bash
        run: |
          set +e
          npm test > /tmp/v421-suite.log 2>&1
          suite_status=$?
          set -e
          test "$suite_status" -ne 0
          grep -qx 'ℹ tests 1564' /tmp/v421-suite.log
          grep -qx 'ℹ pass 1440' /tmp/v421-suite.log
          grep -qx 'ℹ fail 124' /tmp/v421-suite.log

      - name: Comparar com a arvore testada e remover temporarios
        shell: bash
        run: |
          git rm -r -- .github/v421-payload .github/workflows/publish-v421-temporary.yml
          git add -A

          divergence=0
          while read -r expected path; do
            actual=$(git rev-parse ":$path" 2>/dev/null || echo AUSENTE)
            if [ "$actual" != "$expected" ]; then
              echo "DIVERGENTE: $path (esperado=$expected atual=$actual)"
              divergence=1
            fi
          done <<'EXPECTED_BLOBS'
          9131f040d0c1f030832e99768343990c1398a1a3 app-v421.css
          13fc15f537cb95c45d2fedd36d5e3014f389cd2b app-v421.js
          296b28d197e628e968c5088b23d2f607cbd46bfb app-version.js
          13fc15f537cb95c45d2fedd36d5e3014f389cd2b app.bundle.js
          80c19fc1e6e08ab02932d112f17a3c5d1dd2ab6b bootstrap-fast-path-v351.js
          97792b8d25076a222322743b2f86cdfcc1304085 bootstrap-integrity-loader-v258-core.js
          e37ba2090212f6636a73a24188205fb76003c10c bootstrap-integrity-loader-v258.js
          b20d111d7cbcb753e738b4f2caa3e20174b5715b bootstrap-integrity-loader-v275.js
          0cdeb3a81e1671e93c2a231a3906cc827b2d1d49 build-bundles.mjs
          9131f040d0c1f030832e99768343990c1398a1a3 docs/app-v421.css
          13fc15f537cb95c45d2fedd36d5e3014f389cd2b docs/app-v421.js
          296b28d197e628e968c5088b23d2f607cbd46bfb docs/app-version.js
          13fc15f537cb95c45d2fedd36d5e3014f389cd2b docs/app.bundle.js
          80c19fc1e6e08ab02932d112f17a3c5d1dd2ab6b docs/bootstrap-fast-path-v351.js
          97792b8d25076a222322743b2f86cdfcc1304085 docs/bootstrap-integrity-loader-v258-core.js
          e37ba2090212f6636a73a24188205fb76003c10c docs/bootstrap-integrity-loader-v258.js
          b20d111d7cbcb753e738b4f2caa3e20174b5715b docs/bootstrap-integrity-loader-v275.js
          59a7e0be78ae2f40c867297af96438cbf94e4b1c docs/index.html
          13e15853492807c675ec2471bd62db6b772ffee1 docs/service-worker-v168.js
          13e15853492807c675ec2471bd62db6b772ffee1 docs/service-worker-v169.js
          13e15853492807c675ec2471bd62db6b772ffee1 docs/service-worker-v332.js
          8acc1efb93b7eca768239775c75d096a30567f60 docs/service-worker-v378.js
          180872d10dc32b0219b635c0266cae55754725fc docs/service-worker-v402.js
          bd3d11e8343aad226f2d00b928045a5ef4f86114 docs/service-worker-v419.js
          13e15853492807c675ec2471bd62db6b772ffee1 docs/service-worker-v421.js
          13e15853492807c675ec2471bd62db6b772ffee1 docs/service-worker.js
          59a7e0be78ae2f40c867297af96438cbf94e4b1c index.html
          5a533fed60cdb09e6465e5843295d47ff3fd1d88 package.json
          aa66a50a5f2406595a1f0376d2b0144b57a04824 published-service-workers.json
          13e15853492807c675ec2471bd62db6b772ffee1 service-worker-v168.js
          13e15853492807c675ec2471bd62db6b772ffee1 service-worker-v169.js
          13e15853492807c675ec2471bd62db6b772ffee1 service-worker-v332.js
          8acc1efb93b7eca768239775c75d096a30567f60 service-worker-v378.js
          180872d10dc32b0219b635c0266cae55754725fc service-worker-v402.js
          bd3d11e8343aad226f2d00b928045a5ef4f86114 service-worker-v419.js
          13e15853492807c675ec2471bd62db6b772ffee1 service-worker-v421.js
          13e15853492807c675ec2471bd62db6b772ffee1 service-worker.js
          65a70c294410bc9cf598209087dc6c1aea1e4c4b tests/v219-release-pipeline.test.js
          5bc1e66647a8f567111022be797defabf81390a8 tests/v404-bootstrap-runtime-unification.test.js
          74a6c331f992d7ecc46e9685b574b1c6867a3f73 tests/v413-core-daily-plan-consistency.test.js
          EXPECTED_BLOBS

          actual_tree=$(git write-tree)
          expected_tree=a7d276690cca0aeb8d053a6e9d9675ed48eaf5d5
          if [ "$actual_tree" != "$expected_tree" ]; then
            echo "ARVORE DIVERGENTE: esperada=$expected_tree atual=$actual_tree"
            divergence=1
          fi
          test "$divergence" -eq 0

      - name: Publicar arvore validada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "V421: derivar bundle atual e renovar cache"
          git push origin HEAD:main
