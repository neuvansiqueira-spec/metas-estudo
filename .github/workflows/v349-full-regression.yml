name: V349 regressão integral

on:
  push:
    branches:
      - fix/runtime-stability-v349

permissions:
  contents: write

concurrency:
  group: v349-full-regression
  cancel-in-progress: true

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar V349
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/runtime-stability-v349
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Simular estado final
        run: rm .github/workflows/v349-full-regression.yml

      - name: Executar suíte completa
        run: npm test

      - name: Validar versão final
        run: |
          node --check app-v349.js
          node --check docs/app-v349.js
          node -e "require('./tests/current-release-contract.js').assertCurrentReleaseContract()"
          git diff --check

      - name: Remover workflow temporário da branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V349: conclui regressão integral [skip ci]"
          git push origin HEAD:fix/runtime-stability-v349
