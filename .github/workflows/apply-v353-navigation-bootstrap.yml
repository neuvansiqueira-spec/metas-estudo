name: Aplicar V353 navegação bootstrap

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Aplicar V353
        run: |
          node --check tools/apply-v353-navigation-bootstrap.mjs
          node tools/apply-v353-navigation-bootstrap.mjs

      - name: Validar V353
        run: |
          node --check service-worker.js
          node --check service-worker-v344.js
          node --test \
            tests/v351-bootstrap-fast-path.test.js \
            tests/v352-active-service-worker-delivery.test.js \
            tests/v353-navigation-bootstrap-delivery.test.js
          cmp service-worker.js service-worker-v344.js
          cmp service-worker.js docs/service-worker.js
          cmp service-worker.js docs/service-worker-v344.js

      - name: Consolidar V353 na main
        run: |
          rm -f tools/apply-v353-navigation-bootstrap.mjs
          rm -f .github/workflows/apply-v353-navigation-bootstrap.yml
          rm -f .github/V353_TRIGGER.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V353: entrega bootstrap protegido na primeira navegação"
          git push origin HEAD:main

      - name: Disparar publicação GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
