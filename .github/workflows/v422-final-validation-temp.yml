name: TEMP V422 validacao final isolada

on:
  push:
    branches:
      - work/v422-validation-final

permissions:
  contents: write

concurrency:
  group: temp-v422-validation-final
  cancel-in-progress: false

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci --ignore-scripts

      - name: Confirmar baseline V422 e registrar suite integral
        shell: bash
        run: |
          set +e
          node --test \
            tests/v380-factory-resumo-aula-jurisprudencia.test.js \
            tests/v381-factory-summary-toc.test.js \
            tests/v382-factory-summary-didactic.test.js \
            tests/v383-factory-lei-jurisprudencia.test.js \
            tests/v385-factory-padronizacao-final-sumario.test.js \
            > /tmp/base-mod.tap 2>&1
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/base-mod.tap').read_text()
          metric=lambda n:int(re.search(rf'^# {n} (\d+)$',t,re.M).group(1))
          expected={
          'V381 cobre exatamente os quatro prompts de conteúdo solicitados',
          'V381 permanece fora dos hot paths e sem persistência automática',
          'V381 preserva identidade visual dos módulos e granularidade útil',
          'V382 continua isolada de hot paths e persistência',
          'V382 torna o sumário um espelho didático do módulo',
          'loader V381 é isolado, ordenado após V380 e raiz/docs permanecem idênticos',
          'regra de sumário é idempotente e preserva o prompt preexistente',
          'sumário é obrigatório, navegável e não inventa paginação'}
          got=set(re.findall(r'^not ok \d+ - (.+)$',t,re.M))
          assert (metric('tests'),metric('pass'),metric('fail'))==(33,25,8),(metric('tests'),metric('pass'),metric('fail'))
          assert got==expected,(got,expected)
          print('BASELINE MODULOS: 33/25/8 nominalmente confirmada')
          PY
          set +e
          npm test > /tmp/base-full.tap 2>&1
          set -e
          tail -n 12 /tmp/base-full.tap

      - name: Corrigir aplicador e aplicar V422
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/apply-v422-temp.py')
          s=p.read_text()
          old="idx = replace_once(idx, 'security-observability-v318.js?v=20260812-security-observability-v318', 'security-observability-v318.js?v=20260901-factory-prompts-v422', 'cache bust observability no index')"
          new="idx, count = re.subn(r'security-observability-v318\\.js\\?v=[^\\\"\\\'<>\\s]+', 'security-observability-v318.js?v=20260901-factory-prompts-v422', idx, count=1)\nif count != 1:\n    raise SystemExit(f'cache bust observability no index: esperado 1 ocorrência, encontrado {count}')"
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new,1),newline='\n')
          PY
          python tools/apply-v422-temp.py

      - name: Corrigir os dois bugs comprovados do harness V422
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/v422-factory-citation-toc.test.js')
          s=p.read_text()
          pairs=[
          ("factoryPromptBase(type) { return this.state?.factoryPromptLibrary?.[type] || ''; },","factoryPromptBase(type) { return saved[type] || ''; },"),
          ('assert.match(source, /<w:shd w:val=\\\\"clear\\\\" w:fill=\\\\"EEECE1\\\\"\\/>/);','assert.match(source, /<w:shd w:val="clear" w:fill="EEECE1"\\/>/);')]
          for a,b in pairs:
              assert s.count(a)==1,(a,s.count(a))
              s=s.replace(a,b,1)
          assert 'this.state?.factoryPromptLibrary' not in s
          assert r'w:val=\\"clear\\"' not in s
          p.write_text(s,newline='\n')
          print('HARNESS: binding e regex corrigidos; escapes impossiveis auditados')
          PY

      - name: Preparar versao e build V422
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json'); d=json.loads(p.read_text()); d['version']='20260901-factory-citation-toc-v422'; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',newline='\n')
          PY
          npm run build

      - name: Renovar artefatos e contratos release-agnostic
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          version='20260901-factory-citation-toc-v422'
          for name in ['service-worker-v402.js','docs/service-worker-v402.js']:
              p=Path(name); s=p.read_text(); s2,n=re.subn(r'const CACHE_FIX_VERSION = "[^"]+";',f'const CACHE_FIX_VERSION = "{version}";',s,count=1)
              assert n==1,(name,n); p.write_text(s2,newline='\n')
          p=Path('published-service-workers.json'); d=json.loads(p.read_text());
          if 'v422' not in d['versoes']: d['versoes'].append('v422')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',newline='\n')
          p=Path('tests/v318-security-observability.test.js'); s=p.read_text()
          old='''    /security-observability-v318\\.js\\?v=\\$\\{OBSERVABILITY_VERSION\\}/.test(index)\n      || /id="aldusSecurityObservabilityV318" defer src="security-observability-v318\\.js\\?v=20260814-desempenho-integral-v329"/.test(index)\n      || /id="aldusSecurityObservabilityV318" defer src="security-observability-v318\\.js\\?v=20260826-planning-consent-guard-v398"/.test(index),'''
          new='''    /security-observability-v318\\.js\\?v=\\$\\{OBSERVABILITY_VERSION\\}/.test(index)\n      || /id="aldusSecurityObservabilityV318" defer src="security-observability-v318\\.js\\?v=[^"]+"/.test(index),'''
          assert s.count(old)==1,s.count(old); p.write_text(s.replace(old,new,1),newline='\n')
          PY
          cmp service-worker-v402.js docs/service-worker-v402.js
          test -f service-worker-v422.js
          test -f docs/service-worker-v422.js

      - name: Validar 41 contratos V380 V381 V382 V383 V385 V422 e bege byte a byte
        shell: bash
        run: |
          node --test \
            tests/v380-factory-resumo-aula-jurisprudencia.test.js \
            tests/v381-factory-summary-toc.test.js \
            tests/v382-factory-summary-didactic.test.js \
            tests/v383-factory-lei-jurisprudencia.test.js \
            tests/v385-factory-padronizacao-final-sumario.test.js \
            tests/v422-factory-citation-toc.test.js | tee /tmp/cand-mod.tap
          grep -Eq '^# tests 41$' /tmp/cand-mod.tap
          grep -Eq '^# pass 41$' /tmp/cand-mod.tap
          grep -Eq '^# fail 0$' /tmp/cand-mod.tap
          python - <<'PY'
          import re,subprocess
          from pathlib import Path
          base=subprocess.check_output(['git','show','origin/main:factory-summary-toc-v381.js'])
          cand=Path('factory-summary-toc-v381.js').read_bytes(); pat=rb'  const BEIGE_SECTION = `.*?`;\n'
          a=re.search(pat,base,re.S); b=re.search(pat,cand,re.S); assert a and b and a.group(0)==b.group(0)
          print('BEIGE_SECTION: byte a byte identica a origin/main')
          PY

      - name: Validar suite integral sem falhas novas
        shell: bash
        run: |
          set +e
          npm test > /tmp/cand-full.tap 2>&1
          set -e
          tail -n 12 /tmp/cand-full.tap
          python - <<'PY'
          from pathlib import Path
          import re
          get=lambda p:set(re.findall(r'^not ok \d+ - (.+)$',Path(p).read_text(),re.M))
          base=get('/tmp/base-full.tap'); cand=get('/tmp/cand-full.tap')
          removed=base-cand; new=cand-base
          expected={
          'V381 cobre exatamente os quatro prompts de conteúdo solicitados',
          'V381 permanece fora dos hot paths e sem persistência automática',
          'V381 preserva identidade visual dos módulos e granularidade útil',
          'V382 continua isolada de hot paths e persistência',
          'V382 torna o sumário um espelho didático do módulo',
          'loader V381 é isolado, ordenado após V380 e raiz/docs permanecem idênticos',
          'regra de sumário é idempotente e preserva o prompt preexistente',
          'sumário é obrigatório, navegável e não inventa paginação'}
          print('BASE_FAIL',len(base)); print('CAND_FAIL',len(cand)); print('NEW',sorted(new)); print('REMOVED',sorted(removed))
          assert not new,sorted(new)
          assert removed==expected,(sorted(removed),sorted(expected))
          print('SUITE INTEGRAL: zero falhas novas; oito contratos obsoletos resolvidos')
          PY

      - name: Verificacoes finais de paridade migracao e hot path
        shell: bash
        run: |
          set -euo pipefail
          cmp factory-summary-toc-v381.js docs/factory-summary-toc-v381.js
          cmp factory-padronizacao-final-sumario-v385.js docs/factory-padronizacao-final-sumario-v385.js
          cmp security-observability-v318.js docs/security-observability-v318.js
          cmp service-worker-v402.js docs/service-worker-v402.js
          ! grep -Fq 'withJurisprudenceYear' factory-summary-toc-v381.js
          ! grep -Fq '📍 **ANO DA DECISÃO:' factory-summary-toc-v381.js
          grep -Fq '## CITAÇÃO JURISPRUDENCIAL — FORMATO OBRIGATÓRIO' factory-summary-toc-v381.js
          grep -Fq '## SUMÁRIO DIDÁTICO OBRIGATÓRIO DO DOCUMENTO — V422' factory-summary-toc-v381.js
          grep -Fq 'factoryJurisprudenceCitationV422' factory-summary-toc-v381.js
          grep -Fq '"lei"' factory-summary-toc-v381.js
          grep -Fq '"leiJurisprudencia"' factory-summary-toc-v381.js
          grep -Fq 'security-observability-v318.js?v=20260901-factory-prompts-v422' index.html
          grep -Fq 'app-v422.js?v=20260901-factory-citation-toc-v422' index.html
          grep -Fq 'const CURRENT_VERSION = "20260901-factory-citation-toc-v422";' service-worker.js
          grep -Fq 'const CACHE_FIX_VERSION = "20260901-factory-citation-toc-v422";' service-worker-v402.js
          grep -Fq '"v422"' published-service-workers.json
          for token in 'MutationObserver(' 'setInterval(' 'getComputedStyle(' 'requestAnimationFrame(' 'indexedDB.' 'localStorage.' 'autoSyncAfterSave('; do ! grep -Fq "$token" factory-summary-toc-v381.js; done
          python - <<'PY'
          from pathlib import Path
          for f in ['factory-summary-toc-v381.js','docs/factory-summary-toc-v381.js','factory-padronizacao-final-sumario-v385.js','docs/factory-padronizacao-final-sumario-v385.js']:
              assert b'\r\n' not in Path(f).read_bytes(),f
          PY
          git diff --check

      - name: Commitar candidata limpa
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v422-apply-temp.yml .github/workflows/v422-apply-retry-temp.yml .github/workflows/v422-apply-retry2-temp.yml .github/workflows/v422-apply-retry3-temp.yml .github/workflows/v422-final-validation-temp.yml tools/apply-v422-temp.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'V422: citar jurisprudencia em italico e exigir hiperlinks no sumario'
          git push origin HEAD:work/v422-validation-final
