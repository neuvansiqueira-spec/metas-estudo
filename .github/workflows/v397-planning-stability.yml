name: V397 Planning Stability

on:
  push:
    branches:
      - "fix/planning-stability-v397"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply deterministic patch
        run: python3 tools/apply-v397-planning-stability.py

      - name: Run focused regression tests
        run: node --test tests/v368-planning-quality.test.js tests/v397-planning-stability.test.js

      - name: Validate diff
        run: |
          git diff --check
          grep -q "20260826-planning-stability-v397" planning-quality-v368.js
          if grep -q "planning-route-entered" planning-quality-v368.js; then exit 1; fi
          if grep -q "before-export-payload" planning-quality-v368.js; then exit 1; fi

      - name: Commit applied fix
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "V397 already applied; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planning-quality-v368.js docs/planning-quality-v368.js
          git add bootstrap-fast-path-v351.js docs/bootstrap-fast-path-v351.js
          git add bootstrap-integrity-loader-v275.js docs/bootstrap-integrity-loader-v275.js
          git add bootstrap-integrity-loader-v258.js docs/bootstrap-integrity-loader-v258.js
          git add bootstrap-integrity-loader-v258-core.js docs/bootstrap-integrity-loader-v258-core.js
          git add service-worker.js docs/service-worker.js tests
          git commit -m "fix: impedir alteração automática das metas v397"
          git push origin HEAD:fix/planning-stability-v397
