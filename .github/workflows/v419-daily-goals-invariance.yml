name: V419 V108 Diagnostic

on:
  push:
    branches:
      - agent/daily-goals-invariance-v419

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Baseline V108
        shell: bash
        run: |
          set +e
          node --test tests/v108-daily-plan-sync-inflation.test.js > /tmp/v108-baseline.tap 2>&1
          echo "BASELINE_EXIT=$?" >> "$GITHUB_ENV"
          set -e
          cat /tmp/v108-baseline.tap
      - name: Baseline release contract
        shell: bash
        run: |
          set +e
          node -e "require('./tests/current-release-contract.js').assertCurrentReleaseContract()" > /tmp/contract-baseline.log 2>&1
          echo "CONTRACT_BASELINE_EXIT=$?" >> "$GITHUB_ENV"
          set -e
          cat /tmp/contract-baseline.log
      - name: Apply V419 candidate
        shell: bash
        run: |
          python tools/v419_patch.py
          node <<'NODE'
          const fs = require('node:fs');
          const version = '20260831-daily-goals-explicit-mutation-v419';
          for (const file of ['package.json', 'package-lock.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.version = version;
            if (data.packages && data.packages['']) data.packages[''].version = version;
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          }
          NODE
          npm run build
          cp planning-integrity-v235.js docs/planning-integrity-v235.js
          cp planning-integrity-loader-v235.js docs/planning-integrity-loader-v235.js
          cp completed-goal-guard-v177.js docs/completed-goal-guard-v177.js
          cp service-worker-v402.js docs/service-worker-v402.js
      - name: Candidate V108
        shell: bash
        run: |
          set +e
          node --test tests/v108-daily-plan-sync-inflation.test.js > /tmp/v108-candidate.tap 2>&1
          echo "CANDIDATE_EXIT=$?" >> "$GITHUB_ENV"
          set -e
          cat /tmp/v108-candidate.tap
      - name: Candidate release contract
        shell: bash
        run: |
          set +e
          node -e "require('./tests/current-release-contract.js').assertCurrentReleaseContract()" > /tmp/contract-candidate.log 2>&1
          echo "CONTRACT_CANDIDATE_EXIT=$?" >> "$GITHUB_ENV"
          set -e
          cat /tmp/contract-candidate.log
      - name: Compare V108 failures
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function failures(path) {
            return new Set(fs.readFileSync(path, 'utf8').split(/\r?\n/).map(line => line.match(/^\s*not ok\s+\d+\s+-\s+(.*)$/)?.[1]?.trim()).filter(Boolean));
          }
          const baseline = failures('/tmp/v108-baseline.tap');
          const candidate = failures('/tmp/v108-candidate.tap');
          const added = [...candidate].filter(x => !baseline.has(x));
          console.log('V108 baseline failures:', [...baseline]);
          console.log('V108 candidate failures:', [...candidate]);
          console.log('V108 new failures:', added);
          console.log('release contract exits:', process.env.CONTRACT_BASELINE_EXIT, process.env.CONTRACT_CANDIDATE_EXIT);
          if (added.length || (process.env.CONTRACT_BASELINE_EXIT === '0' && process.env.CONTRACT_CANDIDATE_EXIT !== '0')) process.exit(1);
          NODE
