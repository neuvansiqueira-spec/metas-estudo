name: V419 Daily Goals Invariance

on:
  push:
    branches:
      - agent/daily-goals-invariance-v419

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Remove temporary workflow from candidate tree
        run: rm -f .github/workflows/v419-daily-goals-invariance.yml

      - name: Capture baseline suite
        shell: bash
        run: |
          set +e
          node --test tests/*.test.js > /tmp/baseline.tap 2>&1
          echo "BASELINE_EXIT=$?" >> "$GITHUB_ENV"
          set -e
          tail -n 20 /tmp/baseline.tap || true

      - name: Apply V419 source policy and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          RELEASE = "20260831-daily-goals-explicit-mutation-v419"

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"V419 patch mismatch {label}: expected 1 occurrence, found {count}")
              return text.replace(old, new, 1)

          # 1) Planning integrity: startup/replaceState may diagnose, never mutate dailyGoals.
          p = Path("planning-integrity-v235.js")
          text = p.read_text(encoding="utf-8")
          text = replace_once(text,
              'const VERSION = "20260831-metas-concluidas-somente-revisao-v411";',
              f'const VERSION = "{RELEASE}";',
              "planning version")
          text = replace_once(text,
              '        enforceSnapshot();\n        if (postBootstrapMaintenanceComplete()) reconcileDailyPlanOnStartup();\n        return result;',
              '        enforceSnapshot();\n        return result;',
              "replaceState auto reconcile")
          old_reconcile = '''  function reconcileDailyPlanOnStartup(targetState = currentState()) {
    if (!targetState || !Array.isArray(targetState.dailyGoals)) return { changed: false, skipped: "state-unavailable" };
    if (globalThis[STARTUP_RECONCILE_MARKER] === true) return { changed: false, skipped: "already-reconciled" };

    const replenish = globalThis.replenishMissingDailyPlanningGoalsV116;
    if (typeof replenish !== "function") return { changed: false, skipped: "replenisher-unavailable" };

    const date = currentDateISO();
    try {
      const report = replenish(targetState, date) || { changed: false };

      if (report.changed) {
        invalidateViews();
        const reason = "daily-plan-post-bootstrap-reconcile-v410";
        if (typeof globalThis.saveData === "function") {
          globalThis.saveData({ markLocalChange: true, skipDerivedRefresh: true, reason });
        }
        if (typeof globalThis.render === "function") globalThis.render();
        try { if (typeof globalThis.autoSyncAfterSave === "function") globalThis.autoSyncAfterSave(reason); } catch {}
      }

      globalThis[STARTUP_RECONCILE_MARKER] = true;
      return report;
    } catch (error) {
      globalThis[STARTUP_RECONCILE_MARKER] = false;
      console.warn(`[${VERSION}] Não foi possível reconciliar automaticamente o Plano do Dia.`, error);
      return { changed: false, skipped: "replenisher-error" };
    }
  }
'''
          new_reconcile = '''  function reconcileDailyPlanOnStartup(targetState = currentState()) {
    if (!targetState || !Array.isArray(targetState.dailyGoals)) return { changed: false, skipped: "state-unavailable" };
    if (globalThis[STARTUP_RECONCILE_MARKER] === true) return { changed: false, skipped: "already-diagnosed" };

    const date = currentDateISO();
    const completedRecords = completedRecordsV411(targetState);
    const allStudyGoals = targetState.dailyGoals.filter((goal) => goalDateV411(goal) === date && isPlanningStudyGoalV411(goal));
    const actionableGoals = allStudyGoals.filter((goal) => isActionableStudyGoalV411(goal, completedRecords));
    let targets = {};
    try {
      targets = typeof globalThis.planningTargetsForDate === "function"
        ? (globalThis.planningTargetsForDate(date, targetState) || {})
        : {};
    } catch {}
    const topicTarget = Math.max(0, Number(targets.topics) || 0);
    const report = {
      changed: false,
      date,
      topicTarget,
      totalStudyGoals: allStudyGoals.length,
      actionableGoals: actionableGoals.length,
      missingActionableGoals: Math.max(0, topicTarget - actionableGoals.length),
      skipped: "automatic-mutation-disabled-v419"
    };
    globalThis[STARTUP_RECONCILE_MARKER] = true;
    globalThis.__aldusDailyPlanStartupDiagnosticV419 = Object.freeze({ ...report });
    return report;
  }
'''
          text = replace_once(text, old_reconcile, new_reconcile, "startup reconcile body")
          text = replace_once(text,
              '        startupDailyPlanReconcile: true,\n        postBootstrapAuthoritative: true,',
              '        startupDailyPlanReconcile: false,\n        automaticDailyGoalMutationDisabled: true,\n        postBootstrapAuthoritative: true,',
              "planning API policy")
          p.write_text(text, encoding="utf-8")
          Path("docs/planning-integrity-v235.js").write_text(text, encoding="utf-8")

          # 2) Loader: cache-bust the corrected planning core.
          loader = Path("planning-integrity-loader-v235.js")
          ltext = loader.read_text(encoding="utf-8")
          ltext = replace_once(ltext,
              'const PLANNING_CORE_VERSION = "20260831-metas-concluidas-somente-revisao-v411";',
              f'const PLANNING_CORE_VERSION = "{RELEASE}";',
              "loader planning core version")
          loader.write_text(ltext, encoding="utf-8")
          Path("docs/planning-integrity-loader-v235.js").write_text(ltext, encoding="utf-8")

          # 3) Completed-goal guard: keep candidate filtering, but repairs require explicit authorization.
          c = Path("completed-goal-guard-v177.js")
          ctext = c.read_text(encoding="utf-8")
          ctext = replace_once(ctext,
              '  const VERSION = "20260730-metas-concluidas-fora-do-plano-v177";\n  const MIGRATION_KEY = "completedSubjectsOutsideAutomaticPlanV177";',
              f'  const VERSION = "20260730-metas-concluidas-fora-do-plano-v177";\n  const POLICY_VERSION = "{RELEASE}";\n  const MIGRATION_KEY = "completedSubjectsOutsideAutomaticPlanV177";',
              "completed policy version")
          ctext = replace_once(ctext,
              '  function repairExistingAutomaticGoals(targetState = null, reason = "audit") {\n    const currentState = targetState || (typeof state !== "undefined" ? state : null);',
              '  function repairExistingAutomaticGoals(targetState = null, reason = "audit", options = {}) {\n    if (options?.explicit !== true || options?.allowMutations !== true) {\n      return { changed: false, removed: [], converted: [], reason, skipped: "explicit-authorization-required" };\n    }\n    const currentState = targetState || (typeof state !== "undefined" ? state : null);',
              "completed repair gate")
          ctext = replace_once(ctext,
              '  function runAudit(reason) {\n    const goalTypeGuardInstalled = installAutomaticGoalTypeGuard();\n    const candidateGuardInstalled = installCandidateGuard();\n    const repair = repairExistingAutomaticGoals(null, reason);',
              '  function runAudit(reason = "audit", options = {}) {\n    const goalTypeGuardInstalled = installAutomaticGoalTypeGuard();\n    const candidateGuardInstalled = installCandidateGuard();\n    const repair = repairExistingAutomaticGoals(null, reason, options);',
              "completed run audit options")
          old_listeners = '''  const onBootstrapReady = () => runAudit("bootstrap-ready");
  if (globalThis.__aldusBootstrapReady) queueMicrotask(onBootstrapReady);
  else window.addEventListener("aldus:bootstrap-ready", onBootstrapReady, { once: true });

  window.addEventListener("aldus:post-bootstrap-maintenance-complete", () => runAudit("post-bootstrap-maintenance"), { once: true });
  window.addEventListener("pageshow", (event) => {
    if (event.persisted) runAudit("pageshow-bfcache");
  });
  window.addEventListener("storage", () => runAudit("cross-tab-storage"));

'''
          ctext = replace_once(ctext, old_listeners,
              '  // V419: bootstrap, pageshow e storage são somente leitura; nenhum reparo é agendado automaticamente.\n\n',
              "completed automatic listeners")
          ctext = replace_once(ctext,
              '  globalThis.__aldusCompletedGoalGuardV177 = Object.freeze({\n    version: VERSION,\n    goalTypeGuardInstalled,',
              '  globalThis.__aldusCompletedGoalGuardV177 = Object.freeze({\n    version: VERSION,\n    policyVersion: POLICY_VERSION,\n    automaticMutationDisabled: true,\n    goalTypeGuardInstalled,',
              "completed API policy")
          c.write_text(ctext, encoding="utf-8")
          Path("docs/completed-goal-guard-v177.js").write_text(ctext, encoding="utf-8")

          # 4) Update historical regression tests to the stricter V419 invariant.
          common_header = '''const test = require("node:test");
const assert = require("node:assert/strict");
const fs = require("node:fs");
const vm = require("node:vm");

const source = fs.readFileSync("planning-integrity-v235.js", "utf8");
const docsSource = fs.readFileSync("docs/planning-integrity-v235.js", "utf8");
const DATE = "2026-08-30";
const MARKER = "__aldusDailyPlanStartupReconciledV406";
const POST_BOOTSTRAP_ATTR = "data-aldus-bootstrap-maintenance-ms";
const RELEASE = "20260831-daily-goals-explicit-mutation-v419";

class FakeWindow {
  constructor() { this.listeners = new Map(); }
  addEventListener(type, listener, options = {}) {
    const list = this.listeners.get(type) || [];
    list.push({ listener, once: options?.once === true });
    this.listeners.set(type, list);
  }
  emit(type, event = {}) {
    const list = [...(this.listeners.get(type) || [])];
    for (const entry of list) entry.listener({ type, ...event });
    this.listeners.set(type, (this.listeners.get(type) || []).filter((entry) => !entry.once));
  }
}

function makeState(count = 3) {
  return {
    planning: { config: { disciplinesPerDay: count, topicsPerDay: count } },
    dailyGoals: Array.from({ length: count }, (_, index) => ({ id: `auto-${index + 1}`, date: DATE, origin: "planejamento", status: "Pendente", minutes: 60 + index }))
  };
}

function baseContext(targetState, { postBootstrap = true } = {}) {
  const counters = { replenish: 0, save: 0, render: 0, sync: 0 };
  const attrs = new Map();
  if (postBootstrap) attrs.set(POST_BOOTSTRAP_ATTR, "1.0");
  const window = new FakeWindow();
  const snapshot = { disciplines: 6, topics: 6, savedAt: "2026-08-30T20:00:00-03:00" };
  const context = {
    console, state: targetState, window,
    document: {
      readyState: "complete",
      documentElement: { dataset: {}, getAttribute(name) { return attrs.has(name) ? attrs.get(name) : null; }, setAttribute(name, value) { attrs.set(name, String(value)); } },
      getElementById() { return null; }, querySelectorAll() { return []; }, querySelector() { return null; }, addEventListener() {}
    },
    localStorage: { getItem(key) { return key === "aldusPlanningManualGoalsV235" ? JSON.stringify(snapshot) : null; }, setItem() {} },
    planningTargetsForDate(date, s) { return { disciplines: Number(s?.planning?.config?.disciplinesPerDay || 0), topics: Number(s?.planning?.config?.topicsPerDay || 0) }; },
    todayISO() { return DATE; },
    replenishMissingDailyPlanningGoalsV116() { counters.replenish += 1; throw new Error("V419: reposição automática proibida"); },
    saveData() { counters.save += 1; }, render() { counters.render += 1; }, autoSyncAfterSave() { counters.sync += 1; },
    Date, Object, Array, String, Number, Set, Map
  };
  context.globalThis = context;
  return { context, counters, window, attrs };
}
'''

          Path("tests/v406-daily-plan-authoritative-startup.test.js").write_text(common_header + '''

test("V419 restaura apenas a configuração autoritativa sem completar dailyGoals no startup", () => {
  const targetState = makeState(3);
  const before = JSON.stringify(targetState.dailyGoals);
  const { context, counters } = baseContext(targetState);
  vm.createContext(context);
  vm.runInContext(source, context);
  assert.equal(targetState.planning.config.disciplinesPerDay, 6);
  assert.equal(targetState.planning.config.topicsPerDay, 6);
  assert.equal(JSON.stringify(targetState.dailyGoals), before);
  assert.deepEqual(counters, { replenish: 0, save: 0, render: 0, sync: 0 });
  assert.equal(context[MARKER], true);
  assert.equal(context.__ALDUS_PLANNING_INTEGRITY_V235__.startupDailyPlanReconcile, false);
  assert.equal(context.__ALDUS_PLANNING_INTEGRITY_V235__.automaticDailyGoalMutationDisabled, true);
});

test("V419 mantém dailyGoals idêntico em recargas completas repetidas", () => {
  for (let index = 0; index < 5; index += 1) {
    const targetState = makeState(3);
    const before = JSON.stringify(targetState.dailyGoals);
    const { context, counters } = baseContext(targetState);
    vm.createContext(context);
    vm.runInContext(source, context);
    assert.equal(JSON.stringify(targetState.dailyGoals), before, `recarga ${index + 1}`);
    assert.equal(counters.replenish, 0);
    assert.equal(counters.save, 0);
  }
});

test("V419 mantém o hot path sem timers, polling ou observadores", () => {
  for (const token of ["queueMicrotask(", "Promise.resolve().then", "setTimeout(", "setInterval(", "requestAnimationFrame(", "requestIdleCallback(", "MutationObserver"]) {
    assert.equal(source.includes(token), false, token);
  }
  assert.equal(source, docsSource);
});
''', encoding="utf-8")

          Path("tests/v407-planning-state-binding.test.js").write_text(common_header + '''

