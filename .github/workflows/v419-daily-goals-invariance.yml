          python - <<'PY'
          import re
          from pathlib import Path
          def failures(path):
              result = set()
              for line in Path(path).read_text(errors="replace").splitlines():
                  m = re.match(r"\s*not ok\s+\d+\s+-\s+(.*)", line)
                  if m:
                      result.add(m.group(1).strip())
              return result
          baseline = failures("/tmp/baseline.tap")
          candidate = failures("/tmp/candidate.tap")
          new = sorted(candidate - baseline)
          removed = sorted(baseline - candidate)
          print(f"baseline failing tests: {len(baseline)}")
          print(f"candidate failing tests: {len(candidate)}")
          print(f"historical failures removed: {len(removed)}")
          if new:
              print("NEW FAILURES:")
              for item in new: print(f" - {item}")
              raise SystemExit(1)
          print("new failures: 0")
          PY
