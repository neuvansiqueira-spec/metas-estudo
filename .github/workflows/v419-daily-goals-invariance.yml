name: V419 Final Validation

on:
  push:
    branches:
      - agent/daily-goals-invariance-v419

permissions:
  contents: write

jobs:
  validate-build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Capture clean baseline
        shell: bash
        run: |
          cp tools/v419_patch.py /tmp/v419_patch.py
          rm -f .github/workflows/v419-daily-goals-invariance.yml tools/v419_patch.py
          set +e
          node --test tests/*.test.js > /tmp/baseline.tap 2>&1
          BASELINE_EXIT=$?
          set -e
          echo "baseline exit: ${BASELINE_EXIT}"
          tail -n 20 /tmp/baseline.tap || true

      - name: Apply V419 source policy
        shell: bash
        run: |
          python /tmp/v419_patch.py
          node <<'NODE'
          const fs = require('node:fs');
          const version = '20260831-daily-goals-explicit-mutation-v419';
          for (const file of ['package.json', 'package-lock.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.version = version;
            if (data.packages && data.packages['']) data.packages[''].version = version;
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          }
          NODE

      - name: Build V419
        run: npm run build

      - name: Restore standalone publication parity
        shell: bash
        run: |
          cp planning-integrity-v235.js docs/planning-integrity-v235.js
          cp planning-integrity-loader-v235.js docs/planning-integrity-loader-v235.js
          cp completed-goal-guard-v177.js docs/completed-goal-guard-v177.js
          cp service-worker-v402.js docs/service-worker-v402.js

      - name: Validate syntax, publication and performance guards
        shell: bash
        run: |
          node --check planning-integrity-v235.js
          node --check completed-goal-guard-v177.js
          node --check planning-integrity-loader-v235.js
          node --check app-v419.js
          node --check docs/app-v419.js
          node --check service-worker-v419.js
          node --check service-worker-v402.js
          node <<'NODE'
          const fs = require('node:fs');
          const planning = fs.readFileSync('planning-integrity-v235.js', 'utf8');
          const completed = fs.readFileSync('completed-goal-guard-v177.js', 'utf8');
          for (const token of ['setTimeout(', 'setInterval(', 'requestAnimationFrame(', 'requestIdleCallback(', 'MutationObserver']) {
            if (planning.includes(token)) throw new Error(`planning hot-path token forbidden: ${token}`);
          }
          for (const token of ['setTimeout(', 'setInterval(', 'requestAnimationFrame(', 'requestIdleCallback(', 'MutationObserver', 'queueMicrotask(']) {
            if (completed.includes(token)) throw new Error(`completed-goal scheduling token forbidden: ${token}`);
          }
          for (const token of [
            'window.addEventListener("storage"',
            'window.addEventListener("pageshow"',
            'window.addEventListener("aldus:bootstrap-ready"',
            'window.addEventListener("aldus:post-bootstrap-maintenance-complete"'
          ]) {
            if (completed.includes(token)) throw new Error(`completed-goal automatic listener forbidden: ${token}`);
          }
          const replaceStart = planning.indexOf('function replaceStateIntegrityV388');
          const replaceEnd = planning.indexOf('};', replaceStart);
          if (planning.slice(replaceStart, replaceEnd).includes('reconcileDailyPlanOnStartup')) {
            throw new Error('replaceState ainda reconcilia dailyGoals automaticamente');
          }
          NODE
          cmp planning-integrity-v235.js docs/planning-integrity-v235.js
          cmp planning-integrity-loader-v235.js docs/planning-integrity-loader-v235.js
          cmp completed-goal-guard-v177.js docs/completed-goal-guard-v177.js
          cmp service-worker-v402.js docs/service-worker-v402.js
          grep -F 'app-v419.js?v=20260831-daily-goals-explicit-mutation-v419' docs/index.html
          grep -F 'automatic-mutation-disabled-v419' planning-integrity-v235.js
          grep -F 'automaticMutationDisabled: true' completed-goal-guard-v177.js
          grep -F '"v419"' published-service-workers.json

      - name: Run strict V419 regression set
        shell: bash
        run: |
          node --test \
            tests/v186-piece-audit-performance.test.js \
            tests/v365-planning-runtime.test.js \
            tests/v379-manual-goal-additive.test.js \
            tests/v406-daily-plan-authoritative-startup.test.js \
            tests/v407-planning-state-binding.test.js \
            tests/v410-daily-plan-post-bootstrap-reconcile.test.js \
            tests/v411-completed-goals-review-only.test.js \
            tests/v413-core-daily-plan-consistency.test.js \
            tests/v416-weekly-status-stability.test.js \
            tests/v417-daily-plan-deterministic-integrity.test.js \
            tests/v419-daily-goals-invariance.test.js
          node -e "require('./tests/current-release-contract.js').assertCurrentReleaseContract()"

      - name: Compare complete suite with V418 baseline
        shell: bash
        run: |
          set +e
          node --test tests/*.test.js > /tmp/candidate.tap 2>&1
          CANDIDATE_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          function failures(path) {
            const result = new Set();
            for (const line of fs.readFileSync(path, 'utf8').split(/\r?\n/)) {
              const match = line.match(/^\s*not ok\s+\d+\s+-\s+(.*)$/);
              if (match) result.add(match[1].trim());
            }
            return result;
          }
          const baseline = failures('/tmp/baseline.tap');
          const candidate = failures('/tmp/candidate.tap');
          const added = [...candidate].filter((name) => !baseline.has(name)).sort();
          const removed = [...baseline].filter((name) => !candidate.has(name)).sort();
          console.log(`baseline failing tests: ${baseline.size}`);
          console.log(`candidate failing tests: ${candidate.size}`);
          console.log(`historical failures removed: ${removed.length}`);
          console.log(`new failures: ${added.length}`);
          if (added.length) {
            console.error('NEW FAILURES:');
            for (const name of added) console.error(` - ${name}`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `BASELINE_FAILURES=${baseline.size}\nCANDIDATE_FAILURES=${candidate.size}\nREMOVED_FAILURES=${removed.length}\n`);
          NODE
          echo "candidate exit: ${CANDIDATE_EXIT}"
          tail -n 20 /tmp/candidate.tap || true

      - name: Commit validated release candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "V419: impedir mutações automáticas das metas" \
            -m "Validação: conjunto específico aprovado; suíte completa comparada à V418 com ${BASELINE_FAILURES} falha(s) na baseline, ${CANDIDATE_FAILURES} na candidata e zero falhas novas. Falhas históricas removidas: ${REMOVED_FAILURES}."
          git push origin HEAD:agent/daily-goals-invariance-v419
