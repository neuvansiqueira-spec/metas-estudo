name: V346 multitab finalize

on:
  push:
    branches:
      - fix/multitab-timer-simulado-v346

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar patch final V346
        run: node tools/apply-v346-finalize.mjs
      - name: Validar sintaxe
        run: |
          node --check storage-concurrency-v345.js
          node --check simulado-integracao-v314.js
          node --check bootstrap-integrity-loader-v345-core.js
          node --check service-worker.js
      - name: Testes focados e regressões próximas
        run: |
          node --test tests/v314-simulado-integracao.test.js tests/v345-storage-concurrency.test.js tests/v346-multitab-modules.test.js tests/v341-startup-interaction-recovery.test.js tests/v344-interaction-responsiveness.test.js
      - name: Remover mecanismo temporário e publicar somente na branch
        run: |
          rm -f tools/apply-v346-finalize.mjs .github/workflows/v346-multitab-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nenhuma alteração final para registrar."
          else
            git commit -m "V346: support timer and interactive simulado across tabs"
            git push origin HEAD:fix/multitab-timer-simulado-v346
          fi
