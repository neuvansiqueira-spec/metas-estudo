name: Testar v235 em navegador real

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar Chromium
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Validar restauração, preservação e persistência
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ timezoneId: 'America/Sao_Paulo' });
            const page = await context.newPage();
            page.on('dialog', (dialog) => dialog.dismiss());

            const base = 'https://neuvansiqueira-spec.github.io/metas-estudo/';
            await page.goto(`${base}?browser-v235=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.evaluate(async () => { if ('serviceWorker' in navigator) await navigator.serviceWorker.ready; });
            await page.reload({ waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForFunction(() => Boolean(globalThis.__ALDUS_PLANNING_INTEGRITY_V235__), null, { timeout: 60000 });

            const initial = await page.evaluate(() => ({
              today: todayISO(),
              runtime: globalThis.__ALDUS_PLANNING_INTEGRITY_V235__,
              footer: document.querySelector('.app-version')?.textContent || '',
              config: state.planning.config,
              override: state.planning.dailyGoalOverridesV235?.['2026-08-04'],
              targets: planningTargetsForDate('2026-08-04', state)
            }));
            assert.equal(initial.today, '2026-08-04');
            assert.equal(initial.runtime.version, '20260804-planejamento-metas-fabrica-integridade-v235');
            assert.match(initial.footer, /v235/);
            assert.equal(Number(initial.config.disciplinesPerDay), 5);
            assert.equal(Number(initial.config.topicsPerDay), 5);
            assert.equal(Number(initial.override?.disciplines), 5);
            assert.equal(Number(initial.targets.disciplines), 5);
            assert.equal(Number(initial.targets.topics), 5);

            const alignment = await page.evaluate(() => {
              const date = '2026-08-04';
              state.syllabusItems = Array.from({ length: 5 }, (_, index) => ({
                id: `teste-v235-${index + 1}`,
                discipline: `DISCIPLINA TESTE ${index + 1}`,
                topic: `Assunto teste ${index + 1}`,
                subject: `Assunto teste ${index + 1}`,
                status: 'Não iniciado',
                editalActive: true,
                agendavel: true,
                schedulable: true,
                weight: 5
              }));
              state.schedulableSettings = Object.fromEntries(state.syllabusItems.map((item) => [item.id, {
                availability: 'Agendável', mode: 'Estudo + questões', priority: true
              }]));
              state.contestSyllabusMap = [];
              state.dailyGoals = [
                {
                  id: 'concluida-v235', date, data: date,
                  discipline: 'DISCIPLINA TESTE 1', subject: 'Assunto teste 1', syllabusItemId: 'teste-v235-1',
                  origin: 'planejamento', status: 'Concluída', actualMinutes: 60, minutes: 60
                },
                {
                  id: 'automatica-antiga-v235', date, data: date,
                  discipline: 'ANTIGA', subject: 'Meta antiga', syllabusItemId: 'antiga-v235',
                  origin: 'planejamento', status: 'Pendente', actualMinutes: 0, minutes: 60
                }
              ];
              if (state.planning.dailyPlanAlignmentV174) delete state.planning.dailyPlanAlignmentV174[date];
              const candidates = buildPlanningScoreContext(state).candidates.map((item) => item.id);
              const result = ensureDailyPlanAlignedWithPlanningV174(state, date);
              const goals = state.dailyGoals.filter((goal) => (goal.date || goal.data) === date);
              return {
                candidates,
                report: result.report,
                total: goals.length,
                preserved: goals.find((goal) => goal.id === 'concluida-v235'),
                removedOld: !goals.some((goal) => goal.id === 'automatica-antiga-v235')
              };
            });
            assert.equal(alignment.candidates.length, 4, 'o assunto já concluído não deve voltar como candidato');
            assert.equal(alignment.total, 5);
            assert.equal(alignment.report.foundTopics, 5);
            assert.equal(alignment.report.found, 5);
            assert.equal(alignment.removedOld, true);
            assert.equal(alignment.preserved.actualMinutes, 60);

            await page.evaluate(() => {
              document.getElementById('planningDisciplinesPerDay').value = '6';
              document.getElementById('planningTopicsPerDay').value = '6';
              document.getElementById('planningConfigForm').dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
            });
            await page.waitForTimeout(1500);

            const saved = await page.evaluate(() => ({
              config: state.planning.config,
              snapshot: JSON.parse(localStorage.getItem('aldusPlanningManualGoalsV235') || 'null'),
              override: state.planning.dailyGoalOverridesV235?.['2026-08-04']
            }));
            assert.equal(Number(saved.config.disciplinesPerDay), 6);
            assert.equal(Number(saved.config.topicsPerDay), 6);
            assert.equal(Number(saved.snapshot.disciplines), 6);
            assert.equal(Number(saved.snapshot.topics), 6);
            assert.equal(Number(saved.override.disciplines), 6);

            await page.reload({ waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForFunction(() => Boolean(globalThis.__ALDUS_PLANNING_INTEGRITY_V235__), null, { timeout: 60000 });
            await page.waitForTimeout(1500);

            const persisted = await page.evaluate(() => ({
              config: state.planning.config,
              snapshot: JSON.parse(localStorage.getItem('aldusPlanningManualGoalsV235') || 'null'),
              targets: planningTargetsForDate('2026-08-04', state),
              footer: document.querySelector('.app-version')?.textContent || ''
            }));
            assert.equal(Number(persisted.config.disciplinesPerDay), 6);
            assert.equal(Number(persisted.config.topicsPerDay), 6);
            assert.equal(Number(persisted.snapshot.disciplines), 6);
            assert.equal(Number(persisted.targets.disciplines), 6);
            assert.equal(Number(persisted.targets.topics), 6);
            assert.match(persisted.footer, /v235/);

            console.log(JSON.stringify({ initial, alignment, saved, persisted }, null, 2));
            console.log('TESTE_BROWSER_V235_APROVADO');
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
