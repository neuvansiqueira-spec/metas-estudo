name: Publish stale-worker recovery v291

on:
  push:
    branches:
      - main
    paths:
      - qconcursos-subject-equivalence-v287.js
      - tests/qconcursos-subject-equivalence-v287.test.js
      - tools/sync-legacy-service-workers-v291.mjs
      - .github/workflows/publish-qc-subject-equivalence-v287.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-stale-worker-recovery-v291
  cancel-in-progress: false

jobs:
  apply-test-publish:
    if: ${{ false }} # V316: fluxo legado desativado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Prepare v291 release
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const VERSION = '20260809-atualizacao-worker-v291';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = VERSION;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          if (fs.existsSync('package-lock.json')) {
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
            lock.version = VERSION;
            if (lock.packages?.['']) lock.packages[''].version = VERSION;
            fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          }
          let bootstrap = fs.readFileSync('bootstrap-integrity-loader-v258-core.js', 'utf8');
          bootstrap = bootstrap.replace(
            /\["aldusAppBundleScript",\s*"app-v\d+\.js\?v=[^"]+"\]/,
            `["aldusAppBundleScript", "app-v291.js?v=${VERSION}"]`
          );
          if (!bootstrap.includes(`app-v291.js?v=${VERSION}`)) throw new Error('Bootstrap V291 não sincronizado.');
          fs.writeFileSync('bootstrap-integrity-loader-v258-core.js', bootstrap);
          fs.copyFileSync('bootstrap-integrity-loader-v258-core.js', 'docs/bootstrap-integrity-loader-v258-core.js');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build release
        run: npm run build

      - name: Synchronize legacy workers
        run: node tools/sync-legacy-service-workers-v291.mjs

      - name: Test release
        run: >-
          node --test
          tests/qconcursos-subject-equivalence-v287.test.js
          tests/qconcursos-subject-coherence-v286.test.js
          tests/question-registration-route.test.js
          tests/question-bank-filters-v225.test.js
          tests/v56-qc-catalog-numbering.test.js
          tests/v57-qc-complete-crosswalk.test.js
          tests/question-bank-performance-v282.test.mjs

      - name: Validate generated release
        run: |
          node --check qconcursos-subject-equivalence-v287.js
          node --check app-v291.js
          node --check service-worker-v291.js
          node --check service-worker-v282.js
          grep -q '20260809-atualizacao-worker-v291' package.json
          grep -q '20260809-atualizacao-worker-v291' docs/index.html
          grep -q 'app-v291.js?v=20260809-atualizacao-worker-v291' bootstrap-integrity-loader-v258-core.js
          grep -q 'refreshVisibleQconcursosLinkV290' app.bundle.js
          grep -q 'VERIFIED_DISCIPLINE_ROUTES' app.bundle.js
          grep -q 'questionQconcursosLinkStatusV290' app.bundle.js
          grep -q '20260809-atualizacao-worker-v291' service-worker-v282.js
          cmp -s service-worker.js service-worker-v282.js
          cmp -s service-worker.js docs/service-worker-v282.js
          cmp -s app.bundle.js docs/app.bundle.js
          cmp -s bootstrap-integrity-loader-v258-core.js docs/bootstrap-integrity-loader-v258-core.js

      - name: Commit generated release to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração adicional para publicar."
            exit 0
          fi
          git commit -m "fix: recupera atualização presa na V282 v291"
          git push origin HEAD:main
