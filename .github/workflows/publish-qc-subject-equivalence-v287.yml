name: Publish QC expanded mapping v290

on:
  push:
    branches:
      - main
    paths:
      - qconcursos-subject-equivalence-v287.js
      - tests/qconcursos-subject-equivalence-v287.test.js
      - .github/workflows/publish-qc-subject-equivalence-v287.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-qc-expanded-mapping-v290
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prepare v290 release
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const VERSION = '20260809-qconcursos-mapeamento-ampliado-v290';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = VERSION;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          if (fs.existsSync('package-lock.json')) {
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
            lock.version = VERSION;
            if (lock.packages?.['']) lock.packages[''].version = VERSION;
            fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          }
          let bootstrap = fs.readFileSync('bootstrap-integrity-loader-v258-core.js', 'utf8');
          bootstrap = bootstrap.replace(
            /\["aldusAppBundleScript",\s*"app-v\d+\.js\?v=[^"]+"\]/,
            `["aldusAppBundleScript", "app-v290.js?v=${VERSION}"]`
          );
          if (!bootstrap.includes(`app-v290.js?v=${VERSION}`)) throw new Error('Bootstrap V290 não sincronizado.');
          fs.writeFileSync('bootstrap-integrity-loader-v258-core.js', bootstrap);
          fs.copyFileSync('bootstrap-integrity-loader-v258-core.js', 'docs/bootstrap-integrity-loader-v258-core.js');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build release
        run: npm run build

      - name: Test QC expanded mapping
        run: >-
          node --test
          tests/qconcursos-subject-equivalence-v287.test.js
          tests/qconcursos-subject-coherence-v286.test.js
          tests/question-registration-route.test.js
          tests/question-bank-filters-v225.test.js
          tests/v56-qc-catalog-numbering.test.js
          tests/v57-qc-complete-crosswalk.test.js
          tests/question-bank-performance-v282.test.mjs

      - name: Validate generated release
        run: |
          node --check qconcursos-subject-equivalence-v287.js
          node --check app-v290.js
          node --check service-worker-v290.js
          grep -q '20260809-qconcursos-mapeamento-ampliado-v290' package.json
          grep -q '20260809-qconcursos-mapeamento-ampliado-v290' docs/index.html
          grep -q 'app-v290.js?v=20260809-qconcursos-mapeamento-ampliado-v290' bootstrap-integrity-loader-v258-core.js
          grep -q 'refreshVisibleQconcursosLinkV290' app.bundle.js
          grep -q 'VERIFIED_DISCIPLINE_ROUTES' app.bundle.js
          grep -q 'questionQconcursosLinkStatusV290' app.bundle.js
          grep -q 'audited-crosswalk-canonical-route' app.bundle.js
          grep -q 'QCONCURSOS_AUDITED_CROSSWALK' qconcursos-subject-equivalence-v287.js
          cmp -s app.bundle.js docs/app.bundle.js
          cmp -s bootstrap-integrity-loader-v258-core.js docs/bootstrap-integrity-loader-v258-core.js

      - name: Commit generated release to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração adicional para publicar."
            exit 0
          fi
          git commit -m "fix: publica mapeamento QC v290"
          git push origin HEAD:main
