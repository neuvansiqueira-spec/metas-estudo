name: Aplicar hotfix V623.2 do Calendário

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: ${{ !contains(github.event.head_commit.message, '[v6232-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar correções localizadas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('goal-calendar-export-v623.js')
          s = path.read_text(encoding='utf-8')
          if '20260915-calendario-exportacoes-v623-2' in s:
              print('V623.2 já aplicada.')
          else:
              s = s.replace('/* V623.1 — Calendário de Metas: exportações legíveis, timbre Aldus, Fábrica real e vínculo meta↔produto. */', '/* V623.2 — Calendário de Metas: PDF paisagem, status explícito de resumo/treino e exportações legíveis. */', 1)
              s = s.replace('const VERSION = "20260915-calendario-exportacoes-v623-1";', 'const VERSION = "20260915-calendario-exportacoes-v623-2";', 1)
              s = s.replace('@page{size:A4 portrait;margin:9mm 10mm 13mm;', '@page{size:A4 landscape;margin:8mm 8mm 12mm;', 1)
              s = s.replace('max-width:190mm!important', 'max-width:281mm!important', 1)
              s = s.replace('.aldus-cal-v623 table.acv-goals td{padding:1.8mm 2mm;border-bottom:.25mm solid ${COLORS.line};vertical-align:top;color:${COLORS.ink}!important}', '.aldus-cal-v623 table.acv-goals td{padding:1.8mm 2mm;border-bottom:.25mm solid ${COLORS.line};vertical-align:top;color:${COLORS.ink}!important;overflow-wrap:anywhere;word-break:break-word;min-width:0}', 1)
              s = s.replace('.aldus-cal-v623 .acv-record dl{display:grid;grid-template-columns:49mm 1fr;margin:0}', '.aldus-cal-v623 .acv-record dl{display:grid;grid-template-columns:55mm minmax(0,1fr);margin:0;min-width:0;max-width:100%;overflow-wrap:anywhere}', 1)
              s = s.replace('.aldus-cal-v623 .acv-record dt,.aldus-cal-v623 .acv-record dd{margin:0;padding:1.2mm 3mm;border-top:.2mm solid #E5E7EB}', '.aldus-cal-v623 .acv-record dt,.aldus-cal-v623 .acv-record dd{margin:0;padding:1.2mm 3mm;border-top:.2mm solid #E5E7EB;min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word}', 1)
              s = s.replace('.aldus-cal-v623 .acv-record a{color:${COLORS.blue}!important;text-decoration:underline;font-weight:600}', '.aldus-cal-v623 .acv-record a{color:${COLORS.blue}!important;text-decoration:underline;font-weight:600;min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-all}', 1)

              helper = '''  function factoryOutcomeForGoal(goal, report) {\n    const evidence = factoryEvidenceForGoal(goal, report);\n    const summaries = evidence.filter((item) => item.kind === "resumo");\n    const trainings = evidence.filter((item) => item.kind === "treino");\n    const summaryTypes = [...new Set(summaries.map(({ record }) => record.typeLabel).filter(Boolean))];\n    const trainingTypes = [...new Set(trainings.map(({ record }) => record.typeLabel).filter(Boolean))];\n    return {\n      evidence, summaryDone: summaries.length > 0, trainingDone: trainings.length > 0,\n      summaryLabel: summaries.length ? `REALIZADO — ${summaryTypes.join(", ")}` : "NÃO REALIZADO",\n      trainingLabel: trainings.length ? `REALIZADO — ${trainingTypes.join(", ")}` : "NÃO REALIZADO"\n    };\n  }\n'''
              marker = '  function goalState(goal, report) {\n'
              if marker not in s:
                  raise SystemExit('Não localizei goalState para inserir factoryOutcomeForGoal.')
              s = s.replace(marker, helper + marker, 1)
              s = s.replace('if (factoryEvidenceForGoal(goal, report).length) return "factory";', 'if (factoryOutcomeForGoal(goal, report).evidence.length) return "factory";', 1)

              new_goals = '''  function goalsTableHtml(goals, report) {\n    if (!goals.length) return `<p class="acv-empty">Nenhuma meta nesta data.</p>`;\n    return `<table class="acv-goals"><colgroup><col style="width:40%"><col style="width:11%"><col style="width:9%"><col style="width:9%"><col style="width:31%"></colgroup><thead><tr><th>Disciplina e assunto</th><th>Tipo</th><th>Planejado</th><th>Realizado</th><th>Situação / Fábrica</th></tr></thead><tbody>${goals.map((g)=>{const state=goalState(g,report),out=factoryOutcomeForGoal(g,report),summaryClass=out.summaryDone?"acv-factory-ok":"acv-factory-no",trainingClass=out.trainingDone?"acv-factory-ok":"acv-factory-no";return `<tr><td class="acv-subject"><strong>${esc(g.discipline)}</strong>${esc(g.subject)}</td><td>${esc(g.type)}</td><td>${esc(minutesLabel(g.plannedMinutes))}</td><td>${esc(minutesLabel(g.actualMinutes))}</td><td class="acv-factory-status"><div><b>Meta:</b> <span class="acv-pill ${state}">${esc(STATE_LABEL[state])}</span></div><div><b>Resumo do tema:</b> <span class="${summaryClass}">${esc(out.summaryLabel)}</span></div><div><b>Treino de questões:</b> <span class="${trainingClass}">${esc(out.trainingLabel)}</span></div></td></tr>`;}).join("")}</tbody></table>`;\n  }\n'''
              s, n = re.subn(r'  function goalsTableHtml\(goals, report\) \{.*?\n  \}\n(?=  function weekHtml)', new_goals, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Falha ao substituir goalsTableHtml: {n}')

              css_anchor = '.aldus-cal-v623 .acv-pill.pending{background:${COLORS.blueSoft};color:${COLORS.blue}!important}'
              css_extra = css_anchor + '.aldus-cal-v623 .acv-factory-status div{margin:.5mm 0;line-height:1.25}.aldus-cal-v623 .acv-factory-status b{color:#334155!important}.aldus-cal-v623 .acv-factory-ok{color:${COLORS.green}!important;font-weight:800}.aldus-cal-v623 .acv-factory-no{color:#334155!important;font-weight:700}'
              if css_anchor not in s:
                  raise SystemExit('Não localizei âncora CSS dos pills.')
              s = s.replace(css_anchor, css_extra, 1)

              old_svg_pattern = r'for\(const g of day\.goals\|\|\[\]\)\{const s=goalState\(g,report\),\[strong,soft\]=STATE_COLORS\[s\];.*?y\+=65;\}'
              new_svg = '''for(const g of day.goals||[]){const state=goalState(g,report),out=factoryOutcomeForGoal(g,report),[strong,soft]=STATE_COLORS[state],summaryText=`Resumo do tema: ${out.summaryDone?"REALIZADO":"NÃO REALIZADO"}`,trainingText=`Treino de questões: ${out.trainingDone?"REALIZADO":"NÃO REALIZADO"}`;p.push(`<rect x="${M}" y="${y}" width="${CW}" height="90" rx="10" fill="#fff" stroke="${COLORS.line}"/><rect x="${M}" y="${y}" width="8" height="90" rx="4" fill="${strong}"/>`);p.push(svgText(M+24,y+23,`${g.discipline} — ${g.subject}`,{size:17,weight:700,color:COLORS.navy,maxWidth:CW-260}));p.push(svgText(M+24,y+43,`${g.type} · ${minutesLabel(g.plannedMinutes)} planejado · ${minutesLabel(g.actualMinutes)} realizado`,{size:13,color:COLORS.muted,maxWidth:CW-260}));p.push(svgText(M+24,y+64,summaryText,{size:13,weight:800,color:out.summaryDone?COLORS.green:COLORS.muted,maxWidth:CW-270}));p.push(svgText(M+24,y+82,trainingText,{size:13,weight:800,color:out.trainingDone?COLORS.green:COLORS.muted,maxWidth:CW-270}));p.push(`<rect x="${W-M-210}" y="${y+13}" width="190" height="29" rx="15" fill="${soft}"/>`);p.push(svgText(W-M-115,y+33,STATE_LABEL[state],{size:13,weight:800,color:strong,anchor:"middle",maxWidth:175}));y+=98;}'''
              s, n = re.subn(old_svg_pattern, new_svg, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Falha ao substituir cartão SVG: {n}')

              new_calendar = '''  function calendarSheet(report){const cols=12,rows=letterheadRows("Calendário de metas",`Referência ${dateBR(report.referenceDate)} · ${report.scopeLabel} · ${dateTimeBR(report.generatedAt)}`,cols,3),merges=[];for(const period of report.periods){const start=rows.length+1;rows.push({height:26,cells:[{v:`${period.title.toUpperCase()} — ${periodRange(period.data)}`,s:XS.section},...Array.from({length:cols-1},()=>({v:"",s:XS.section}))]});merges.push(`A${start}:${columnName(cols)}${start}`);const m=periodMetrics(period.data,report),k=[["Metas",m.goals],["Concl./produzidas",m.recognized],["Cumprimento",`${m.percent}%`],["Planejado",minutesLabel(m.planned)],["Realizado",minutesLabel(m.actual)]];rows.push({cells:k.flatMap(([l])=>[{v:l,s:XS.kpiLabel},{v:"",s:XS.kpiLabel}]).concat([{v:"",s:XS.kpiLabel},{v:"",s:XS.kpiLabel}])});rows.push({height:24,cells:k.flatMap(([,v])=>[{v:v,s:XS.kpiValue},{v:"",s:XS.kpiValue}]).concat([{v:"",s:XS.kpiValue},{v:"",s:XS.kpiValue}])});rows.push({height:32,cells:["Data","Dia","Tipo do dia","Disciplina","Assunto","Tipo","Planejado (min)","Realizado (min)","Situação","Resumo do tema","Treino de questões","Prioridade"].map((v)=>({v,s:XS.header}))});let zebra=false;for(const day of period.data.days||[]){const goals=day.goals.length?day.goals:[null];for(const g of goals){const base=zebra?XS.zebra:XS.cell,num=zebra?XS.numberZebra:XS.number;if(!g){rows.push({cells:[{v:dateBR(day.date),s:base},{v:weekdayOf(day.date),s:base},{v:day.dayType,s:base},{v:"Sem metas",s:base},...Array.from({length:8},()=>({v:"",s:base}))]});continue;}const state=goalState(g,report),out=factoryOutcomeForGoal(g,report);rows.push({cells:[{v:dateBR(day.date),s:base},{v:weekdayOf(day.date),s:base},{v:day.dayType,s:base},{v:g.discipline,s:base},{v:g.subject,s:base},{v:g.type,s:base},{v:Number(g.plannedMinutes)||0,s:num},{v:Number(g.actualMinutes)||0,s:num},{v:STATE_LABEL[state],s:XS[state]},{v:out.summaryLabel,s:out.summaryDone?XS.factory:base},{v:out.trainingLabel,s:out.trainingDone?XS.factory:base},{v:g.priority,s:base}]});}zebra=!zebra;}rows.push(null);}return{name:"Calendário",cols:[12,7,16,26,40,14,13,13,18,30,30,12],rows,merges,freezeRow:5};}\n'''
              s, n = re.subn(r'  function calendarSheet\(report\)\{.*?\n(?=  function factorySheet)', new_calendar, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Falha ao substituir calendarSheet: {n}')

              api_old = 'summaryView,trainingView,buildReport,buildPrintHtml,buildSvg,buildWorkbookFiles,runExport'
              api_new = 'summaryView,trainingView,factoryOutcomeForGoal,buildReport,buildPrintHtml,buildSvg,buildWorkbookFiles,runExport'
              if api_old not in s:
                  raise SystemExit('Não localizei exportação da API.')
              s = s.replace(api_old, api_new, 1)
              path.write_text(s, encoding='utf-8')

          Path('docs/goal-calendar-export-v623.js').write_text(Path('goal-calendar-export-v623.js').read_text(encoding='utf-8'), encoding='utf-8')

          for loader in [Path('performance-emergency-v350.js'), Path('docs/performance-emergency-v350.js')]:
              t = loader.read_text(encoding='utf-8')
              t = t.replace('goal-calendar-export-v623.js?v=20260915-calendario-exportacoes-v623"', 'goal-calendar-export-v623.js?v=20260915-calendario-exportacoes-v623-2"')
              loader.write_text(t, encoding='utf-8')

          test = Path('tests/v623-calendar-export.test.js')
          t = test.read_text(encoding='utf-8').replace('V623.1', 'V623.2')
          t = t.replace('goal-calendar-export-v623.js?v=20260915-calendario-exportacoes-v623"', 'goal-calendar-export-v623.js?v=20260915-calendario-exportacoes-v623-2"')
          t = t.replace("  assert.match(html,/opacity:1!important/);", "  assert.match(html,/opacity:1!important/);\n  assert.match(html,/size:A4 landscape/);\n  assert.match(html,/max-width:281mm/);\n  assert.ok(html.includes('Resumo do tema:'));\n  assert.ok(html.includes('Treino de questões:'));\n  assert.ok(html.includes('REALIZADO'));")
          t = t.replace("  assert.ok(svg.includes('Produto elaborado'));", "  assert.ok(svg.includes('Produto elaborado'));\n  assert.ok(svg.includes('Resumo do tema: REALIZADO'));\n  assert.ok(svg.includes('Treino de questões: REALIZADO'));")
          t = t.replace("  assert.ok(by['xl/worksheets/sheet1.xml'].includes('Evidência na Fábrica'));", "  assert.ok(by['xl/worksheets/sheet1.xml'].includes('Resumo do tema'));\n  assert.ok(by['xl/worksheets/sheet1.xml'].includes('Treino de questões'));\n  assert.ok(by['xl/worksheets/sheet1.xml'].includes('REALIZADO'));")
          test.write_text(t, encoding='utf-8')
          PY

      - name: Validar JavaScript e testes V623.2
        run: |
          node --check goal-calendar-export-v623.js
          node --test tests/v623-calendar-export.test.js
          cmp -s goal-calendar-export-v623.js docs/goal-calendar-export-v623.js
          cmp -s performance-emergency-v350.js docs/performance-emergency-v350.js

      - name: Publicar hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nada a publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goal-calendar-export-v623.js docs/goal-calendar-export-v623.js performance-emergency-v350.js docs/performance-emergency-v350.js tests/v623-calendar-export.test.js
          git commit -m "fix(calendar): PDF paisagem e status explícito de resumo/treino [v6232-applied]"
          git push origin HEAD:main
