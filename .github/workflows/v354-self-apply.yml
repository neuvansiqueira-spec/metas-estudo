name: V354 aplicar correção da Pasta destino

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'v354-factory-destination-on-demand'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v354-factory-destination-on-demand
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Aplicar V354
        run: |
          node --check tools/apply-v354-factory-destination-runtime.mjs
          node tools/apply-v354-factory-destination-runtime.mjs

      - name: Validar V354 e regressões relacionadas
        run: |
          node --check factory-destination-integrity-v237.js
          node --check planning-integrity-loader-v235.js
          node --check service-worker.js
          node --check service-worker-v344.js
          node --test \
            tests/factory-destination-integrity-v237.test.js \
            tests/factory-destination-topic-links-v232.test.js \
            tests/v354-factory-destination-runtime.test.js \
            tests/v351-bootstrap-fast-path.test.js \
            tests/v352-active-service-worker-delivery.test.js \
            tests/v353-navigation-bootstrap-delivery.test.js
          cmp factory-destination-integrity-v237.js docs/factory-destination-integrity-v237.js
          cmp planning-integrity-loader-v235.js docs/planning-integrity-loader-v235.js
          cmp service-worker.js service-worker-v344.js
          cmp service-worker.js docs/service-worker.js
          cmp service-worker.js docs/service-worker-v344.js

      - name: Consolidar arquivos de runtime na branch
        run: |
          rm -f tools/apply-v354-factory-destination-runtime.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            factory-destination-integrity-v237.js \
            docs/factory-destination-integrity-v237.js \
            planning-integrity-loader-v235.js \
            docs/planning-integrity-loader-v235.js \
            service-worker.js \
            service-worker-v344.js \
            docs/service-worker.js \
            docs/service-worker-v344.js \
            tests/v354-factory-destination-runtime.test.js \
            tools/apply-v354-factory-destination-runtime.mjs
          git commit -m "V354: tira reconciliação pesada da Pasta destino do boot"
          git push origin HEAD:v354-factory-destination-on-demand
