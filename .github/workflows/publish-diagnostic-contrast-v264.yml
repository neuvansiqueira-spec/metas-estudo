name: Publicar contraste do diagnóstico V264

on:
  push:
    branches:
      - fix/diagnostico-contraste-v264
    paths:
      - .github/workflows/publish-diagnostic-contrast-v264.yml

permissions:
  contents: write

jobs:
  publish-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da correção
        uses: actions/checkout@v4
        with:
          ref: fix/diagnostico-contraste-v264
          fetch-depth: 0

      - name: Espelhar arquivos e atualizar entradas
        run: |
          mkdir -p docs
          cp duplicate-diagnostics-loader-v264.js docs/duplicate-diagnostics-loader-v264.js
          cp duplicate-diagnostics-contrast-v264.css docs/duplicate-diagnostics-contrast-v264.css
          cp duplicate-diagnostics-palette-v263.css docs/duplicate-diagnostics-palette-v263.css
          cp duplicate-diagnostics-v260.js docs/duplicate-diagnostics-v260.js
          cp duplicate-diagnostics-v260.css docs/duplicate-diagnostics-v260.css
          cp duplicate-diagnostics-ui-v261.js docs/duplicate-diagnostics-ui-v261.js
          cp duplicate-diagnostics-ui-v261.css docs/duplicate-diagnostics-ui-v261.css
          cp duplicate-diagnostics-ui-v261-stability.js docs/duplicate-diagnostics-ui-v261-stability.js
          cp service-worker-v166.js docs/service-worker-v166.js
          cp service-worker-v264.js docs/service-worker-v264.js
          python - <<'PY'
          from pathlib import Path
          import re

          replacement = (
              '  <!-- aldus-duplicate-diagnostics-v264 -->\n'
              '  <script id="aldusDuplicateDiagnosticsLoaderV264" '
              'src="duplicate-diagnostics-loader-v264.js?v=20260806-duplicate-diagnostics-contrast-v264"></script>'
          )
          pattern = re.compile(
              r'\s*<!-- aldus-duplicate-diagnostics-v(?:260|262|263|264) -->\s*'
              r'<script id="aldusDuplicateDiagnosticsLoaderV(?:260|262|263|264)" '
              r'src="duplicate-diagnostics-loader-v(?:260|262|263|264)\.js\?v=[^"]+"></script>'
          )
          for path in (Path('index.html'), Path('docs/index.html')):
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn('\n' + replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'Entrada do diagnóstico não encontrada em {path}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Validar arquivos
        run: |
          node --check duplicate-diagnostics-loader-v264.js
          node --check duplicate-diagnostics-v260.js
          node --check duplicate-diagnostics-ui-v261.js
          node --check duplicate-diagnostics-ui-v261-stability.js
          node --check service-worker-v264.js
          grep -q 'aldusDuplicateDiagnosticsLoaderV264' index.html
          grep -q 'duplicate-diagnostics-contrast-v264.css' duplicate-diagnostics-loader-v264.js
          cmp duplicate-diagnostics-contrast-v264.css docs/duplicate-diagnostics-contrast-v264.css
          cmp service-worker-v264.js docs/service-worker-v264.js

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar navegador de teste
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0

      - name: Executar teste visual local
        run: |
          python3 -m http.server 8123 >/tmp/aldus-v264-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > test-diagnostico-v264.cjs <<'NODE'
          const puppeteer = require('puppeteer-core');

          function assert(condition, message, details) {
            if (!condition) {
              console.error(`FALHA: ${message}`);
              if (details !== undefined) console.error(details);
              process.exitCode = 1;
            } else {
              console.log(`OK: ${message}`);
            }
          }

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              executablePath: process.env.CHROME_PATH || '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1842, height: 810, deviceScaleFactor: 1 });
            const errors = [];
            const failed = [];
            page.on('pageerror', error => errors.push(String(error)));
            page.on('requestfailed', request => {
              if (/duplicate-diagnostics-(loader-v264|contrast-v264|palette-v263|ui-v261|v260)/.test(request.url())) {
                failed.push(`${request.url()} :: ${request.failure()?.errorText || 'falha'}`);
              }
            });

            await page.goto('http://127.0.0.1:8123/#dashboard', { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForFunction(() => Boolean(globalThis.__aldusDuplicateDiagnosticsLoaderV264), { timeout: 60000 });
            await page.waitForSelector('[data-duplicate-diagnostics-open]', { timeout: 60000 });
            await page.evaluate(() => document.querySelector('[data-duplicate-diagnostics-open]')?.click());
            await page.waitForSelector('#aldusDuplicateDiagnosticsV260:not([hidden])', { visible: true, timeout: 60000 });
            await page.waitForFunction(() => document.querySelector('#aldusDuplicateDiagnosticsV260')?.classList.contains('aldus-dup-v261'), { timeout: 60000 });
            await new Promise(resolve => setTimeout(resolve, 1800));

            const result = await page.evaluate(() => {
              const q = selector => document.querySelector(selector);
              const s = selector => getComputedStyle(q(selector));
              return {
                loader: globalThis.__aldusDuplicateDiagnosticsLoaderV264?.version,
                contrastHref: q('#aldusDuplicateDiagnosticsContrastV264')?.href,
                contentBg: s('.aldus-dup-dialog-content').backgroundColor,
                toolbarBorder: s('.aldus-dup-toolbar').borderBottomWidth,
                statusImage: s('.aldus-dup-status').backgroundImage,
                guideLeft: s('.aldus-dup-v261-guide').borderLeftWidth,
                runText: s('.aldus-dup-run').color,
                filter: q('[data-dup-filter]')?.value,
                pageSize: q('[data-v261-page-size]')?.value,
                pairBorder: q('.aldus-dup-pair') ? s('.aldus-dup-pair').borderTopWidth : null,
                modalDisplayed: !q('#aldusDuplicateDiagnosticsV260')?.hidden
              };
            });

            assert(result.loader === '20260806-duplicate-diagnostics-contrast-v264', 'Carregador V264 ativo', result.loader);
            assert(result.contrastHref?.includes('duplicate-diagnostics-contrast-v264.css'), 'CSS de contraste V264 carregado', result.contrastHref);
            assert(result.contentBg === 'rgb(231, 239, 247)', 'Fundo separado dos cartões', result.contentBg);
            assert(result.toolbarBorder === '2px', 'Barra de controles com separação forte', result.toolbarBorder);
            assert(result.statusImage.includes('linear-gradient'), 'Faixa de status com alto contraste', result.statusImage);
            assert(result.guideLeft === '8px', 'Guia com barra lateral destacada', result.guideLeft);
            assert(result.runText === 'rgb(255, 255, 255)', 'Botão principal legível', result.runText);
            assert(result.filter === 'probable', 'Filtro padrão preservado', result.filter);
            assert(result.pageSize === '6', 'Paginação preservada', result.pageSize);
            assert(result.modalDisplayed, 'Modal aberto');
            assert(errors.length === 0, 'Sem erros JavaScript', errors);
            assert(failed.length === 0, 'Sem falhas nos arquivos do diagnóstico', failed);

            await page.screenshot({ path: 'diagnostico-v264.png', fullPage: false });
            await browser.close();
            if (process.exitCode) process.exit(process.exitCode);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node test-diagnostico-v264.cjs

      - name: Salvar evidência visual
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-v264-contraste
          path: diagnostico-v264.png

      - name: Gravar publicação na branch
        run: |
          rm .github/workflows/publish-diagnostic-contrast-v264.yml
          rm -f test-diagnostico-v264.cjs diagnostico-v264.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publica contraste reforçado do diagnóstico V264"
          git push origin HEAD:fix/diagnostico-contraste-v264
